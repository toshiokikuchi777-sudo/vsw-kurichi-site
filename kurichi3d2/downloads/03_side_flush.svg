<svg xmlns="http://www.w3.org/2000/svg" width="540mm" height="385mm" viewBox="0 0 540 385"><rect width="100%" height="100%" fill="white"/><text x="30" y="25" font-size="9" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">KURICH｜札の埋込断面：価格部は別途突出</text><text x="30" y="40" font-size="5" fill="#647885" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">V32 / 断面模式図 / 数値は実寸mm / 描画倍率15:1</text><rect x="63" y="75" width="5" height="150" fill="#bddcea" stroke="none" stroke-width="0.35"/><rect x="75" y="75" width="90" height="150" fill="#d9232e" stroke="none" stroke-width="0.35"/><rect x="120" y="75" width="45" height="125" fill="#ffffff" stroke="#237697" stroke-width="0.35"/><path d="M165,65L165,235" fill="none" stroke="#d9232e" stroke-width="0.4" stroke-dasharray="2 2"/><path d="M75,225L75,253" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M73.5,256.5L76.5,253.5" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M165,225L165,253" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M163.5,256.5L166.5,253.5" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M75,255L165,255" fill="none" stroke="#237697" stroke-width="0.4"/><text x="120.0" y="252" font-size="5" fill="#237697" text-anchor="middle" font-family="Hiragino Sans,Arial,sans-serif">全体の厚み 6.0</text><path d="M120,100L120,61" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M118.5,64.5L121.5,61.5" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M165,100L165,61" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M163.5,64.5L166.5,61.5" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M120,63L165,63" fill="none" stroke="#237697" stroke-width="0.4"/><text x="142.5" y="60" font-size="5" fill="#237697" text-anchor="middle" font-family="Hiragino Sans,Arial,sans-serif">札 3.0</text><text x="65" y="240" font-size="5" fill="#647885" text-anchor="middle" font-family="Hiragino Sans,Arial,sans-serif">ガラス側</text><text x="165" y="240" font-size="5" fill="#d9232e" text-anchor="middle" font-family="Hiragino Sans,Arial,sans-serif">正面：枠と札が同じ位置</text><text x="265" y="90" font-size="6" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">枠の裏面：z = 0</text><text x="265" y="109" font-size="6" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">凹み底／札の裏面：z = 3.0</text><text x="265" y="128" font-size="6" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">全札：厚み3／裏穴Ø5.0深さ2.2</text><text x="265" y="147" font-size="6" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">全札の表皮0.8／ピンØ4.8</text><text x="265" y="166" font-size="6" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">枠と札の表面：z = 6.0</text><text x="265" y="185" font-size="6" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">つなぎパーツ先端：z = 7.0</text><text x="30" y="285" font-size="5.5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">水色：厚み3mmの商品札（穴を避けた断面）</text><text x="30" y="300" font-size="5.5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">ピン先端z=5.0。穴天井z=5.2との隙間0.2mm。</text><text x="30" y="315" font-size="5.5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">札の外周には片側0.2mmの隙間。商品札上辺は横枠上端と一致。</text><text x="30" y="330" font-size="5.5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">カテゴリー札は下端を持って取り外せます。</text><text x="30" y="345" font-size="5.5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">商品札の受けは上辺が開放。上の細い横棒はありません。</text><text x="30" y="360" font-size="5.5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">価格前面z9.2／押さえバー前面z9.5（全厚）。保持力未確認。</text></svg>