161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">分解表示：¥／5／0／0 の4枚。装着時の全幅63.8mm。</text><text x="25" y="145" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">各台座15.8×7.8×3.2／裏側止まり穴Ø5.0×深さ1.8を2個</text><text x="25" y="160" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">穴中心間8mm／追加突起Ø4.8×高さ1.6／文字彫込み0.3</text><text x="25" y="175" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">¥・5・0・0を全カテゴリー文字の下に装着。5を6に替えて¥600。</text><text x="25" y="190" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">全カテゴリー価格は札前面の突起8個へ装着。文字位置は維持。</text><text x="25" y="205" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">価格台座は枠外へ突出なし／上端バー込み470×459.4。</text><text x="25" y="220" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">厚み：ベース6／追加突起先端7.6／価格タイル前面9.2。</text><text x="25" y="235" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">公開基準LDraw寸法を参考。純正同一形状・保持力は未検証。</text></svg>