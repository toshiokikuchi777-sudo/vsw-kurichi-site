troke-width=".35" stroke-dasharray="1 1"/><text x="185" y="141" font-size="9" fill="#161616" text-anchor="middle" font-family="Hiragino Sans,Arial,sans-serif">カテゴリー札</text><path d="M41.3,84.2L41.3,179" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M39.8,182.5L42.8,179.5" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M328.7,84.2L328.7,179" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M327.2,182.5L330.2,179.5" fill="none" stroke="#237697" stroke-width="0.4"/><path d="M41.3,181L328.7,181" fill="none" stroke="#237697" stroke-width="0.4"/><text x="185.0" y="178" font-size="5" fill="#237697" text-anchor="middle" font-family="Hiragino Sans,Arial,sans-serif">バー長さ95.8</text><text x="25" y="215" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">本体95.8×7.8×3.2／裏側の丸い止まり穴12個</text><text x="25" y="230" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">穴径5.0・深さ1.6／8mm間隔の既存突起にはめ込む</text><text x="25" y="245" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">バーの下端が札の上端を1.4mm覆い、正面への抜けを押さえる</text><text x="25" y="260" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">札との前後隙間0.3／バー裏z6.3・前面z9.5</text><text x="25" y="275" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">外す順：長いバーを手前へ外す → カテゴリー札を外す</text><text x="25" y="290" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">ベース外寸470×458／バー込み470×459.4×9.5</text><text x="25" y="305" font-size="5" fill="#161616" text-anchor="start" font-family="Hiragino Sans,Arial,sans-serif">バー自身の保持は突起とのはめ合い。実物保持力・PLA強度は未検証</text></svg>