  <text x="70" y="124" fill="#182b39" font-family="Arial, sans-serif" font-size="44" font-weight="800">左右にコの字パーツを縦3つずつ配置する構成</text>
  <text x="72" y="160" fill="#62717a" font-family="Arial, sans-serif" font-size="22">右はコの字、左は反転コの字。中央の縦仕切りは今は入れない。</text>

