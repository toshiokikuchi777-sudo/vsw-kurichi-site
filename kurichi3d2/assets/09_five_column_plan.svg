  <text x="55" y="577" font-size="6" fill="#161616" font-family="Hiragino Sans, Arial, sans-serif">要点：既存kurichi3dの470×458mmに合わせ、横5列運用に変更。中央にもカテゴリー札を置けるよう、縦仕切りは今は入れない。</text>
  <text x="55" y="595" font-size="5" fill="#647885" font-family="Hiragino Sans, Arial, sans-serif">この図は配置検討用です。左右コの字・縦仕切りなし対応のSTL化では、実冷凍庫の内寸、棚位置、保持方法を反映します。</text>
