<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">左右コの字パーツ各3個・縦仕切りなしの冷凍庫ディスプレイ案</title>
  <desc id="desc">右にコの字パーツを縦3つ、左に反転コの字パーツを縦3つ配置し、中央の縦仕切りをなくした構成を示す図。</desc>
