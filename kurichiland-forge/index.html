<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>ForgeCAD ギャラリー ｜ クリチランド（確認用）</title>
<style>
  :root{ --red:#E3261D; --yellow:#FFC20E; --ink:#241f1a; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#e7edf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}
  #app{position:fixed;inset:0}
  #hud{position:fixed;left:14px;top:14px;z-index:10;max-width:min(90vw,360px);background:rgba(36,31,26,.8);color:#fff;padding:12px 14px;border-radius:14px;border:2px solid var(--yellow)}
  #hud h1{margin:0 0 3px;font-size:15px} #hud h1 b{color:var(--yellow)}
  #hud .sub{font-size:11px;opacity:.85;line-height:1.6}
  #hud #meta{font-size:11px;opacity:.9;margin-top:6px}
  #models{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:0 8px}
  #models button{cursor:pointer;border:none;border-radius:999px;padding:9px 15px;font-weight:800;font-size:12.5px;background:var(--red);color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.22)}
  #models button.on{background:var(--yellow);color:var(--ink)}
  #models button.ghost{background:rgba(255,255,255,.92);color:var(--ink)}
  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--yellow);color:var(--ink);transition:opacity .4s}
  #loader b{color:var(--red)} .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>ForgeCAD <b>ギャラリー</b></h1>
  <div class="sub">ドラッグ＝回転／ホイール＝ズーム／右ドラッグ＝移動<br>下のボタンでモデル切替。GLBは <code>forgecad export glb</code> 出力。</div>
  <div id="meta"></div>
</div>
<div id="models"></div>
<div id="loader"><div style="font-size:20px;font-weight:900">ForgeCAD <b>Gallery</b></div><div style="font-size:12px;opacity:.8">読み込み中…</div></div>

<script>
(function(){ function fail(m){var l=document.getElementById('loader');if(!l)return;l.innerHTML='<div style="text-align:center;padding:22px;max-width:320px"><b style="font-size:18px;color:#241f1a">表示できませんでした</b><div style="font-size:12px;margin-top:8px;color:#241f1a">'+(m||'')+'<br>ローカルサーバで開いてください（file://不可）。</div></div>';l.classList.remove('hide');}
  window.__fail=fail; window.addEventListener('error',e=>{if(!window.__READY)fail(e.message)}); setTimeout(()=>{if(!window.__READY)fail('読み込みに失敗しました。')},8000);})();
</script>
<script type="module">
import * as THREE from './lib/three.module.js';
import { OrbitControls } from './lib/jsm/controls/OrbitControls.js';
import { GLTFLoader } from './lib/jsm/loaders/GLTFLoader.js';
try{

/* ==== ここにモデルを追加していくだけ ==== */
const MODELS = [
  { name:"ダイナーチェア",   file:"chair.glb" },
  { name:"ラウンジチェア",   file:"lounge.glb" },
  { name:"建物 白模型",      file:"building.glb" },
];

const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; app.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe7edf2);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.01,100000);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=0.08;
scene.add(new THREE.HemisphereLight(0xffffff,0x9aa7b0,1.0)); scene.add(new THREE.AmbientLight(0xffffff,0.35));
const sun=new THREE.DirectionalLight(0xfff4e2,1.5); sun.position.set(1,2,1.4); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0004; scene.add(sun);
const grid=new THREE.GridHelper(4000,40,0xb9c4cf,0xcfd8e0); scene.add(grid);
const ground=new THREE.Mesh(new THREE.CircleGeometry(4000,48),new THREE.MeshStandardMaterial({color:0xeef2f5,roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.y=-0.5; ground.receiveShadow=true; scene.add(ground);

const loader=new GLTFLoader(); let current=null;
function frame(obj){
  const box=new THREE.Box3().setFromObject(obj); const c=box.getCenter(new THREE.Vector3()); const s=box.getSize(new THREE.Vector3());
  // drop model onto grid (y=0)
  obj.position.y -= box.min.y; box.setFromObject(obj); box.getCenter(c);
  const r=Math.max(s.x,s.y,s.z);
  grid.scale.setScalar(Math.max(1, r/2000)); ground.scale.setScalar(Math.max(1, r/3500));
  sun.shadow.camera.left=-r; sun.shadow.camera.right=r; sun.shadow.camera.top=r; sun.shadow.camera.bottom=-r; sun.shadow.camera.far=r*6; sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(c.x+r, c.y+r*1.6, c.z+r*0.9); sun.target.position.copy(c); scene.add(sun.target);
  controls.target.copy(c); camera.near=r/500; camera.far=r*50; camera.updateProjectionMatrix();
  camera.position.set(c.x+r*1.1, c.y+r*0.85, c.z+r*1.4);
  document.getElementById('meta').textContent='寸法(mm): '+[s.x,s.y,s.z].map(n=>Math.round(n)).join(' × ');
}
function load(i){
  document.querySelectorAll('#models button[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  loader.load(MODELS[i].file+'?v=2',(g)=>{
    if(current) scene.remove(current);
    current=g.scene;
    if(MODELS[i].yUp!==true) current.rotation.x=-Math.PI/2;   // ForgeCADはZ-up→ビューアはY-up。立てる。
    current.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    scene.add(current); frame(current); window.__model=current; window.__READY=true;
    const l=document.getElementById('loader'); if(l){ l.classList.add('hide'); setTimeout(()=>l.remove(),500); }
  }, undefined, ()=>window.__fail('GLB読込エラー: '+MODELS[i].file));
}
const bar=document.getElementById('models');
MODELS.forEach((m,i)=>{ const b=document.createElement('button'); b.dataset.i=i; b.textContent=m.name; b.onclick=()=>load(i); bar.appendChild(b); });
const top=document.createElement('button'); top.className='ghost'; top.textContent='真上'; top.onclick=()=>{ if(!current)return; const box=new THREE.Box3().setFromObject(current); const c=box.getCenter(new THREE.Vector3()); const s=box.getSize(new THREE.Vector3()); controls.target.copy(c); camera.position.set(c.x+0.001,c.y+Math.max(s.x,s.z)*1.6,c.z); }; bar.appendChild(top);
const fs=document.createElement('button'); fs.className='ghost'; fs.textContent='⛶'; fs.onclick=()=>{ if(!document.fullscreenElement)document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }; bar.appendChild(fs);

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
function anim(){ requestAnimationFrame(anim); controls.update(); renderer.render(scene,camera); }
load(0); anim();
}catch(err){ if(window.__fail)window.__fail(err&&err.message); throw err; }
</script>
</body>
</html>
