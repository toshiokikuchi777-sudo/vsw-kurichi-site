 *       - 同じシェーダーでS3の色フィルター（tint）を乗算合成。3D文字/螺旋には一切影響しない
 * OFF: クワッドを非表示にし、直前の背景（色/グラデ）へ復帰＋（📷撮影が使っていなければ）トラック停止。
 * ------------------------------------------------------------------- */
const btnLiveBgEl=document.getElementById('btnLiveBg');
const BLOOM_BASE_STRENGTH=1.1; // 起動時のUnrealBloomPass初期値と一致させる
let bloomUserStrength=BLOOM_BASE_STRENGTH; // rngBloomユーザー設定値（liveBg中の自動減衰と分離管理）

/* S3: プリセットtint（夕焼けオレンジ・ネオンピンク・深海ブルー・モノクロ） */
const VF_PRESETS={
  '#ff7a3c':'夕焼けオレンジ',
  '#ff4fd8':'ネオンピンク',
  '#1f6fff':'深海ブルー',
};

const liveBgQuadUniforms={
  map:        { value:null },
  uvScale:    { value:new THREE.Vector2(1,1) },
  uvOffset:   { value:new THREE.Vector2(0,0) },
  tintColor:  { value:new THREE.Color(0xffffff) },
  tintStrength:{ value:0 },
  mono:       { value:0 },
};
function createLiveBgQuad(){
  const geo=new THREE.PlaneGeometry(1,1);
  const mat=new THREE.ShaderMaterial({
    uniforms: liveBgQuadUniforms,
    depthTest:false, depthWrite:false, toneMapped:false,
    vertexShader:`
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader:`
      uniform sampler2D map;
      uniform vec2 uvScale;
      uniform vec2 uvOffset;
      uniform vec3 tintColor;
      uniform float tintStrength;
      uniform float mono;
      varying vec2 vUv;
      void main(){
        vec2 uv = (vUv - 0.5) * uvScale + 0.5 + uvOffset;
        vec4 texel = texture2D(map, clamp(uv, 0.0, 1.0));
        vec3 col = texel.rgb;
        // S3: 色フィルター。mix(videoColor, videoColor*tintColor, strength)
        vec3 tinted = col * tintColor;
        col = mix(col, tinted, tintStrength);
        if(mono>0.5){
          float g = dot(col, vec3(0.299,0.587,0.114));
          col = vec3(g);
        }
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const mesh=new THREE.Mesh(geo, mat);
  mesh.renderOrder=-1000;
  mesh.frustumCulled=false;
  mesh.visible=false;
  scene.add(mesh);
  return mesh;
}
liveBgQuad=createLiveBgQuad();

/* リサイズ/カメラ変更時：クワッドをカメラ直前(near*1.05)に置き、その距離の視錐台サイズにジャストフィットさせる */
function updateLiveBgQuadGeometry(){
  if(!liveBgQuad) return;
  const dist=camera.near*1.05 + 0.05;
  const vFov=THREE.MathUtils.degToRad(camera.fov);
  const h=2*Math.tan(vFov/2)*dist;
  const w=h*camera.aspect;
  liveBgQuad.geometry.dispose();
  liveBgQuad.geometry=new THREE.PlaneGeometry(w, h);
  liveBgQuad.userData.dist=dist;
}
/* 毎フレーム：カメラの正面・向きへ完全追従させる（animate内から呼ぶ） */
function followCameraForLiveBgQuad(){
  if(!liveBgQuad || !liveBgQuad.visible) return;
  const dist=liveBgQuad.userData.dist || (camera.near*1.05+0.05);
  const dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  liveBgQuad.position.copy(camera.position).addScaledVector(dir, dist);
  liveBgQuad.quaternion.copy(camera.quaternion);
}
/* cover相当のUVクロップ：画面アスペクトとvideoアスペクトの差分だけ短辺側をトリミング（歪ませない） */
function updateLiveBgCoverUv(){
  if(!liveBgVideoEl || !liveBgVideoEl.videoWidth || !liveBgVideoEl.videoHeight) return;
  const screenAspect=innerWidth/innerHeight;
  const videoAspect=liveBgVideoEl.videoWidth/liveBgVideoEl.videoHeight;
  let sx=1, sy=1;
  if(videoAspect>screenAspect){
    // 映像の方が横長 → 横方向を切る
    sx=screenAspect/videoAspect;
  } else {
    // 映像の方が縦長（または同じ） → 縦方向を切る
    sy=videoAspect/screenAspect;
  }
  liveBgQuadUniforms.uvScale.value.set(sx, sy);
  liveBgQuadUniforms.uvOffset.value.set(0,0);
}

/* S3: 映像フィルター（tint）をシェーダuniformへ反映 */
function applyVideoFilterUniforms(){
  const c=vfColor ? hexToRgb(vfColor) : {r:255,g:255,b:255};
  liveBgQuadUniforms.tintColor.value.setRGB(c.r/255, c.g/255, c.b/255);
  liveBgQuadUniforms.tintStrength.value=vfMono ? Math.max(vfStrength,0.0001) : (vfColor ? vfStrength : 0);
  liveBgQuadUniforms.mono.value=vfMono?1:0;
}

async function enableLiveBg(){
  if(!window.isSecureContext){
    showAiState('このURLではカメラを使えません（🎥ムービー背景）', true);
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showAiState('このブラウザではカメラ機能を利用できません', true);
    return;
  }
  try{
    liveBgStream=await acquireSharedCamStream();
  }catch(e){
    showAiState(describeCameraError(e).split('\n')[0], true);

  }
  liveBgVideoEl=document.createElement('video');
  liveBgVideoEl.srcObject=liveBgStream;
  liveBgVideoEl.muted=true;
  liveBgVideoEl.playsInline=true;
  await liveBgVideoEl.play().catch(()=>{});
  liveBgTexture=new THREE.VideoTexture(liveBgVideoEl);
  liveBgTexture.colorSpace=THREE.SRGBColorSpace;
  liveBgQuadUniforms.map.value=liveBgTexture;
  updateLiveBgQuadGeometry();

  liveBgVideoEl.addEventListener('loadedmetadata', updateLiveBgCoverUv, { once:true });
  // ブルームがビデオ背景の明部で暴れないよう控えめに自動調整
  bloomPass.strength=bloomUserStrength*0.6;
  // 📷オーバーレイが開いていれば同ストリームを流用してプレビューさせる
  if(camOverlay.classList.contains('show') && !camStream){

function disableLiveBg(){

  btnLiveBgEl.classList.remove('on');

function flashShutter(){
  camFlashEl.classList.remove('flashing');

  void camFlashEl.offsetWidth;

/* video現在フレーム → 長辺960pxのJPEG dataURL（ミラー表示のまま保存＝左右反転して自然な向きに） */
function captureVideoFrameDataUrl(video){
  const vw=video.videoWidth||720, vh=video.videoHeight||960;
  const scale=Math.min(1, PHOTO_LONG_EDGE/Math.max(vw,vh));
  const cw=Math.max(1, Math.round(vw*scale)), ch=Math.max(1, Math.round(vh*scale));
  camCanvas.width=cw; camCanvas.height=ch;
  const ctx=camCanvas.getContext('2d');
  ctx.save();
  ctx.translate(cw,0); ctx.scale(-1,1); // プレビューと同じ左右ミラーで保存
  ctx.drawImage(video, 0,0, cw,ch);
  ctx.restore();
  return camCanvas.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY);
}

async function savePhotoToBridge(dataUrl){
  const res=await fetch(BRIDGE_ORIGIN+'/photo', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ dataUrl })
  });
  const json=await res.json().catch(()=>null);
  if(!res.ok || !json || !json.ok) throw new Error((json&&json.error)||'save failed');
  return json;
}

/* ポラロイド風の板ジオメトリ：白フチの薄い箱＋写真面はCanvasTextureで貼る */
function buildPolaroidGroup(dataUrl){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      const group=new THREE.Group();
      const frameW=44, frameH=52, frameDepth=1.6;
      const photoMargin=3.4, photoBottomMargin=11; // 下フチ広め

      // 白フチ本体（薄い箱）
      const frameGeo=new THREE.BoxGeometry(frameW, frameH, frameDepth);
      const frameMat=new THREE.MeshStandardMaterial({ color:0xf6f3ea, roughness:0.82, metalness:0.02 });
      const frameMesh=new THREE.Mesh(frameGeo, frameMat);
      frameMesh.castShadow=true; frameMesh.receiveShadow=true;
      group.add(frameMesh);

      // 写真面（正方形寄りにセンタークロップしたCanvasTexture）
      const photoW=frameW - photoMargin*2;
      const photoH=frameH - photoBottomMargin - photoMargin;
      const cv=document.createElement('canvas');
      const cvSize=512;
      cv.width=cvSize; cv.height=Math.round(cvSize*(photoH/photoW));
      const ctx=cv.getContext('2d');
      const srcAspect=img.width/img.height, dstAspect=cv.width/cv.height;
      let sx=0, sy=0, sw=img.width, sh=img.height;
      if(srcAspect>dstAspect){ sw=img.height*dstAspect; sx=(img.width-sw)/2; }
      else{ sh=img.width/dstAspect; sy=(img.height-sh)/2; }
      ctx.drawImage(img, sx,sy,sw,sh, 0,0, cv.width,cv.height);
      const photoTex=new THREE.CanvasTexture(cv);
      photoTex.colorSpace=THREE.SRGBColorSpace;
      photoTex.needsUpdate=true;

      const photoGeo=new THREE.PlaneGeometry(photoW, photoH);
      const photoMat=new THREE.MeshStandardMaterial({ map:photoTex, roughness:0.55, metalness:0.0, side:THREE.DoubleSide });
      const photoMesh=new THREE.Mesh(photoGeo, photoMat);
      const photoCenterY = frameH/2 - photoMargin - photoH/2;
      photoMesh.position.set(0, photoCenterY, frameDepth/2 + 0.03);
      photoMesh.castShadow=true;
      group.add(photoMesh);

      // 底辺をy=0に接地・ほんの少しランダム傾き
      group.position.y = frameH/2;
      group.rotation.z = (Math.random()-0.5)*0.14;
      group.rotation.y = (Math.random()-0.5)*0.05;

      // サイズを単語・モデルと同程度に正規化
      const scale = PHOTO_TARGET_SIZE/frameH;
      const outer=new THREE.Group();
      outer.add(group);
      outer.scale.setScalar(scale);
      resolve(outer);
    };
    img.onerror=()=>{
      // 万一の画像読み込み失敗時は簡易プレースホルダー板を返す
      const geo=new THREE.BoxGeometry(PHOTO_TARGET_SIZE*0.86, PHOTO_TARGET_SIZE, 1.6);
      const mat=new THREE.MeshStandardMaterial({ color:0xf6f3ea, roughness:0.82 });
      const mesh=new THREE.Mesh(geo, mat);
      mesh.position.y=PHOTO_TARGET_SIZE/2;
      const outer=new THREE.Group(); outer.add(mesh);
      resolve(outer);
    };
    img.src=dataUrl;
  });
}

async function addPhotoEntry(dataUrl, label){
  const group=await buildPolaroidGroup(dataUrl);
  const decision={ color:'#f6f3ea', material:'pearl', style:'normal', reason:'撮影した写真' };
  const entry=addEntryToSpiral(label||'写真', decision, group, 'photo');
  burstSparkle(spiralPoint(entry.t));
  return entry;
}

/* 撮影処理本体：canvasキャプチャ → ブリッジ保存（失敗してもin-memoryで続行）→ ポラロイド投入 */

/* 起動時復元：ブリッジ接続時、GET /photos の最新5枚を賑やかしとして自動投入 */
const PHOTO_RESTORE_LIMIT=5;
async function restoreRecentPhotos(){
  try{
    const res=await fetch(BRIDGE_ORIGIN+'/photos');
    if(!res.ok) throw new Error('http '+res.status);
    const json=await res.json();
    const list=(json && json.photos) || [];
    const picked=list.slice(0, PHOTO_RESTORE_LIMIT).reverse(); // 古い順に投入して自然に賑わわせる
    for(const p of picked){
      try{
        // p.url は "/kurichiland-forge/photos/…" というサイトルート相対パス。
        // 静的ファイルはブリッジ(8788)ではなくページと同じオリジンの静的サーバから配信されるため、
        // BRIDGE_ORIGINを付けずページ相対で取得する（generated/*.glbのURLの扱いと同様）。
        const imgRes=await fetch(p.url);
        if(!imgRes.ok) continue;
        const blob=await imgRes.blob();
        const dataUrl=await new Promise((resolve,reject)=>{
          const r=new FileReader();
          r.onload=()=>resolve(r.result);
          r.onerror=reject;
          r.readAsDataURL(blob);
        });
        await addPhotoEntry(dataUrl, p.name||'写真');
        await new Promise(r=>setTimeout(r, 160));
      }catch(e){ /* 個別の1枚失敗はスキップ */ }
    }
  }catch(e){ /* ブリッジ未接続時は静かにスキップ */ }
}

/* ---------------------------------------------------------------------
 * Y4) AI実況テロップ
 * 画面下部のテロップ帯。キュー式で1件ずつフェードイン→表示→フェードアウトする。
 * reasonが無い（フォールバック判定等）ケースはtickerShowを呼ばない＝嘘の実況をしない。
 * 設定パネルの「実況テロップ」スイッチでON/OFF（localStorage kland-vj-ticker）。

const tickerBarEl=document.getElementById('tickerBar');
const tickerTextEl=document.getElementById('tickerText');

})();
const tickerQueue=[];
let tickerBusy=false;
function tickerShow(text, opts){

  opts=opts||{};
  tickerQueue.push({ text, big:!!opts.big });

function pumpTickerQueue(){

  pumpTickerQueue._hideT=setTimeout(()=>{
    tickerBarEl.classList.remove('show');
    pumpTickerQueue._nextT=setTimeout(()=>{ tickerBusy=false; pumpTickerQueue(); }, 360);
  }, showMs);
}

/* ---------------------------------------------------------------------
 * Y1) 🎤ビートシンク
 * getUserMedia(audio)→AnalyserNodeで低域(約40-130Hz)のエネルギー移動平均を監視し、
 * 閾値超過の立ち上がりをキックとして検出。直近ビート間隔の中央値からBPMを推定して表示する。
 * ビート検出時：①bloom瞬間+0.35→200msで減衰 ②全entriesが位相をずらしてバウンス
 * ③スパークルバースト ④センターモデルがあれば軽くキック回転。
 * 無音/弱信号時も音量に応じた連続ゆらぎ(bloom±0.1)で「生きてる」感を出す。
 * ------------------------------------------------------------------- */
const btnBeatEl=document.getElementById('btnBeat');
const bpmTagEl=document.getElementById('bpmTag');
const rngBeatSensEl=document.getElementById('rngBeatSens');
const vBeatSensEl=document.getElementById('vBeatSens');

let beatOn=false;
let beatSensitivity=1.0;
(function loadBeatSensPref(){
  try{ const v=parseFloat(localStorage.getItem('kland-vj-beatsens')); if(!isNaN(v)) beatSensitivity=Math.max(0.4,Math.min(2,v)); }catch(e){}
  if(rngBeatSensEl) rngBeatSensEl.value=String(beatSensitivity);
  if(vBeatSensEl) vBeatSensEl.textContent=beatSensitivity.toFixed(2);
})();

let beatAudioCtx=null, beatAnalyser=null, beatSourceNode=null, beatDataArr=null;
let beatStream=null;
let beatBloomBoost=0;      // 瞬間加算分（200msで減衰）
let beatAmbient=0;         // 連続ゆらぎ（音量ベース）
let beatLowEnergyAvg=0;    // 低域エネルギーの移動平均（動的閾値のベースライン）
const beatIntervals=[];    // 直近ビート間隔(ms)
let beatLastTime=0;
let beatBpm=0;
let beatRafId=null;
let beatKickCooldown=0;    // 連続誤検出防止（ms残り）

function toastOnce(msg){ showAiState(msg, true); }

async function enableBeatSync(){
  if(!window.isSecureContext){ toastOnce('このURLではマイクを使えません（🎤ビートシンク）'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toastOnce('このブラウザではマイク機能を利用できません'); return; }
  try{
    beatStream=await navigator.mediaDevices.getUserMedia({ audio:true });
  }catch(e){
    toastOnce('マイクへのアクセスが許可されていません（🎤ビートシンク）');
    console.warn('beat mic error', e);
    return;
  }
  try{
    beatAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    beatSourceNode=beatAudioCtx.createMediaStreamSource(beatStream);
    beatAnalyser=beatAudioCtx.createAnalyser();
    beatAnalyser.fftSize=1024;
    beatAnalyser.smoothingTimeConstant=0.0; // 自前でスムージングするため生値を取る
    beatDataArr=new Uint8Array(beatAnalyser.frequencyBinCount);
    beatSourceNode.connect(beatAnalyser);
  }catch(e){
    toastOnce('マイク解析の初期化に失敗しました');
    disableBeatSync();
    return;
  }
  beatOn=true;
  beatLowEnergyAvg=0;
  beatIntervals.length=0;
  beatLastTime=0;
  beatBpm=0;
  btnBeatEl.classList.add('on');
  bpmTagEl.textContent='検出中…';
  beatLoop();
}
function disableBeatSync(){
  beatOn=false;
  btnBeatEl.classList.remove('on');
  bpmTagEl.textContent='';
  if(beatRafId){ cancelAnimationFrame(beatRafId); beatRafId=null; }
  if(beatSourceNode){ try{ beatSourceNode.disconnect(); }catch(e){} beatSourceNode=null; }
  if(beatAnalyser){ beatAnalyser=null; }
  if(beatAudioCtx){ try{ beatAudioCtx.close(); }catch(e){} beatAudioCtx=null; }
  if(beatStream){ beatStream.getTracks().forEach(tr=>tr.stop()); beatStream=null; }
  beatBloomBoost=0; beatAmbient=0;
}
btnBeatEl.addEventListener('click', ()=>{ beatOn ? disableBeatSync() : enableBeatSync(); });
if(rngBeatSensEl){
  rngBeatSensEl.addEventListener('input', ()=>{
    beatSensitivity=+rngBeatSensEl.value;
    vBeatSensEl.textContent=beatSensitivity.toFixed(2);
    try{ localStorage.setItem('kland-vj-beatsens', String(beatSensitivity)); }catch(e){}
  });
}

/* 低域(約40-130Hz)ビンのエネルギー平均を取り、移動平均比×感度しきい値でキックを検出する。
 * fftSize=1024・sampleRate依存でビン幅=sampleRate/1024（通常48000Hzなら約46.9Hz/bin）。
 * 40〜130Hzはおおよそbin index 1〜3。 */
function readBeatFrame(){
  if(!beatAnalyser || !beatDataArr) return null;
  beatAnalyser.getByteFrequencyData(beatDataArr);
  const sampleRate=beatAudioCtx.sampleRate||48000;
  const binHz=sampleRate/beatAnalyser.fftSize;
  const loBin=Math.max(1, Math.round(40/binHz));
  const hiBin=Math.max(loBin, Math.round(130/binHz));
  let sum=0, n=0;
  for(let i=loBin;i<=hiBin && i<beatDataArr.length;i++){ sum+=beatDataArr[i]; n++; }
  const lowEnergy = n ? sum/n/255 : 0; // 0..1
  // 全帯域の音量（連続ゆらぎ用）
  let sumAll=0;
  for(let i=0;i<beatDataArr.length;i++) sumAll+=beatDataArr[i];
  const overallLevel=sumAll/beatDataArr.length/255;
  return { lowEnergy, overallLevel };
}

function onBeatDetected(){
  const now=performance.now();
  if(beatLastTime>0){
    const interval=now-beatLastTime;
    if(interval>200 && interval<2000){ // 30〜300BPM相当のみ採用
      beatIntervals.push(interval);
      if(beatIntervals.length>8) beatIntervals.shift();
      if(beatIntervals.length>=3){
        const sorted=beatIntervals.slice().sort((a,b)=>a-b);
        const median=sorted[Math.floor(sorted.length/2)];
        beatBpm=Math.round(60000/median);
        bpmTagEl.textContent=beatBpm+' BPM';
      }
    }
  }
  beatLastTime=now;
  triggerBeatPulse();
}

/* ビート反応本体：bloom瞬間ブースト・全entriesバウンス・スパークル強化・センターキック回転。
 * beatPulse() として window.__textSpiral からもQA用に呼べる（マイク無しでも演出確認できるように）。 */
function triggerBeatPulse(){
  beatBloomBoost=Math.max(beatBloomBoost, 0.35);
  beatPulseTime=performance.now();
  burstSparkle(spiralPoint(Math.random()));
  if(appMode==='sea'){
    // 海モードでは画面内のランダム位置にも小バーストを足して賑やかに
    burstSparkle(new THREE.Vector3((Math.random()-0.5)*SEA.radius, SEA.swimYMin+Math.random()*(SEA.yMax-SEA.swimYMin), (Math.random()-0.5)*SEA.radius));
  }
  if(centerModel){
    centerModel.spinAngle += Math.PI*0.14; // 軽いキック回転
  }
}
let beatPulseTime=0;
const BEAT_BOUNCE_DURATION=260; // ms

function beatLoop(){
  if(!beatOn) return;
  beatRafId=requestAnimationFrame(beatLoop);
  const frame=readBeatFrame();
  if(!frame) return;
  const { lowEnergy, overallLevel } = frame;
  // 移動平均（ベースライン）を緩やかに更新
  beatLowEnergyAvg = beatLowEnergyAvg*0.92 + lowEnergy*0.08;
  const threshold = beatLowEnergyAvg*1.5/beatSensitivity + 0.05;
  if(beatKickCooldown>0) beatKickCooldown -= 16;
  if(lowEnergy>threshold && lowEnergy>0.12 && beatKickCooldown<=0){
    beatKickCooldown=180; // 連続検出防止（ms）
    onBeatDetected();
  }
  // 連続的なゆらぎ（音が弱くても常にわずかに反応）
  beatAmbient = overallLevel*0.1;
}

/* 毎フレーム呼び出し：bloomのビート/アンビエント反映、全entriesのビートバウンス */
function updateBeatVisuals(dt){
  // bloom: 瞬間ブーストを200msで減衰させつつ、連続ゆらぎも加算
  beatBloomBoost=Math.max(0, beatBloomBoost - dt*(0.35/0.2));
  const base = liveBgOn ? bloomUserStrength*0.6 : bloomUserStrength;
  bloomPass.strength = base + beatBloomBoost + (beatOn ? beatAmbient : 0);

  // 全entriesのバウンス（ビート直後のみ）
  if(beatPulseTime>0){
    const elapsed=performance.now()-beatPulseTime;
    if(elapsed<BEAT_BOUNCE_DURATION){
      const tt=elapsed/BEAT_BOUNCE_DURATION;
      words.forEach(w=>{
        const ph=(w.phase||0)*0.15; // 個体ごとにわずかに位相をずらす
        const localT=Math.max(0, Math.min(1, tt - ph*0.08));
        const bounce = Math.sin(localT*Math.PI); // 0→1→0
        const s=1 + bounce*0.08;
        w.group.scale.setScalar((w.baseScaleForBeat || (w.baseScaleForBeat = w.group.scale.x||1))*s);
      });
    } else if(elapsed<BEAT_BOUNCE_DURATION+40){
      // バウンス終了直後、基準スケールへ戻す
      words.forEach(w=>{ if(w.baseScaleForBeat) w.group.scale.setScalar(w.baseScaleForBeat); });
    }
  }
}

/* ---------------------------------------------------------------------
 * Y2) 💥DROP（クライマックス演出）
 * 発動：①白フラッシュ＋bloom一時2倍 ②全entries(単語/写真。センターモデルは除く)が
 * 中心から外向きへ爆発的に散る ③スパークル大量バースト ④約1.6秒後、各自の
 * 本来の軌道位置へease-in-outで再集結。非破壊（entriesのデータは不変・位置のみ演出）。
 * 連打はクールダウン2秒。ビートシンク中はDROP後1小節ぶんbloom高め維持。
 * センターモデルは爆発せずその場で1回転＋リング再発光。
 * ------------------------------------------------------------------- */
const btnDropEl=document.getElementById('btnDrop');
let dropCooldownUntil=0;
let dropActive=false;
let dropStartTime=0;
const DROP_EXPLODE_MS=1600;
const DROP_SUSTAIN_BLOOM_MS=2000; // ビートシンク中の1小節相当の高bloom維持

function dropNow(){
  const now=performance.now();
  if(now<dropCooldownUntil) return;
  dropCooldownUntil=now+2000;
  dropActive=true;
  dropStartTime=now;

  // ①白フラッシュ＋bloom一時2倍
  flashVj();
  const whiteFlash=document.getElementById('vjFlash');
  if(whiteFlash){ whiteFlash.classList.remove('flashing'); void whiteFlash.offsetWidth; whiteFlash.classList.add('flashing'); }
  dropBloomOverride = (liveBgOn ? bloomUserStrength*0.6 : bloomUserStrength) * 2;
  dropBloomOverrideUntil = now + 500;
  if(beatOn) dropBloomOverrideUntil = Math.max(dropBloomOverrideUntil, now + DROP_SUSTAIN_BLOOM_MS);

  // ②全entriesを中心から外向きに爆発
  words.forEach(w=>{
    const p=w.group.position;
    const dir=new THREE.Vector3(p.x, 0, p.z);
    if(dir.lengthSq()<1e-6) dir.set(Math.random()-0.5, 0, Math.random()-0.5);
    dir.normalize();
    const speed=90+Math.random()*140;
    w.dropVel = new THREE.Vector3(dir.x*speed, (0.4+Math.random()*0.8)*speed*0.5, dir.z*speed);
    w.dropSpin = new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
    w.dropOrigin = p.clone();
    w.dropT = 0;
  });

  // ③スパークル大量バースト
  for(let i=0;i<8;i++){
    burstSparkle(new THREE.Vector3((Math.random()-0.5)*SPIRAL.radius*1.4, SPIRAL.baseY+Math.random()*SPIRAL.height*0.7, (Math.random()-0.5)*SPIRAL.radius*1.4));
  }

  // ④センターモデルは爆発しない代わりにその場で1回転＋リング再発光
  if(centerModel){
    centerModel.dropSpinBoost = Math.PI*2; // 1回転ぶんを短時間で加算
    spawnCenterDebutRing();
  }

  btnDropEl.classList.remove('pulse'); void btnDropEl.offsetWidth; btnDropEl.classList.add('pulse');
  tickerShow('DROP!!', { big:true });
}
let dropBloomOverride=0, dropBloomOverrideUntil=0;

function easeInOutCubic(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }

function updateDropVisuals(dt){
  if(!dropActive) return;
  const now=performance.now();
  const elapsed=now-dropStartTime;
  const EXPLODE_PHASE=350; // ms: 爆発的に飛び散るフェーズ
  words.forEach(w=>{
    if(!w.dropVel) return;
    w.dropT += dt;
    if(elapsed<EXPLODE_PHASE){
      // 飛び散りフェーズ：速度に従って外側へ
      const k=dt;
      w.group.position.addScaledVector(w.dropVel, k);
      w.dropVel.multiplyScalar(0.965); // 減衰
      w.group.rotation.x += w.dropSpin.x*dt;
      w.group.rotation.y += w.dropSpin.y*dt;
      w.group.rotation.z += w.dropSpin.z*dt;
      w.dropReturnFrom = w.group.position.clone();
    } else if(elapsed<DROP_EXPLODE_MS){
      // 再集結フェーズ：現在位置から本来の軌道位置へease-in-outで戻す
      const homePos = appMode==='sea'
        ? (w.sea ? w.sea.pos : spiralPoint(w.t))
        : spiralPoint(w.t);
      const tt=Math.min(1, (elapsed-EXPLODE_PHASE)/(DROP_EXPLODE_MS-EXPLODE_PHASE));
      const eased=easeInOutCubic(tt);
      if(!w.dropReturnFrom) w.dropReturnFrom=w.group.position.clone();
      w.group.position.lerpVectors(w.dropReturnFrom, homePos, eased);
      w.group.rotation.x *= (1-eased*0.3);
      w.group.rotation.z *= (1-eased*0.3);
    } else {
      // 演出終了：通常の placeEntry に委ねる
      delete w.dropVel; delete w.dropSpin; delete w.dropOrigin; delete w.dropT; delete w.dropReturnFrom;
    }
  });
  if(elapsed>=DROP_EXPLODE_MS){
    dropActive=false;
  }
  // bloomオーバーライドの減衰
  if(now<dropBloomOverrideUntil){
    const base=(liveBgOn ? bloomUserStrength*0.6 : bloomUserStrength);
    const remain=(dropBloomOverrideUntil-now)/((beatOn?DROP_SUSTAIN_BLOOM_MS:500));
    bloomPass.strength=Math.max(bloomPass.strength, base + (dropBloomOverride-base)*Math.max(0,Math.min(1,remain)));
  }
  // センターモデルの1回転演出
  if(centerModel && centerModel.dropSpinBoost>0){
    const step=Math.min(centerModel.dropSpinBoost, dt*Math.PI*2.4);
    centerModel.spinAngle += step;
    centerModel.dropSpinBoost -= step;
  }
}
btnDropEl.addEventListener('click', dropNow);
addEventListener('keydown', e=>{
  if(e.code==='Space' && e.shiftKey){
    e.preventDefault();

  }
});

/* ---------------------------------------------------------------------
 * Y3) 🧠AI連想モード
 * ONの間、約12秒間隔（±3秒ランダム）で直近追加語からAIに連想語を求め自動投入する。
 * ブリッジ契約: POST {ai}/ai {"assoc":"海","avoid":["クジラ","潮",...]}
 *   → {"word":"灯台","reason":"海を見守る光"}
 * まだ未実装/失敗する場合は内蔵の連想辞書＋簡易連鎖ロジックへフォールバックし、
 * トグルは常に機能する。AI追加語は🤖バッジ＋紫フラッシュ＋テロップ演出で差別化。
 * コードレイン表示中（ジョブ実行中）はタイマーを一時停止する。
 * ------------------------------------------------------------------- */
const btnAssocEl=document.getElementById('btnAssoc');
let assocOn=false;
let assocTimer=null;
const assocRecentWords=[]; // 直近10語（avoid用）

/* 内蔵フォールバック連想辞書（種語→連想候補の配列。約30語規模のシード） */
const ASSOC_SEED_DICT={
  '海':['波','灯台','潮風','貝殻','水平線','漁船','珊瑚'],
  '空':['雲','星','虹','風','鳥','太陽','月'],
  '山':['雪','森','岩','霧','滝','谷','頂'],
  '花':['蝶','蜜','香り','蕾','花束','庭','露'],
  '光':['影','鏡','虹','星屑','灯り','煌めき'],
  '夜':['月','星','静寂','夢','灯火','闇'],
  '金':['宝','冠','輝き','富','太陽','鍵'],
  '氷':['雪','霜','結晶','冷気','氷河'],
  '炎':['灰','熱','太陽','溶岩','火花'],
  '風':['嵐','そよ風','旗','凧','雲'],
  '夢':['眠り','願い','幻','記憶','未来'],
  'クリチランド':['ハリチ','冒険','笑顔','旗','出発'],
};
const ASSOC_FALLBACK_POOL=['星屑','記憶','旅路','余韻','鼓動','静寂','煌めき','足跡','残響','蜃気楼','花びら','潮騒','灯台','蜘蛛の糸','万華鏡','陽炎','こだま','水面','雫','羅針盤'];

function assocFallbackDecide(seedWord, avoidList){
  const avoidSet=new Set(avoidList||[]);
  let candidates=ASSOC_SEED_DICT[seedWord] ? ASSOC_SEED_DICT[seedWord].slice() : [];
  // 文字連鎖：種語の先頭・末尾の文字を含む候補をプールから拾う（簡易連鎖ロジック）
  if(seedWord && seedWord.length){
    const headCh=seedWord[0], tailCh=seedWord[seedWord.length-1];
    ASSOC_FALLBACK_POOL.forEach(w=>{
      if(w.includes(headCh) || w.includes(tailCh)) candidates.push(w);
    });
  }
  candidates = candidates.concat(ASSOC_FALLBACK_POOL);
  const filtered=candidates.filter(w=>w && !avoidSet.has(w));
  const pick = filtered.length ? filtered[Math.floor(Math.random()*filtered.length)] : ('連想'+Math.floor(Math.random()*999));
  const reasons=['ふと浮かんだ言葉','そこから連なるイメージ','余韻から生まれた一語','響き合う言葉'];
  return { word:pick, reason:reasons[Math.floor(Math.random()*reasons.length)] };
}

async function fetchAssocWord(seedWord, avoidList){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), 6000);
  try{
    const res=await fetch(BRIDGE_ORIGIN+'/ai', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ assoc: seedWord, avoid: avoidList }),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if(!res.ok) throw new Error('http '+res.status);
    const json=await res.json();
    if(!json || json.error || !json.word) throw new Error('invalid assoc response');
    const word=String(json.word).trim().slice(0,24);
    if(!word) throw new Error('empty word');
    return { word, reason: json.reason||'', ai:true };
  }catch(e){
    clearTimeout(timer);
    return null;
  }
}

function pickAssocSeed(){
  if(assocRecentWords.length) return assocRecentWords[assocRecentWords.length-1];
  if(words.length) return words[words.length-1].text;
  return 'クリチランド';
}

function trackAssocRecent(word){
  assocRecentWords.push(word);
  if(assocRecentWords.length>10) assocRecentWords.shift();
}

async function runAssocTick(){
  if(!assocOn) return;
  // ジョブ実行中（コードレイン表示中）は見せ場の邪魔をしないよう一時停止
  if(codeRainPanel.group.visible){ scheduleAssocTick(); return; }
  const seed=pickAssocSeed();
  let result=await fetchAssocWord(seed, assocRecentWords);
  let usedFallback=false;
  if(!result){
    result=assocFallbackDecide(seed, assocRecentWords);
    usedFallback=true;
  }
  const word=result.word;
  trackAssocRecent(word);
  // ビジュアル判定はAI(color/material)を優先、無ければ通常のsubmitWordと同じ経路（AI優先→フォールバック）
  let decision=await fetchAiDecision(word);
  let decisionFallback=false;
  if(!decision){ decision=heuristicDecide(word); decisionFallback=true; }
  decision.aiAssoc=true; // 🤖バッジ用フラグ
  decision.assocReason=result.reason||'';
  const entry=addWordEntry(word, decision);
  // 登場演出差別化：紫フラッシュ＋テロップにreasonを流す
  flashAssocPurple();
  if(result.reason) tickerShow('『'+word+'』— '+result.reason);
  scheduleAssocTick();
}
function scheduleAssocTick(){
  if(!assocOn) return;
  clearTimeout(assocTimer);
  const delay=(12+ (Math.random()*6-3))*1000; // 12秒±3秒
  assocTimer=setTimeout(runAssocTick, Math.max(3000, delay));
}
function flashAssocPurple(){
  const el=document.getElementById('vjFlash');
  if(!el) return;
  el.style.background='radial-gradient(ellipse at 50% 46%, rgba(166,139,255,.55), rgba(166,139,255,0) 70%)';
  el.classList.remove('flashing'); void el.offsetWidth; el.classList.add('flashing');
  setTimeout(()=>{ el.style.background=''; }, 520);
}
function setAssocMode(on){
  assocOn=!!on;
  btnAssocEl.classList.toggle('on', assocOn);
  try{ localStorage.setItem('kland-vj-assoc', assocOn?'1':'0'); }catch(e){}
  clearTimeout(assocTimer);
  if(assocOn) scheduleAssocTick();
}
btnAssocEl.addEventListener('click', ()=> setAssocMode(!assocOn));
(function restoreAssocPref(){
  let on=false;
  try{ on = localStorage.getItem('kland-vj-assoc')==='1'; }catch(e){}
  if(on) setAssocMode(true);
})();

/* ---------------------------------------------------------------------
 * Z) 観客スマホ参加（say.html連携）
 * 📱ボタンで観客参加パネルを開閉。起動時に {bridge}/lanip でLAN IPを取得し、
 * http://<ip>:8787/kurichiland-forge/say.html を大きなQRで表示する
 * （lib/qrcode.min.jsのQRCodeコンストラクタを使用）。
 * ip取得不能時（スパイラル起動.commandからの起動でない等）は案内文を出す。

 * ------------------------------------------------------------------- */
const AUDIENCE_INTRO_DURATION=0.8; // 飛び込み演出の時間(s)
const AUDIENCE_POLL_INTERVAL_MS=2000;
const AUDIENCE_INTAKE_MIN_GAP_MS=1200; // 連続大量流入時の間引き：最大1語/1.2秒
const AUDIENCE_QR_PORT=8787; // say.htmlは8787番ポートで配信される想定（QR埋め込みURL用）

/* ---- 観客ワードのポーリング ---- */
function ensureAudiencePolling(){
  if(audiencePollActive) return;
  audiencePollActive=true;
  scheduleAudiencePoll(true);
}
function scheduleAudiencePoll(immediate){
  clearTimeout(scheduleAudiencePoll._t);
  scheduleAudiencePoll._t=setTimeout(pollAudienceQueue, immediate ? 0 : AUDIENCE_POLL_INTERVAL_MS);
}
async function pollAudienceQueue(){
  if(!audiencePollActive) return;
  try{
    // 初回：過去分は取り込まず「現在のnext」だけ確定させる
    if(audienceSeqNext==null){
      const res=await fetch(BRIDGE_ORIGIN+'/say/queue?from=999999999');
      if(res.ok){
        const json=await res.json();
        audienceSeqNext = (json && typeof json.next==='number') ? json.next : 1;
      } else {
        audienceSeqNext=1;
      }
    } else {
      const res=await fetch(BRIDGE_ORIGIN+'/say/queue?from='+encodeURIComponent(audienceSeqNext-1));
      if(res.ok){
        const json=await res.json();
        const items=(json && Array.isArray(json.items)) ? json.items : [];
        items.forEach(it=>{
          if(it && typeof it.word==='string' && it.word){
            audienceIntakeQueue.push(it.word);
          }
        });
        if(json && typeof json.next==='number') audienceSeqNext=json.next;
        if(items.length) pumpAudienceIntake();
      }
    }
  }catch(e){ /* ブリッジ未接続時は静かにスキップ、次回リトライ */ }
  scheduleAudiencePoll(false);
}

/* 連続大量流入対策：最大1語/1.2秒に間引いて取り込む */
function pumpAudienceIntake(){
  if(audienceIntakeBusy) return;
  const now=performance.now();
  const wait=Math.max(0, AUDIENCE_INTAKE_MIN_GAP_MS-(now-audienceLastIntakeAt));
  audienceIntakeBusy=true;
  setTimeout(()=>{
    audienceIntakeBusy=false;
    const word=audienceIntakeQueue.shift();
    audienceLastIntakeAt=performance.now();
    if(word) intakeAudienceWord(word);
    if(audienceIntakeQueue.length) pumpAudienceIntake();
  }, wait);
}

/* 観客ワード1件を取り込み：AI判定→3D化→飛び込み演出（画面端からズームイン）＋スパークル＋テロップ */
async function intakeAudienceWord(word){
  let decision=await fetchAiDecision(word);
  let usedFallback=false;
  if(!decision){ decision=heuristicDecide(word); usedFallback=true; }
  decision.audience=true; // 📱バッジ用フラグ
  const entry=addWordEntry(word, decision);
  // 飛び込み開始位置：画面端（ランダムな左右）からのオフセットを螺旋座標系に射影して設定
  const side = Math.random()<0.5 ? -1 : 1;
  const dirRight=new THREE.Vector3(); camera.getWorldDirection(dirRight); // カメラ前方
  const camRight=new THREE.Vector3().crossVectors(dirRight, camera.up).normalize();
  const target=entry.group.position.clone();
  entry.introFrom = target.clone().add(camRight.multiplyScalar(side*260)).add(new THREE.Vector3(0, 40, 0));
  entry.introT=0;
  entry.group.position.copy(entry.introFrom);
  entry.group.scale.setScalar((entry.group.scale.x||1)*0.15);
  burstSparkle(spiralPoint(entry.t));
  flashAudienceGreen();
  tickerShow('📱『'+word+'』が届きました！');
}
function flashAudienceGreen(){
  const el=document.getElementById('vjFlash');
  if(!el) return;
  el.style.background='radial-gradient(ellipse at 50% 46%, rgba(127,255,200,.5), rgba(127,255,200,0) 70%)';

function saveVfPref(){
  try{ localStorage.setItem('kland-vf', JSON.stringify({ color:vfColor, strength:vfStrength, mono:vfMono })); }catch(e){}
}
function loadVfPref(){
  try{
    const raw=localStorage.getItem('kland-vf');
    if(!raw) return;
    const obj=JSON.parse(raw);
    if(obj){
      if(obj.color===null || /^#[0-9a-fA-F]{6}$/.test(obj.color||'')) vfColor=obj.color||null;
      if(typeof obj.strength==='number') vfStrength=Math.max(0, Math.min(1, obj.strength));
      vfMono=!!obj.mono;
    }
  }catch(e){}
}
function updateVideoFilterPanelUi(){
  const section=document.getElementById('videoFilterSection');
  if(section) section.classList.toggle('dim', !liveBgOn);
  document.querySelectorAll('.vfSwatch').forEach(el=>{
    const key=el.dataset.vf;
    const isActive = key==='mono' ? (vfMono && !vfColor) : (!vfMono && vfColor===key);
    el.classList.toggle('active', isActive);
  });
  const picker=document.getElementById('vfColorPicker');
  if(picker && vfColor) picker.value=vfColor;
  const rng=document.getElementById('rngVfStrength');
  const vLabel=document.getElementById('vVfStrength');
  const pct=Math.round(vfStrength*100);
  if(rng) rng.value=String(pct);
  if(vLabel) vLabel.textContent=pct+'%';
}
function setVfPreset(key){
  if(key==='mono'){
    vfMono=true; vfColor=null;
    if(vfStrength<=0) vfStrength=1; // モノクロは強さ0だと効果が見えないため既定でON
  } else {
    vfMono=false; vfColor=key;
    if(vfStrength<=0) vfStrength=0.5;
  }
  applyVideoFilterUniforms();
  updateVideoFilterPanelUi();
  saveVfPref();
}
function setVfColor(hex){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex||'')) return;
  vfMono=false; vfColor=hex;
  applyVideoFilterUniforms();
  updateVideoFilterPanelUi();
  saveVfPref();
}
function clearVfFilter(){
  vfColor=null; vfMono=false; vfStrength=0;
  applyVideoFilterUniforms();
  updateVideoFilterPanelUi();
  saveVfPref();
}
function setVfStrength(pct){
  vfStrength=Math.max(0, Math.min(1, pct/100));
  applyVideoFilterUniforms();
  updateVideoFilterPanelUi();
  saveVfPref();
}

/* ---------------------------------------------------------------------
 * 11) アニメーションループ
 * ------------------------------------------------------------------- */
const clock=new THREE.Clock();
let hueShift=0;
let turntableAngle=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05, clock.getDelta());

  // 単語を螺旋に沿って進める
  words.forEach(w=>placeEntry(w, dt));

  // Y1: ビートシンクのbloom/バウンス反映（音が無くても連続ゆらぎがある）。
  // bloomPass.strengthの基準値をここで先に確定させ、DROPのbloom倍増(Y2)はこの後に上乗せする。
  updateBeatVisuals(dt);

  // Y2: DROP演出（爆散→再集結）。placeEntryの後に呼び、position/rotationを上書きする。
  updateDropVisuals(dt);

  // センターステージのAIモデル：登場イージング＋自転＋浮遊
  placeCenterModel(dt);
  updateCenterRings();
  updateCameraFocusAnim();
  updateCodeRain(dt);

  // dance文字の個別ウェーブ
  const now=performance.now()*0.001;
  words.forEach(w=>{
    if(w.decision.style==='dance' && w.group.userData.danceGroups){
      w.group.userData.danceGroups.forEach(sg=>{
        const ph=sg.userData.phase;
        sg.position.y = Math.sin(now*3.2+ph)*4.5;
        sg.rotation.z = Math.sin(now*2.4+ph)*0.16;
      });
    }
  });

  // 虹ラインの色相を流す（スパイラルモードのみ意味を持つが、非表示時は計算コストも軽いので継続してOK）
  hueShift += dt*40;
  updateSpiralLineColors(hueShift);

  // X1: 光のカーテン（海モード）のゆらぎ
  updateLightCurtains(dt, now);

  // スパークル／泡 漂わせる（モードでロジックを切替）
  const posAttr=sparkGeo.getAttribute('position');
  const colAttr=sparkGeo.getAttribute('color');
  const tmpC=new THREE.Color();
  if(appMode==='sea'){
    // 泡：下から上へゆっくり・左右に揺らぎながら上昇。天井付近で下からループ再登場。
    for(let i=0;i<SPARK_COUNT_MAX;i++){
      const d=sparkData[i];
      d.t += dt*0.09*d.speed*(0.4+sparkleAmount);
      if(d.t>1) d.t-=1;
      const baseY=SEA.yMin + d.t*(SEA.yMax-SEA.yMin);
      const wobble=Math.sin(now*d.speed*1.6+d.phase)*(4+d.rad*0.08);
      const px=Math.cos(d.ang)*d.rad*0.5 + Math.sin(now*0.3+d.phase)*wobble*0.5;
      const pz=Math.sin(d.ang)*d.rad*0.5 + Math.cos(now*0.3+d.phase)*wobble*0.5;
      posAttr.setXYZ(i, px, baseY, pz);
      let bright=0.5+0.3*Math.sin(now*2+d.phase);
      if(d.burst>0){ bright=1.0; d.burst=Math.max(0, d.burst-dt*1.4); }
      tmpC.setRGB(0.85+bright*0.15, 0.94+bright*0.06, 1.0);
      colAttr.setXYZ(i, tmpC.r, tmpC.g, tmpC.b);
    }
  } else {
    for(let i=0;i<SPARK_COUNT_MAX;i++){
      const d=sparkData[i];
      d.t += dt*0.02*d.speed*(0.4+sparkleAmount);
      if(d.t>1) d.t-=1;
      const p=spiralPoint(d.t);
      const ang=d.ang + now*0.3*d.speed;
      const wobble=Math.sin(now*d.speed*2+d.phase)*6;
      const px=p.x+Math.cos(ang)*(d.rad+wobble);
      const pz=p.z+Math.sin(ang)*(d.rad+wobble);
      const py=p.y+d.yOff+Math.sin(now*1.4+d.phase)*8;
      posAttr.setXYZ(i, px, py, pz);
      const baseHue=(now*20+d.phase*30)%360;
      let bright=0.55+0.35*Math.sin(now*3+d.phase);
      if(d.burst>0){ bright=1.0; d.burst=Math.max(0, d.burst-dt*1.4); }
      tmpC.setHSL(((baseHue/360)+0.0)%1, 0.55, Math.min(0.9,0.45+bright*0.4));
      colAttr.setXYZ(i, tmpC.r*bright, tmpC.g*bright, tmpC.b*bright);
    }
  }
  posAttr.needsUpdate=true; colAttr.needsUpdate=true;
  sparkPoints.visible = sparkleAmount>0.001;
  sparkMat.opacity = Math.min(1, sparkleAmount) * (appMode==='sea' ? 0.85 : 1);
  sparkMat.size = appMode==='sea' ? 4.5 : 6;

  // 自動ターンテーブル回転（ゆっくり）＋ドラッグ操作はOrbitControlsが担当
  if(autoRotate){
    turntableAngle += dt*0.05*globalSpeed;
    const dist=camera.position.distanceTo(controls.target);
    const curAng=Math.atan2(camera.position.z-controls.target.z, camera.position.x-controls.target.x);
    const newAng=curAng + dt*0.05*globalSpeed;
    const y=camera.position.y;
    camera.position.x=controls.target.x+Math.cos(newAng)*Math.hypot(camera.position.x-controls.target.x, camera.position.z-controls.target.z);
    camera.position.z=controls.target.z+Math.sin(newAng)*Math.hypot(camera.position.x-controls.target.x, camera.position.z-controls.target.z);
  }

  controls.update();
  followCameraForLiveBgQuad();
  composer.render();
}

  // テスト専用：VideoTextureの代わりにCanvasTexture（縞模様）をライブ背景に流し込むフック。
  // getUserMediaが使えないヘッドレス環境でもcover/tint/リサイズ挙動を確認するために使う。
  __qaInjectFakeLiveBg(vw, vh){
    liveBgOn=true;
    btnLiveBgEl.classList.add('on');
    const cv=document.createElement('canvas'); cv.width=vw; cv.height=vh;
    const ctx=cv.getContext('2d');
    for(let y=0;y<vh;y+=20){
      ctx.fillStyle = (y/20)%2===0 ? '#ffffff' : '#222222';
      ctx.fillRect(0,y,vw,20);
    }
    ctx.fillStyle='#ff0000'; ctx.fillRect(0,0,20,vh);
    ctx.fillStyle='#00ff00'; ctx.fillRect(vw-20,0,20,vh);
    const tex=new THREE.CanvasTexture(cv);
    tex.colorSpace=THREE.SRGBColorSpace;
    liveBgQuadUniforms.map.value=tex;
    liveBgVideoEl={ videoWidth:vw, videoHeight:vh }; // updateLiveBgCoverUvが参照する最低限の形
    updateLiveBgQuadGeometry();
    updateLiveBgCoverUv();
    applyVideoFilterUniforms();
    liveBgQuad.visible=true;
    updateVideoFilterPanelUi();
    return tex;
  },
  __qaClearFakeLiveBg(){
    liveBgOn=false;
    btnLiveBgEl.classList.remove('on');
    liveBgQuad.visible=false;
    liveBgQuadUniforms.map.value=null;
    liveBgVideoEl=null;
    updateVideoFilterPanelUi();
  },
  // Y1〜Y4 QA用フック
  beatPulse: triggerBeatPulse,      // マイク無しで疑似ビートを1回発火（bloom/バウンス反応の確認用）
  dropNow,                          // DROP演出を発火（Shift+Spaceと同等）
  setAssocMode,                     // AI連想モードON/OFF（フォールバックでも常に機能する）
  tickerShow,                       // 実況テロップを1件キューに積む
  enableBeatSync, disableBeatSync,

};
