<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ForgeCAD テキストスパイラル｜クリチランド</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#02030a;
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }

  #loader{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, #14172c 0%, #05060f 70%, #02030a 100%); color:#dfe6ff;
    transition:opacity .5s ease; }
  #loader.hide{ opacity:0; pointer-events:none; }
  #loader .spin{ width:46px; height:46px; border-radius:50%; border:3px solid rgba(255,255,255,.15);
    border-top-color:#8fd7ff; animation:sp 0.9s linear infinite; margin:0 auto 14px; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  #loader b{ font-size:15px; letter-spacing:.06em; font-weight:600; }

  /* ==== ブランドロゴ（左上） ==== */
  #brand{ position:fixed; top:14px; left:16px; z-index:20; color:#cfe0ff; font-size:12px;
    letter-spacing:.04em; opacity:.82; text-shadow:0 1px 6px rgba(0,0,0,.6); pointer-events:none;
    display:flex; align-items:center; gap:6px; }
  #brand .dot{ width:7px; height:7px; border-radius:50%;
    background:linear-gradient(135deg,#ffd76b,#ff8bcb,#7fd7ff); box-shadow:0 0 8px rgba(255,255,255,.6); }
  #brand small{ opacity:.65; font-weight:400; }

  /* ==== X1: モード切替ボタン（🌀スパイラル ⇄ 🌊海）／中央上部 ==== */
  #btnSeaMode{ position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:33;
    height:38px; padding:0 20px; border-radius:999px; border:1px solid rgba(255,255,255,.2); cursor:pointer;
    background:rgba(14,16,30,.6); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#eef2ff; font-size:14px; font-weight:700; letter-spacing:.02em;
    display:flex; align-items:center; gap:8px; box-shadow:0 8px 26px rgba(0,0,0,.4);
    transition:background .25s ease, transform .15s ease, box-shadow .25s ease; }
  #btnSeaMode:hover{ transform:translateX(-50%) translateY(-1px); }
  #btnSeaMode:active{ transform:translateX(-50%) scale(.96); }
  #btnSeaMode .smIcon{ font-size:17px; }
  #btnSeaMode.sea{ background:linear-gradient(135deg,rgba(30,90,140,.75),rgba(10,40,80,.75));
    border-color:rgba(140,220,255,.4); box-shadow:0 8px 26px rgba(20,120,200,.45); }

  /* ==== X4: ムービー背景トグル ==== */
  #btnLiveBg{ width:50px; height:50px; flex:none; border-radius:50%; border:1px solid rgba(255,255,255,.18); cursor:pointer;
    background:rgba(20,16,30,.6); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#f2f5ff; font-size:19px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.35); transition:transform .15s ease, filter .15s ease, background .2s ease, border-color .2s ease; }
  #btnLiveBg:hover{ filter:brightness(1.15); transform:translateY(-1px); }
  #btnLiveBg:active{ transform:translateY(0px) scale(.94); }
  #btnLiveBg.on{ background:linear-gradient(135deg,#ff6ea0,#a68bff); border-color:transparent;
    box-shadow:0 8px 24px rgba(255,110,160,.45); }

  /* ==== 入力UI（下中央） ==== */
  #inputStack{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:30;
    display:flex; flex-direction:column; gap:8px; width:min(640px, 92vw); }
  #inputBar{ display:flex; gap:8px; align-items:center; }
  #wordInput{ flex:1; padding:15px 18px; border-radius:999px; border:1px solid rgba(255,255,255,.16);
    background:rgba(14,16,30,.62); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#f2f5ff; font-size:16px; outline:none; box-shadow:0 8px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.02); }
  #wordInput::placeholder{ color:#8993b8; }
  #wordInput:focus{ border-color:rgba(140,200,255,.55); box-shadow:0 8px 30px rgba(0,0,0,.4), 0 0 0 3px rgba(120,190,255,.15); }
  #addBtn{ padding:0 24px; height:50px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#7fd7ff,#a68bff 55%,#ff8bcb); color:#101225; font-weight:700; font-size:15px;
    letter-spacing:.03em; box-shadow:0 8px 24px rgba(120,150,255,.35); transition:transform .15s ease, filter .15s ease; }
  #addBtn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  #addBtn:active{ transform:translateY(0px) scale(.97); }

  #camBtn{ width:50px; height:50px; flex:none; border-radius:50%; border:1px solid rgba(255,255,255,.18); cursor:pointer;
    background:rgba(20,16,30,.6); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#f2f5ff; font-size:20px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.35); transition:transform .15s ease, filter .15s ease; }
  #camBtn:hover{ filter:brightness(1.15); transform:translateY(-1px); }
  #camBtn:active{ transform:translateY(0px) scale(.94); }

  /* ==== Z1: 観客参加（QR）トグル ==== */
  #btnAudience{ width:50px; height:50px; flex:none; border-radius:50%; border:1px solid rgba(255,255,255,.18); cursor:pointer;
    background:rgba(20,16,30,.6); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#f2f5ff; font-size:19px; display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 8px 24px rgba(0,0,0,.35); transition:transform .15s ease, filter .15s ease, background .2s ease, border-color .2s ease; }
  #btnAudience:hover{ filter:brightness(1.15); transform:translateY(-1px); }
  #btnAudience:active{ transform:translateY(0px) scale(.94); }
  #btnAudience.on{ background:linear-gradient(135deg,#7fffc8,#7fd7ff); border-color:transparent;
    box-shadow:0 8px 24px rgba(120,220,180,.45); }
  #btnAudience .audDot{ position:absolute; top:3px; right:3px; width:9px; height:9px; border-radius:50%;
    background:#7fffc8; box-shadow:0 0 6px rgba(127,255,200,.8); opacity:0; transition:opacity .2s ease; }
  #btnAudience.always .audDot{ opacity:1; }

  /* ==== Z2: 観客参加パネル（オーバーレイ） ==== */
  #audiencePanel{ position:fixed; inset:0; z-index:58; display:flex; align-items:center; justify-content:center;
    background:rgba(2,3,10,.82); backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .22s ease; }
  #audiencePanel.show{ opacity:1; pointer-events:auto; }
  #audienceCard{ position:relative; width:min(360px, 90vw); border-radius:24px; padding:28px 26px 24px;
    background:#12142a; box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
    text-align:center; color:#f2f5ff; }
  #audienceClose{ position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.08); color:#f2f5ff; font-size:15px; display:flex; align-items:center; justify-content:center; }
  #audienceClose:hover{ background:rgba(255,255,255,.16); }
  #audienceTitle{ font-size:15px; font-weight:700; margin:4px 0 16px; letter-spacing:.02em; }
  #audienceQrBox{ width:260px; height:260px; margin:0 auto; border-radius:16px; background:#fff; padding:14px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  #audienceQrBox img, #audienceQrBox canvas{ width:100% !important; height:100% !important; }
  #audienceUrl{ margin-top:14px; font-size:12px; color:#a8b2d9; word-break:break-all; letter-spacing:.02em; }
  #audienceUnavailable{ font-size:13px; line-height:1.7; color:#ffd18f; padding:20px 4px; display:none; }
  #audienceToggleRow{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px;
    padding-top:16px; border-top:1px solid rgba(255,255,255,.1); font-size:12.5px; color:#c9d0ef; }

  /* ==== Z3: 常時表示コンパクトQR（右下） ==== */
  #audienceCompact{ position:fixed; right:16px; bottom:22px; z-index:28; width:110px; height:110px;
    border-radius:14px; background:rgba(255,255,255,.92); padding:8px; box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:.72; transition:opacity .2s ease; display:none; }
  #audienceCompact:hover{ opacity:1; }
  #audienceCompact.show{ display:block; }
  #audienceCompact img, #audienceCompact canvas{ width:100% !important; height:100% !important; }

  /* ==== Y1: ビートシンク（マイク）トグル ==== */
  #btnBeat{ width:50px; height:50px; flex:none; border-radius:50%; border:1px solid rgba(255,255,255,.18); cursor:pointer;
    background:rgba(20,16,30,.6); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#f2f5ff; font-size:19px; display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 8px 24px rgba(0,0,0,.35); transition:transform .15s ease, filter .15s ease, background .2s ease, border-color .2s ease; }
  #btnBeat:hover{ filter:brightness(1.15); transform:translateY(-1px); }
  #btnBeat:active{ transform:translateY(0px) scale(.94); }
  #btnBeat.on{ background:linear-gradient(135deg,#ff6ea0,#ffcf6b); border-color:transparent;
    box-shadow:0 8px 24px rgba(255,150,60,.45); }
  #btnBeat.on.kick{ transform:scale(1.12); }
  #bpmTag{ position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); font-size:9px; color:#ffd8a8;
    background:rgba(20,14,6,.7); padding:1px 6px; border-radius:999px; white-space:nowrap; opacity:0; transition:opacity .3s ease; pointer-events:none; }
  #btnBeat.on #bpmTag{ opacity:.9; }

  /* ==== Y2: DROPボタン ==== */
  #btnDrop{ flex:none; height:50px; padding:0 20px; border-radius:999px; border:1px solid rgba(255,140,110,.4); cursor:pointer;
    background:linear-gradient(135deg,#ff5f7a,#ff9f4e); color:#1a0a08; font-weight:800; font-size:14px; letter-spacing:.03em;
    box-shadow:0 8px 26px rgba(255,90,90,.4); transition:transform .12s ease, filter .15s ease, box-shadow .15s ease; white-space:nowrap; }
  #btnDrop:hover{ filter:brightness(1.1); transform:translateY(-1px); }
  #btnDrop:active{ transform:translateY(0px) scale(.94); }
  #btnDrop:disabled{ opacity:.45; filter:grayscale(.4); pointer-events:none; }
  #btnDrop.pulse{ animation:dropPulse .5s ease; }
  @keyframes dropPulse{ 0%{ box-shadow:0 0 0 0 rgba(255,110,90,.7); } 100%{ box-shadow:0 0 0 22px rgba(255,110,90,0); } }

  /* ==== Y3: AI連想モードトグル ==== */
  #btnAssoc{ width:50px; height:50px; flex:none; border-radius:50%; border:1px solid rgba(255,255,255,.18); cursor:pointer;
    background:rgba(20,16,30,.6); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#f2f5ff; font-size:19px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.35); transition:transform .15s ease, filter .15s ease, background .2s ease, border-color .2s ease; }
  #btnAssoc:hover{ filter:brightness(1.15); transform:translateY(-1px); }
  #btnAssoc:active{ transform:translateY(0px) scale(.94); }
  #btnAssoc.on{ background:linear-gradient(135deg,#a68bff,#7f6bff); border-color:transparent;
    box-shadow:0 8px 24px rgba(150,110,255,.5); animation:assocGlow 2.4s ease-in-out infinite; }
  @keyframes assocGlow{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.25); } }

  /* ==== Y4: AI実況テロップ ==== */
  #tickerBar{ position:fixed; left:50%; bottom:186px; transform:translateX(-50%); z-index:29; width:min(680px,94vw);
    text-align:center; pointer-events:none; opacity:0; transition:opacity .35s ease, transform .35s ease; }
  #tickerBar.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #tickerBar span{ display:inline-block; padding:9px 22px; border-radius:999px; font-size:14px; font-weight:700; letter-spacing:.02em;
    background:rgba(14,10,26,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    background-image:linear-gradient(135deg,#7fd7ff,#a68bff 45%,#ff8bcb 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 18px rgba(120,150,255,.35); box-shadow:0 8px 26px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08); }
  #tickerBar.drop span{ font-size:19px; background-image:linear-gradient(135deg,#ff5f7a,#ffcf6b 60%,#ff8bcb); }

  /* ==== Y3: AI追加語のバッジ表示（wordList内） ==== */
  #wordList .aiTag{ font-size:9px; margin-left:2px; opacity:.85; }

  #modelBar{ display:flex; gap:8px; align-items:center; }
  #modelInput{ flex:1; padding:12px 16px; border-radius:999px; border:1px solid rgba(255,180,120,.28);
    background:rgba(20,14,10,.5); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#f2f5ff; font-size:14px; outline:none; box-shadow:0 6px 22px rgba(0,0,0,.3); }
  #modelInput::placeholder{ color:#c9a37a; }
  #modelInput:focus{ border-color:rgba(255,190,120,.6); box-shadow:0 6px 22px rgba(0,0,0,.35), 0 0 0 3px rgba(255,180,120,.15); }
  #modelBtn{ padding:0 18px; height:42px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#ffb066,#ff8bcb 60%,#a68bff); color:#1a1008; font-weight:700; font-size:13px;
    letter-spacing:.02em; box-shadow:0 6px 20px rgba(255,150,100,.3); transition:transform .15s ease, filter .15s ease; white-space:nowrap; }
  #modelBtn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  #modelBtn:active{ transform:translateY(0px) scale(.97); }
  #modelBar.disabled #modelInput,
  #modelBar.disabled #modelBtn{ opacity:.4; pointer-events:none; filter:grayscale(0.6); }
  #modelOffline{ font-size:10.5px; color:#c9a37a; opacity:.8; padding:0 4px; display:none; letter-spacing:.02em; }
  #modelBar.disabled + #modelOffline{ display:block; }

  /* ==== W1: 修正チャットトグル ==== */
  #refineToggle{ flex:none; height:42px; padding:0 12px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(255,255,255,.18); background:rgba(20,16,30,.5); color:#c9d0ef;
    font-size:12px; font-weight:600; letter-spacing:.02em; white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
  #refineToggle:hover{ transform:translateY(-1px); }
  #refineToggle.on{ background:linear-gradient(135deg,#7fd7ff,#a68bff); border-color:transparent; color:#101225;
    box-shadow:0 6px 18px rgba(120,150,255,.35); }
  #refineToggle.hidden{ display:none; }
  #wordList .refineBtn{ margin-left:6px; padding:2px 8px; border-radius:999px; border:1px solid rgba(140,200,255,.4);
    background:rgba(140,200,255,.12); color:#bfe4ff; font-size:9.5px; cursor:pointer; letter-spacing:.02em; }
  #wordList .refineBtn:hover{ background:rgba(140,200,255,.24); }

  /* ==== W3: ジョブ開始フラッシュ ==== */
  #vjFlash{ position:fixed; inset:0; z-index:15; background:radial-gradient(ellipse at 50% 46%, rgba(180,220,255,.55), rgba(180,220,255,0) 70%);
    opacity:0; pointer-events:none; }
  #vjFlash.flashing{ animation:vjFlashAnim .5s ease-out; }
  @keyframes vjFlashAnim{ 0%{ opacity:.9; } 100%{ opacity:0; } }

  #hint{ position:fixed; left:50%; bottom:132px; transform:translateX(-50%); z-index:29; color:#9aa6cf;
    font-size:11.5px; opacity:.68; letter-spacing:.02em; text-shadow:0 1px 4px rgba(0,0,0,.6); pointer-events:none;
    white-space:nowrap; }

  /* ==== モデリング進行ミニウィンドウ（左下） ==== */
  #jobStack{ position:fixed; left:16px; bottom:22px; z-index:32; display:flex; flex-direction:column-reverse; gap:8px;
    width:250px; max-width:80vw; }
  .jobCard{ position:relative; padding:10px 30px 10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.14);
    background:rgba(14,16,30,.72); backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#eef1ff; font-size:11.5px; box-shadow:0 10px 30px rgba(0,0,0,.4); animation:jobIn .25s ease; }
  @keyframes jobIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .jobCard .jcName{ font-weight:700; font-size:12.5px; display:flex; align-items:center; gap:6px; }
  .jobCard .jcName .icon{ font-size:13px; }
  .jobCard .jcStage{ margin-top:3px; opacity:.85; display:flex; align-items:center; gap:6px; }
  .jobCard .jcDots{ display:inline-flex; gap:3px; }
  .jobCard .jcDots i{ width:4px; height:4px; border-radius:50%; background:#8fd7ff; opacity:.35; animation:jcBlink 1.1s ease-in-out infinite; }
  .jobCard .jcDots i:nth-child(2){ animation-delay:.18s; }
  .jobCard .jcDots i:nth-child(3){ animation-delay:.36s; }
  @keyframes jcBlink{ 0%,100%{ opacity:.25; transform:scale(1); } 40%{ opacity:1; transform:scale(1.3); } }
  .jobCard .jcBar{ margin-top:7px; height:4px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
  .jobCard .jcBarFill{ height:100%; border-radius:99px; background:linear-gradient(90deg,#7fd7ff,#a68bff,#ff8bcb);
    background-size:200% 100%; animation:jcFlow 1.6s linear infinite; width:30%; }
  @keyframes jcFlow{ from{ background-position:0% 0; } to{ background-position:200% 0; } }
  .jobCard .jcMeta{ margin-top:5px; opacity:.55; font-size:10px; }
  .jobCard.error{ border-color:rgba(255,110,110,.45); }
  .jobCard.error .jcStage{ color:#ffb0b0; }
  .jobCard.done{ border-color:rgba(140,255,190,.4); }
  .jobCard .jcClose{ position:absolute; top:8px; right:9px; opacity:.5; cursor:pointer; font-size:12px; line-height:1; }
  .jobCard .jcClose:hover{ opacity:1; }

  /* ==== コントロールパネル（右上） ==== */
  #panelToggle{ position:fixed; top:14px; right:14px; z-index:31; width:34px; height:34px; border-radius:10px;
    border:1px solid rgba(255,255,255,.14); background:rgba(14,16,30,.55); backdrop-filter:blur(10px);
    color:#dfe6ff; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
  #panel{ position:fixed; top:56px; right:14px; z-index:30; width:240px; max-height:calc(100vh - 90px); overflow:auto;
    padding:14px 14px 16px; border-radius:16px; border:1px solid rgba(255,255,255,.12);
    background:rgba(12,14,26,.68); backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
    color:#e7ecff; font-size:12.5px; box-shadow:0 12px 40px rgba(0,0,0,.45); transition:opacity .2s ease, transform .2s ease; }
  #panel.hide{ opacity:0; pointer-events:none; transform:translateY(-6px); }
  #panel h4{ margin:0 0 8px; font-size:11px; letter-spacing:.08em; opacity:.65; font-weight:600; text-transform:uppercase; }
  #panel .row{ margin:10px 0; }
  #panel label{ display:flex; justify-content:space-between; margin-bottom:4px; opacity:.85; }
  #panel input[type=range]{ width:100%; accent-color:#8fd7ff; }
  #panel .toggleRow{ display:flex; align-items:center; justify-content:space-between; margin:10px 0; }
  .swtch{ position:relative; width:38px; height:21px; border-radius:999px; background:rgba(255,255,255,.15); cursor:pointer; }
  .swtch.on{ background:linear-gradient(135deg,#7fd7ff,#a68bff); }
  .swtch i{ position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff;
    transition:left .15s ease; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .swtch.on i{ left:19px; }
  /* ==== X3: 背景カスタマイズ ==== */
  #bgSection{ margin-top:10px; border-top:1px solid rgba(255,255,255,.1); padding-top:10px; }
  #bgChips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .bgChip{ padding:5px 10px; border-radius:999px; font-size:10.5px; cursor:pointer;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#dfe6ff;
    transition:background .15s ease, border-color .15s ease; white-space:nowrap; }
  .bgChip:hover{ background:rgba(255,255,255,.14); }
  .bgChip.active{ background:linear-gradient(135deg,#7fd7ff,#a68bff); border-color:transparent; color:#101225; font-weight:700; }
  #bgColorRow{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  #bgColorPicker{ width:34px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:none; cursor:pointer; padding:0; }
  #bgColorClear{ font-size:10.5px; opacity:.65; cursor:pointer; text-decoration:underline; }
  #bgColorClear:hover{ opacity:1; }

  /* ==== S3: ライブ映像フィルター（🎥ムービー背景ON時のみ有効） ==== */
  #videoFilterSection{ margin-top:10px; border-top:1px solid rgba(255,255,255,.1); padding-top:10px;
    transition:opacity .2s ease; }
  #videoFilterSection.dim{ opacity:.4; pointer-events:none; }
  #vfSwatches{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }

/* =====================================================================
 * ForgeCAD テキストスパイラル
 * 入力した単語を立体文字化し、螺旋(ヘリックス)経路に沿って上昇させ続けるインタラクティブ演出。
 * 文字→3D抽出パイプライン（textToShapes / buildText3dGeometry 系）は
 * kurichiland-forge/index.html の J1〜J4実装を移植したもの（Canvasラスタ→二値マスク→
 * 境界追跡→Douglas-Peucker単純化→THREE.Shape(+holes)→ExtrudeGeometry）。
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * 1) 文字 → 3D ジオメトリ・パイプライン（index.htmlのJ1〜J4を自己完結移植）
 * ------------------------------------------------------------------- */
const FONT_DEFS={
  gothic:  { label:'ゴシック',   family:'-apple-system,"Hiragino Sans",sans-serif' },
  heavy:   { label:'極太',       family:'"Hiragino Sans W8","Hiragino Sans",sans-serif', weight:900 },
  mincho:  { label:'明朝',       family:'"Hiragino Mincho ProN","Yu Mincho",serif' },
  maru:    { label:'丸ゴシック', family:'"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif' },
};
const FONT_DEFAULT='gothic';
function fontDefOf(key){ return FONT_DEFS[key] || FONT_DEFS[FONT_DEFAULT]; }

const T3D_RASTER_H=180;      // ラスタライズ基準の文字高さ(px)。演出用途なので軽量寄り
const T3D_CANVAS_MAX=3200;
const T3D_PAD=8;

function t3dRasterize(text, weightBold, fontKey){
  const str=(text||' ');
  const measureCv=document.createElement('canvas');
  const mctx=measureCv.getContext('2d');
  let H=T3D_RASTER_H;
  const fontDef=fontDefOf(fontKey);
  const fontWeight = fontDef.weight!=null ? fontDef.weight : (weightBold?900:400);
  const fontOf=(h)=> fontWeight+' '+h+'px '+fontDef.family;
  mctx.font=fontOf(H);
  let metrics=mctx.measureText(str);
  let textW=Math.max(1, metrics.width);
  let totalW=textW+T3D_PAD*2;
  if(totalW>T3D_CANVAS_MAX){
    const scale=T3D_CANVAS_MAX/totalW;
    H=Math.max(24, Math.floor(H*scale));
    mctx.font=fontOf(H);
    metrics=mctx.measureText(str);
    textW=Math.max(1, metrics.width);
    totalW=textW+T3D_PAD*2;
  }
  const ascent = metrics.actualBoundingBoxAscent || H*0.82;
  const descent = metrics.actualBoundingBoxDescent || H*0.22;
  const cvW=Math.max(8, Math.ceil(textW+T3D_PAD*2));
  const cvH=Math.max(8, Math.ceil(ascent+descent+T3D_PAD*2));
  const cv=document.createElement('canvas');
  cv.width=cvW; cv.height=cvH;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cvW,cvH);
  ctx.fillStyle='#000';
  ctx.font=fontOf(H);
  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.fillText(str, T3D_PAD, T3D_PAD+ascent);
  const imgData=ctx.getImageData(0,0,cvW,cvH);
  return { imgData, width:cvW, height:cvH, rasterH:H };
}
function t3dBinaryMask(imgData){
  const {data,width,height}=imgData;
  const mask=new Uint8Array(width*height);
  for(let i=0;i<width*height;i++){ mask[i]= data[i*4+3]>128 ? 1 : 0; }
  return { mask, width, height };
}
function t3dSignedArea(pts){
  let a=0;
  for(let i=0;i<pts.length;i++){
    const [x1,y1]=pts[i], [x2,y2]=pts[(i+1)%pts.length];
    a += (x1*y2 - x2*y1);
  }
  return a/2;
}
function t3dTraceContours(maskObj){
  const { mask, width, height } = maskObj;
  const px=(x,y)=> (x>=0&&x<width&&y>=0&&y<height) ? mask[y*width+x] : 0;
  const edges=[];
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      if(px(x,y)!==1) continue;
      if(px(x,y-1)!==1) edges.push([x,y, x+1,y]);
      if(px(x+1,y)!==1) edges.push([x+1,y, x+1,y+1]);
      if(px(x,y+1)!==1) edges.push([x+1,y+1, x,y+1]);
      if(px(x-1,y)!==1) edges.push([x,y+1, x,y]);
    }
  }
  const fromMap=new Map();
  edges.forEach((e,i)=>{
    const k=e[0]+','+e[1];
    if(!fromMap.has(k)) fromMap.set(k, []);
    fromMap.get(k).push(i);
  });
  const used=new Uint8Array(edges.length);
  const loops=[];
  for(let i=0;i<edges.length;i++){
    if(used[i]) continue;
    const loop=[];
    let curIdx=i;
    const startKey=edges[i][0]+','+edges[i][1];
    let guard=0; const guardMax=edges.length+16;
    while(true){
      used[curIdx]=1;
      const [x1,y1,x2,y2]=edges[curIdx];
      loop.push([x1,y1]);
      const key=x2+','+y2;
      if(key===startKey) break;
      const candidates=(fromMap.get(key)||[]).filter(idx=>!used[idx]);
      if(!candidates.length) break;
      curIdx=candidates[0];
      guard++;
      if(guard>guardMax) break;
    }
    if(loop.length>=4) loops.push(loop);
  }
  const outerLoops=[], innerLoops=[];
  loops.forEach(loop=>{
    const area=t3dSignedArea(loop);
    if(Math.abs(area)<0.5) return;
    if(area>0) outerLoops.push(loop); else innerLoops.push(loop);
  });
  return { outerLoops, innerLoops };
}
function t3dSimplify(points, tolerance){
  if(points.length<=2) return points.slice();
  function perpDist(p, a, b){
    const dx=b[0]-a[0], dy=b[1]-a[1];
    const len2=dx*dx+dy*dy;
    if(len2<1e-9) return Math.hypot(p[0]-a[0], p[1]-a[1]);
    let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/len2;
    t=Math.max(0,Math.min(1,t));
    const px=a[0]+t*dx, py=a[1]+t*dy;
    return Math.hypot(p[0]-px, p[1]-py);
  }
  function dp(pts){
    if(pts.length<=2) return pts;
    let maxD=-1, idx=-1;
    for(let i=1;i<pts.length-1;i++){
      const d=perpDist(pts[i], pts[0], pts[pts.length-1]);
      if(d>maxD){ maxD=d; idx=i; }
    }
    if(maxD>tolerance){
      const left=dp(pts.slice(0,idx+1));
      const right=dp(pts.slice(idx));
      return left.slice(0,-1).concat(right);
    }
    return [pts[0], pts[pts.length-1]];
  }
  return dp(points);
}
function t3dPointInLoop(p, loop){
  let inside=false;
  for(let i=0,j=loop.length-1;i<loop.length;j=i++){
    const xi=loop[i][0], yi=loop[i][1], xj=loop[j][0], yj=loop[j][1];
    const intersect = ((yi>p[1])!==(yj>p[1])) && (p[0] < (xj-xi)*(p[1]-yi)/((yj-yi)||1e-12) + xi);
    if(intersect) inside=!inside;
  }

}
function textToShapes(text, weightBold, fontKey){
  const { imgData, width, height, rasterH } = t3dRasterize(text, weightBold, fontKey);
  const maskObj = t3dBinaryMask(imgData);
  const { outerLoops, innerLoops } = t3dTraceContours(maskObj);
  const tol = 1.1;
  const outers = outerLoops.map(loop=>{
    let simp=t3dSimplify(loop, tol);
    if(simp.length>=3 && t3dSignedArea(simp)<0) simp=simp.slice().reverse();
    return simp;
  }).filter(l=>l.length>=3);
  const inners = innerLoops.map(loop=>{
    let simp=t3dSimplify(loop, tol);
    if(simp.length>=3 && t3dSignedArea(simp)>0) simp=simp.slice().reverse();
    return simp;
  }).filter(l=>l.length>=3);
  const shapes=outers.map(outer=>({ outer, holes:[] }));
  inners.forEach(hole=>{
    const rep=hole[0];
    let bestIdx=-1, bestArea=Infinity;
    shapes.forEach((s,i)=>{
      if(t3dPointInLoop(rep, s.outer)){
        const area=Math.abs(t3dSignedArea(s.outer));
        if(area<bestArea){ bestArea=area; bestIdx=i; }
      }
    });
    if(bestIdx>=0) shapes[bestIdx].holes.push(hole);
  });
  const toLocal=(p)=>[ p[0]-width/2, (height-p[1]) ];
  const shapeObjs=shapes.map(s=>{
    const outerLocal=s.outer.map(toLocal);
    const shape=new THREE.Shape();
    outerLocal.forEach((p,i)=>{ if(i===0) shape.moveTo(p[0],p[1]); else shape.lineTo(p[0],p[1]); });
    shape.closePath();
    s.holes.forEach(h=>{
      const holeLocal=h.map(toLocal);
      const path=new THREE.Path();
      holeLocal.forEach((p,i)=>{ if(i===0) path.moveTo(p[0],p[1]); else path.lineTo(p[0],p[1]); });
      path.closePath();
      shape.holes.push(path);
    });
    return shape;
  });
  return { shapes: shapeObjs, rasterW:width, rasterH:height };
}

/* buildText3dGeometry: desc={text,size,depth,bevel,bold,font} → ExtrudeGeometry（正面+Z・底辺y=0接地・中心x=0） */
function buildText3dGeometry(desc){
  const size=Math.max(6, +desc.size||46);
  const depth=Math.max(1, +desc.depth||14);
  let bevel=Math.max(0, desc.bevel!=null ? +desc.bevel : 1.6);
  bevel=Math.min(bevel, size/10, depth/2 - 0.1);
  bevel=Math.max(0, bevel);
  const bevelEnabled=bevel>0.05;
  const { shapes, rasterH } = textToShapes(desc.text||' ', desc.bold!==false, desc.font);
  if(!shapes.length) return new THREE.BoxGeometry(size*0.4, size*0.4, depth);
  const scale = size/rasterH;
  const curveSeg = desc.lowQuality ? 3 : 6;
  const extrudeSettings={
    depth: depth,
    bevelEnabled: bevelEnabled,
    bevelSize: bevelEnabled ? bevel : 0,
    bevelThickness: bevelEnabled ? bevel : 0,
    bevelSegments: 2,
    curveSegments: curveSeg
  };
  let geo=new THREE.ExtrudeGeometry(shapes, extrudeSettings);
  geo.scale(scale, scale, 1);
  geo.computeBoundingBox();
  const bb=geo.boundingBox;
  const cx=(bb.min.x+bb.max.x)/2;
  const minY=bb.min.y;
  geo.translate(-cx, -minY, 0);
  geo.computeVertexNormals();
  return geo;
}

/* ---------------------------------------------------------------------
 * 2) 単語ごとのビジュアル判定（AI優先／ヒューリスティック フォールバック）
 * ------------------------------------------------------------------- */
const MATERIAL_KINDS=['gold','silver','rainbow','neon','glass','pearl'];
const STYLE_KINDS=['normal','outline','dance'];
const CREATURE_KINDS=['fish','octopus','squid','seaweed','jelly','none'];

const KEYWORD_RULES=[
  { re:/(金|王|kin|king|gold|冠|黄金|王様|王女|富|勝利)/i, material:'gold' },
  { re:/(月|銀|雪|冬|silver|moon|snow|白銀|氷)/i, material:'silver' },
  { re:/(虹|夢|rainbow|dream|希望|奇跡|レインボー)/i, material:'rainbow' },
  { re:/(夜|光|電気|neon|ネオン|星|スター|未来|電脳|都市)/i, material:'neon' },
  { re:/(海|空|水|青|glass|sea|sky|water|blue|涙|氷河|クリスタル)/i, material:'glass' },
  { re:/(花|愛|恋|pink|love|flower|桜|ピンク|甘い|優しい)/i, material:'pearl' },
];
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
function heuristicDecide(word){
  const w=(word||'').trim();
  let material=null;
  for(const rule of KEYWORD_RULES){ if(rule.re.test(w)){ material=rule.material; break; } }
  const h=hashStr(w||'x');
  if(!material) material=MATERIAL_KINDS[h%MATERIAL_KINDS.length];
  const hue=(h % 360);
  const color = hslToHex(hue, 0.62, 0.58);
  const styleRoll = (h>>3)%10;
  let style='normal';
  if(styleRoll<2) style='outline'; else if(styleRoll<4) style='dance';
  return { color, material, style, reason:'ヒューリスティック判定' };
}
function hslToHex(h,s,l){
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
  const R=Math.round((r+m)*255), G=Math.round((g+m)*255), B=Math.round((b+m)*255);
  return '#'+[R,G,B].map(v=>v.toString(16).padStart(2,'0')).join('');
}
async function fetchAiDecision(word){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), 6000);
  try{
    const res=await fetch(BRIDGE_ORIGIN+'/ai', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ word }),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if(!res.ok) throw new Error('http '+res.status);
    const json=await res.json();
    if(!json || json.error) throw new Error(json && json.error || 'no data');
    const material = MATERIAL_KINDS.includes(json.material) ? json.material : null;
    const style = STYLE_KINDS.includes(json.style) ? json.style : 'normal';
    const creature = CREATURE_KINDS.includes(json.creature) ? json.creature : 'none';
    const color = /^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(json.color||'') ? json.color : null;
    if(!material || !color) throw new Error('invalid fields');
    return { color, material, style, creature, reason: json.reason||'AI判定', ai:true };
  }catch(e){
    clearTimeout(timer);
    return null;
  }
}

const SPIRAL={
  radius: 150,
  turns: 6,
  height: 560,     // 天井相当の高さ（ここで消えて下から再登場）
  baseY: 6,
};
function spiralPoint(t){
  // t: 0(底)〜1(天井)
  const ang = t * SPIRAL.turns * Math.PI*2;
  const r = SPIRAL.radius * (0.62 + 0.38*Math.sin(t*Math.PI*0.5)); // 上に向かってやや広がる
  const y = SPIRAL.baseY + t*SPIRAL.height;
  return new THREE.Vector3(Math.cos(ang)*r, y, Math.sin(ang)*r);
}
function spiralTangent(t){
  const dt=0.001;
  const a=spiralPoint(Math.max(0,t-dt)), b=spiralPoint(Math.min(1,t+dt));
  return b.clone().sub(a).normalize();
}

// 虹色に光る螺旋ライン（頂点カラー、色相がゆっくり流れる）
const spiralLineGroup=new THREE.Group(); scene.add(spiralLineGroup);

{
  const N=420;
  const positions=new Float32Array(N*3);
  const colors=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    const p=spiralPoint(t);
    positions[i*3]=p.x; positions[i*3+1]=p.y; positions[i*3+2]=p.z;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const mat=new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0.75, linewidth:1 });
  spiralLine=new THREE.Line(geo, mat);
  spiralLineGroup.add(spiralLine);
}
function updateSpiralLineColors(hueShift){
  const colAttr=spiralLine.geometry.getAttribute('color');
  const N=colAttr.count;
  const tmp=new THREE.Color();
  for(let i=0;i<N;i++){

/* ---------------------------------------------------------------------
 * X1) モード切替：🌀スパイラル ⇄ 🌊海
 * 既存の螺旋の位置更新ロジック（placeEntry内の螺旋計算）はupdateEntrySpiralへ、
 * 新しい海の遊泳ロジックはupdateEntrySeaへ分離する。呼び出し元のplaceEntryは
 * appMode を見てどちらかに委譲するだけにし、既存の螺旋挙動そのものは変更しない。
 * 海の遊泳範囲は螺旋と同程度の空間（半径・高さ）に収める。
 * ------------------------------------------------------------------- */
let appMode='spiral'; // 'spiral' | 'sea'
const SEA={
  radius: SPIRAL.radius*1.05,          // 回遊できる水平半径（螺旋の空間感と同程度）
  yMin: SPIRAL.baseY - 4,
  yMax: SPIRAL.baseY + SPIRAL.height*0.86,
  seaweedYBand: 46,                    // 海藻が根を張る海底付近の帯
  swimYMin: SPIRAL.baseY + 22,          // 泳ぐ生き物（fish/octopus/squid/jelly）が海底に張り付いて見えないための下限
};
function clampToSeaBounds(pos, opts){
  // 境界に達したら緩やかに押し戻す（呼び出し側でvel反転にも使う簡易版）
  opts=opts||{};
  const rXZ=Math.hypot(pos.x, pos.z);
  if(rXZ>SEA.radius){
    const k=SEA.radius/rXZ;
    pos.x*=k; pos.z*=k;
  }
  const yFloor = opts.swim ? SEA.swimYMin : SEA.yMin;
  if(pos.y<yFloor) pos.y=yFloor;
  if(pos.y>SEA.yMax) pos.y=SEA.yMax;
  return pos;
}

/* 単語辞書から creature 種別をフォールバック判定（AIのcreatureが無い/noneの場合に使用） */
const CREATURE_DICT_RULES=[
  { re:/(タコ|たこ|octopus)/i, creature:'octopus' },
  { re:/(イカ|いか|squid)/i, creature:'squid' },
  { re:/(海藻|わかめ|ワカメ|昆布|こんぶ|kelp|seaweed)/i, creature:'seaweed' },
  { re:/(クラゲ|くらげ|jellyfish|jelly)/i, creature:'jelly' },
  { re:/(魚|さかな|サカナ|マグロ|まぐろ|サメ|さめ|金魚|きんぎょ|タイ|たい|カツオ|かつお|fish|tuna|shark)/i, creature:'fish' },
];
function dictDecideCreature(word){
  const w=(word||'').trim();
  for(const rule of CREATURE_DICT_RULES){ if(rule.re.test(w)) return rule.creature; }
  return 'fish'; // 海モードでは全員泳ぐ＝既定はfish
}
/* decision.creature（AI由来、'none'含む）を実際の遊泳種別に正規化。wordは辞書フォールバック用 */
function resolveSwimCreature(decision, word){
  const c=decision && decision.creature;
  if(c && c!=='none' && ['fish','octopus','squid','seaweed','jelly'].includes(c)) return c;
  return dictDecideCreature(word || '');
}

/* 巡航深度（targetY）の抽選：SEA.swimYMin〜yMaxをCRUISE_LAYERS層に分け、
 * ラウンドロビンで層を回して縦方向に自然に分散させる（同じ層に固まらない）。
 * 各層の中でさらにランダムオフセットを加えるので、層の境界は見た目には現れない。 */
const CRUISE_LAYERS=5;
let cruiseLayerSeq=Math.floor(Math.random()*CRUISE_LAYERS);
function pickCruiseDepth(){
  const layer=(cruiseLayerSeq++)%CRUISE_LAYERS;
  const bandH=(SEA.yMax-SEA.swimYMin)/CRUISE_LAYERS;
  return SEA.swimYMin + (layer + Math.random())*bandH;
}
function pickRetargetInterval(){ return 10 + Math.random()*10; } // 10〜20s+ランダムで再抽選

/* エントリーに海用の遊泳ステートを初期化（初回のみ・以後はentry.seaに保持） */
function ensureSeaState(entry){
  if(entry.sea) return entry.sea;
  // 写真(kind:'photo')は自動的にjelly扱い、モデル(kind:'model')は既存通りfishでよい
  const creature = entry.kind==='photo' ? 'jelly' : resolveSwimCreature(entry.decision, entry.text);
  const ang=Math.random()*Math.PI*2;
  const rad=SEA.radius*(0.25+Math.random()*0.65);
  let y;
  if(creature==='seaweed'){
    y=SEA.yMin + Math.random()*SEA.seaweedYBand;
  } else {
    y=SEA.swimYMin + Math.random()*(SEA.yMax-SEA.swimYMin);
  }
  entry.sea={
    creature,
    pos:new THREE.Vector3(Math.cos(ang)*rad, y, Math.sin(ang)*rad),
    heading: Math.random()*Math.PI*2,      // 水平方向（rad）
    headingTarget: Math.random()*Math.PI*2,
    speed: 6+Math.random()*8,
    phase: Math.random()*Math.PI*2,
    phase2: Math.random()*Math.PI*2,
    burstT: 0,                              // squid/fishの加速演出タイマー
    burstCooldown: 1.5+Math.random()*3,
    rootPos: null,                          // seaweed用：根本固定位置
    targetY: pickCruiseDepth(),             // fish/octopus/squid用：巡航深度（縦回遊の目標y）
    retargetT: pickRetargetInterval(),      // targetY再抽選までの残り秒数
  };
  if(creature==='seaweed'){
    entry.sea.rootPos=entry.sea.pos.clone();
  }
  return entry.sea;
}

/* fish/octopus/squid共通：巡航深度への緩やかな上下回遊。
 * 現在yからtargetYへ数秒スケールで補間し、一定時間ごとにtargetYを再抽選する。
 * 補間係数 dt*0.35 ≒ 時定数約3秒（1フレームあたり残差の約0.6%(60fps時)を詰める）。 */
function updateCruiseDepth(s, dt){
  s.retargetT -= dt;
  if(s.retargetT<=0){
    s.targetY=pickCruiseDepth();
    s.retargetT=pickRetargetInterval();
  }
  s.pos.y += (s.targetY - s.pos.y)*Math.min(1, dt*0.35);
}

/* 螺旋位置(現在t由来のposition)から海のposへ滑らかに遷移させるための初期化。
 * モード切替の瞬間に呼び、entry.seaが無ければ現在位置ベースで作る（座標ジャンプ防止）。 */
function seedSeaStateFromCurrentPosition(entry){
  const s=ensureSeaState(entry);
  if(!s.__seeded){
    if(s.creature==='seaweed'){
      // 海藻はrootPos（根本＝海底の定位置）を正とする。現在の螺旋位置は流用しない
      // （螺旋の高所からいきなり海底へワープして見えるのを避けるため、根本のx/zだけ
      //   現在位置の水平方向へ寄せ、yは常にensureSeaState由来の海底帯に保つ）
      const cur=entry.group.position;
      const ang=Math.atan2(cur.z, cur.x);
      const rad=Math.min(SEA.radius*0.92, Math.hypot(cur.x, cur.z));
      s.rootPos.set(Math.cos(ang)*rad, s.rootPos.y, Math.sin(ang)*rad);
      s.pos.copy(s.rootPos);
    } else {
      s.pos.copy(entry.group.position);
      clampToSeaBounds(s.pos, { swim:true });
    }
    s.__seeded=true;
  }
}

/* --- 既存の螺旋の位置更新（従来のplaceEntry本体をそのまま移設。挙動は変更しない） --- */
function updateEntrySpiral(entry, dt){
  const baseSpeed=0.028; // 1秒あたりのt増分の基準値
  entry.t += baseSpeed*entry.speedMul*dt*globalSpeed;
  if(entry.t>1) entry.t -= 1; // 天井まで来たら下からループ再登場
  const p=spiralPoint(entry.t);
  const tan=spiralTangent(entry.t);
  entry.group.position.copy(p);
  // 進行方向を向かせつつ、螺旋の外向きにも少し開く
  const outward=new THREE.Vector3(p.x, 0, p.z).normalize();
  const lookTarget=p.clone().add(tan);
  entry.group.up.set(0,1,0);
  entry.group.lookAt(lookTarget);
  entry.group.rotateY(Math.PI/2);
  // 少し外向きに傾けて視認性UP
  entry.group.position.add(outward.multiplyScalar(0));
}

/* --- 海モードの遊泳ロジック：creature種別ごとに位置・向き・スケール演出を計算 --- */
function updateEntrySea(entry, dt){
  seedSeaStateFromCurrentPosition(entry);
  const s=entry.sea;
  const now=performance.now()*0.001;
  const g=entry.group;

  if(s.creature==='seaweed'){
    // 海底に係留・根本固定・先端がゆらゆら（rotation.zをsin波、positionはほぼ固定）
    g.position.copy(s.rootPos);
    g.rotation.set(0,0, Math.sin(now*0.9+s.phase)*0.22 + Math.sin(now*0.37+s.phase2)*0.09);
    g.rotation.y = s.phase*0.3;
    g.scale.setScalar(g.scale.x||1); // スケールは既存のまま維持
    return;
  }

  if(s.creature==='jelly'){
    // ふわ〜っと上下（写真ポラロイドは自動的にjelly扱い）
    s.pos.y += Math.sin(now*0.5+s.phase)*dt*4.0;
    s.pos.x += Math.sin(now*0.13+s.phase2)*dt*2.2;
    s.pos.z += Math.cos(now*0.11+s.phase2)*dt*2.2;
    clampToSeaBounds(s.pos, { swim:true });
    g.position.copy(s.pos);
    g.rotation.y += dt*0.12;
    return;
  }

  if(s.creature==='octopus'){
    // ゆっくり脈動（scale 1±0.06）しながら不規則に漂う。yは巡航深度へゆっくり回遊
    s.headingTarget += (Math.random()-0.5)*dt*0.8;
    s.heading += (s.headingTarget - s.heading)*Math.min(1, dt*0.6);
    const drift=1.6;
    s.pos.x += Math.cos(s.heading)*drift*dt;
    s.pos.z += Math.sin(s.heading)*drift*dt;
    updateCruiseDepth(s, dt);
    s.pos.y += Math.sin(now*0.22+s.phase)*dt*1.4;
    clampToSeaBounds(s.pos, { swim:true });
    g.position.copy(s.pos);
    g.up.set(0,1,0);
    g.lookAt(s.pos.x+Math.cos(s.heading), s.pos.y, s.pos.z+Math.sin(s.heading));
    const pulse=1 + Math.sin(now*1.8+s.phase)*0.06;
    g.scale.setScalar((g.userData.baseScaleForSwim||(g.userData.baseScaleForSwim=g.scale.x||1))*pulse);
    return;
  }

  if(s.creature==='squid'){
    // 静止→ジェット噴射でスッと直進→減速、を繰り返す
    s.burstCooldown -= dt;
    if(s.burstCooldown<=0 && s.burstT<=0){
      s.burstT=0.55;
      s.heading=Math.random()*Math.PI*2;
      s.burstCooldown=2.2+Math.random()*3.2;
      burstSparkle(g.position.clone()); // 噴射時の小さな泡バースト（既存burstSparkle流用）
    }
    let curSpeed=0.6; // 静止時のわずかな漂い
    if(s.burstT>0){
      const jetProgress=1-(s.burstT/0.55);
      curSpeed = 34*(1-jetProgress*jetProgress); // 加速→減速カーブ
      s.burstT=Math.max(0, s.burstT-dt);
    }
    s.pos.x += Math.cos(s.heading)*curSpeed*dt;
    s.pos.z += Math.sin(s.heading)*curSpeed*dt;
    updateCruiseDepth(s, dt);
    s.pos.y += Math.sin(now*0.3+s.phase)*dt*0.8;
    clampToSeaBounds(s.pos, { swim:true });
    g.position.copy(s.pos);
    g.up.set(0,1,0);
    g.lookAt(s.pos.x+Math.cos(s.heading), s.pos.y, s.pos.z+Math.sin(s.heading));
    return;
  }

  // fish（既定）: 水平基調のS字遊泳。進行方向へ向きを合わせ、方向転換時に体をロール。ときどきスッと加速
  s.burstCooldown -= dt;
  if(s.burstCooldown<=0 && s.burstT<=0){
    s.burstT=0.8;
    s.burstCooldown=3+Math.random()*4;
  }
  s.headingTarget += Math.sin(now*0.6+s.phase)*dt*1.1; // S字にうねる方向転換
  if(Math.random()<0.004) s.headingTarget += (Math.random()-0.5)*1.4; // 境界などでの気まぐれな転回
  s.heading += (s.headingTarget - s.heading)*Math.min(1, dt*1.8);
  let curSpeed=s.speed;
  if(s.burstT>0){ curSpeed=s.speed*2.4; s.burstT=Math.max(0, s.burstT-dt); }
  // 境界に近づいたら中心方向へ緩やかに向きを補正（画面外へ出ない）
  const rXZ=Math.hypot(s.pos.x, s.pos.z);
  if(rXZ>SEA.radius*0.88){
    const toCenter=Math.atan2(-s.pos.z, -s.pos.x);
    s.headingTarget = toCenter;
  }
  if(s.pos.y<SEA.swimYMin+14) s.headingTarget=s.heading; // 上下はheadingでなく巡航深度で別途制御
  s.pos.x += Math.cos(s.heading)*curSpeed*dt;
  s.pos.z += Math.sin(s.heading)*curSpeed*dt;
  updateCruiseDepth(s, dt);
  s.pos.y += Math.sin(now*0.4+s.phase2)*dt*2.0;
  clampToSeaBounds(s.pos, { swim:true });
  g.position.copy(s.pos);
  g.up.set(0,1,0);
  g.lookAt(s.pos.x+Math.cos(s.heading), s.pos.y+Math.sin(now*0.4+s.phase2)*0.001, s.pos.z+Math.sin(s.heading));
  // 方向転換時に体をロール
  const turnRate=s.headingTarget-s.heading;
  g.rotateZ(Math.max(-0.5, Math.min(0.5, turnRate*1.4)));
}

function updateEntry(entry, dt){
  if(appMode==='sea') updateEntrySea(entry, dt);
  else updateEntrySpiral(entry, dt);
}

/* モード切替本体：背景・虹ライン/光カーテン・スパークル/泡の見た目を差し替え、
 * 既存entriesは現在位置ベースで海ステートを起こすため座標ジャンプしない。 */
function setAppMode(mode, opts){
  opts=opts||{};
  mode = mode==='sea' ? 'sea' : 'spiral';
  if(mode===appMode && !opts.force) return;
  appMode=mode;
  const btn=document.getElementById('btnSeaMode');
  if(btn){
    btn.classList.toggle('sea', mode==='sea');
    btn.querySelector('.smIcon').textContent = mode==='sea' ? '🌊' : '🌀';
    btn.querySelector('.smLabel').textContent = mode==='sea' ? '海' : 'スパイラル';
  }
  spiralLineGroup.visible = (mode==='spiral');
  lightCurtainGroup.visible = (mode==='sea');
  sparkMat.map = (mode==='sea') ? bubbleTex : sparkleTex;
  sparkMat.needsUpdate=true;

  // 単語エントリーが海の遊泳ステートを持っていない場合、現在位置から起こす
  if(mode==='sea'){
    words.forEach(w=> seedSeaStateFromCurrentPosition(w));
  }

  // 背景既定：ユーザーがカスタム/プリセットを明示保存していない限り、モード既定へ切替
  if(!bgCustomColor && !opts.keepBgPreset){
    setBgPreset(MODE_DEFAULT_BG[mode], { skipSave:true });
  }
  try{ localStorage.setItem('kland-spiral-mode', mode); }catch(e){}
}

{

  });
}

/* ---------------------------------------------------------------------
 * 5) スパークル（Points、加算合成）
 * ------------------------------------------------------------------- */
function makeSparkleTexture(){
  const cv=document.createElement('canvas'); cv.width=64; cv.height=64;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,64,64);
  const cx=32, cy=32;
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,30);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.25,'rgba(255,255,255,0.9)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(cx,cy,30,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,4); ctx.lineTo(cx,60); ctx.moveTo(4,cy); ctx.lineTo(60,cy); ctx.stroke();
  const tex=new THREE.CanvasTexture(cv);
  return tex;
}
/* X1(海モード): 泡テクスチャ。白い小さな円の縁取り＋淡いハイライト */
function makeBubbleTexture(){
  const cv=document.createElement('canvas'); cv.width=64; cv.height=64;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,64,64);
  const cx=32, cy=32, r=26;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'rgba(255,255,255,0.05)');
  grad.addColorStop(0.7,'rgba(210,240,255,0.16)');
  grad.addColorStop(1,'rgba(255,255,255,0.55)');
  ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=2; ctx.stroke();
  // 小さなハイライト
  ctx.beginPath(); ctx.arc(cx-8,cy-9,5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill();
  const tex=new THREE.CanvasTexture(cv);
  return tex;
}
const sparkleTex=makeSparkleTexture();
const bubbleTex=makeBubbleTexture();

function burstSparkle(atPos){
  // 新しい単語出現時のキラッと弾ける小バースト：既存スパークルの一部を瞬間的にそのポイント付近へ寄せて明るくする
  let n=0;
  for(let i=0;i<SPARK_COUNT_MAX && n<26;i++){
    if(Math.random()<0.12){
      sparkData[i].burst=1.0;
      const ang=Math.random()*Math.PI*2, r=Math.random()*22;
      sparkPos[i*3]=atPos.x+Math.cos(ang)*r;
      sparkPos[i*3+1]=atPos.y+(Math.random()-0.5)*18;
      sparkPos[i*3+2]=atPos.z+Math.sin(ang)*r;
      n++;
    }
  }
}

/* ---------------------------------------------------------------------
 * 6) 質感（マテリアル）ビルダー
 * ------------------------------------------------------------------- */
function buildMaterial(kind, colorHex, opts){
  opts=opts||{};
  const col=new THREE.Color(colorHex);
  switch(kind){
    case 'gold': {
      const c=col.clone().offsetHSL(0, 0.05, 0.02).lerp(new THREE.Color(0xffcf6b), 0.35);
      return new THREE.MeshStandardMaterial({ color:c, metalness:0.9, roughness:0.42, envMapIntensity:1.05, emissive:new THREE.Color(0x2a1a00), emissiveIntensity:0.1 });
    }
    case 'silver': {
      const c=col.clone().lerp(new THREE.Color(0xdfe7ef), 0.4);
      return new THREE.MeshStandardMaterial({ color:c, metalness:0.9, roughness:0.38, envMapIntensity:1.1 });
    }
    case 'rainbow': {
      return new THREE.MeshStandardMaterial({ color:0xffffff, vertexColors:true, metalness:0.35, roughness:0.35, envMapIntensity:1.1, emissive:new THREE.Color(0x220033), emissiveIntensity:0.22 });
    }
    case 'neon': {
      return new THREE.MeshStandardMaterial({ color:col, metalness:0.1, roughness:0.4, emissive:col.clone(), emissiveIntensity:0.85 });
    }
    case 'glass': {
      const c=col.clone().lerp(new THREE.Color(0x8fd7ff), 0.5);
      return new THREE.MeshPhysicalMaterial({ color:c, transparent:true, opacity:0.55, roughness:0.08, metalness:0.05, envMapIntensity:1.8, transmission:0.55, thickness:1.2, ior:1.35, emissive:c.clone(), emissiveIntensity:0.08 });
    }
    case 'pearl': {
      const c=col.clone().lerp(new THREE.Color(0xffe3f2), 0.45);
      return new THREE.MeshPhysicalMaterial({ color:c, roughness:0.18, metalness:0.15, clearcoat:1.0, clearcoatRoughness:0.12, envMapIntensity:1.4, sheen:1.0, sheenColor:new THREE.Color(0xffd6ea) });
    }
    default:
      return new THREE.MeshStandardMaterial({ color:col, metalness:0.2, roughness:0.5 });
  }
}
function applyRainbowVertexColors(geo){
  geo.computeBoundingBox();
  const bb=geo.boundingBox;
  const w=Math.max(1e-4, bb.max.x-bb.min.x);
  const pos=geo.attributes.position;
  const colors=new Float32Array(pos.count*3);
  const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i);
    const t=(x-bb.min.x)/w;
    c.setHSL((t*0.85)%1, 0.85, 0.62);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
}

/* ---------------------------------------------------------------------
 * 7) 単語メッシュ生成（袋文字／踊る文字 対応）
 * ------------------------------------------------------------------- */
const MAX_WORDS=40;
let words=[]; // {id, text, group, decision, t, speedMul, createdAt, danceMeshes?, phase}
let idSeq=1;

function buildWordVisual(text, decision){
  const group=new THREE.Group();
  const desc={ text, size:38, depth:12, bevel:1.6, bold:true, font: decision.material==='gold'||decision.material==='silver' ? 'heavy':'gothic' };

  if(decision.style==='dance'){
    // 文字ごとに個別メッシュ化して上下ウェーブ＋回転を位相ずらしでアニメ
    const chars=Array.from(text.length ? text : ' ');
    const subGroups=[];
    let cursorX=0;
    const gap=6;
    chars.forEach((ch, idx)=>{
      const cdesc=Object.assign({}, desc, { text: ch, size: desc.size });
      const geo=buildText3dGeometry(cdesc);
      geo.computeBoundingBox();
      const w=geo.boundingBox.max.x-geo.boundingBox.min.x;
      if(decision.material==='rainbow') applyRainbowVertexColors(geo);
      const mat=buildMaterial(decision.material, decision.color);
      const mesh=new THREE.Mesh(geo, mat);
      mesh.castShadow=true; mesh.receiveShadow=true;
      const sub=new THREE.Group();
      sub.add(mesh);
      sub.position.x = cursorX;
      sub.userData.phase = idx*0.55;
      subGroups.push(sub);
      group.add(sub);
      cursorX += w + gap;
    });
    // 全体を中央寄せ
    const totalW=cursorX-gap;
    subGroups.forEach(sg=>{ sg.position.x -= totalW/2; });
    group.userData.danceGroups=subGroups;
  } else if(decision.style==='outline'){
    // 袋文字：本体 + わずかに大きい縁メッシュ（BackSide・別色）を重ねる
    const geo=buildText3dGeometry(desc);
    if(decision.material==='rainbow') applyRainbowVertexColors(geo);
    const mat=buildMaterial(decision.material, decision.color);
    const mesh=new THREE.Mesh(geo, mat);
    mesh.castShadow=true; mesh.receiveShadow=true;
    group.add(mesh);

    const outlineGeo=buildText3dGeometry(Object.assign({}, desc, { bevel:desc.bevel*0.6 }));
    outlineGeo.scale(1.09,1.09,1.0);
    outlineGeo.computeBoundingBox();
    const ob=outlineGeo.boundingBox;
    outlineGeo.translate(-(ob.min.x+ob.max.x)/2*0.0, 0, 0); // スケール後の中心ずれは無視できる程度
    const outlineColor=new THREE.Color(decision.color).offsetHSL(0,0,-0.28);
    const outlineMat=new THREE.MeshStandardMaterial({ color:outlineColor, side:THREE.BackSide, metalness:0.1, roughness:0.7 });
    const outlineMesh=new THREE.Mesh(outlineGeo, outlineMat);
    outlineMesh.position.z=-1.2;
    outlineMesh.castShadow=false;
    group.add(outlineMesh);
  } else {
    // normal
    const geo=buildText3dGeometry(desc);
    if(decision.material==='rainbow') applyRainbowVertexColors(geo);
    const mat=buildMaterial(decision.material, decision.color);
    const mesh=new THREE.Mesh(geo, mat);
    mesh.castShadow=true; mesh.receiveShadow=true;
    group.add(mesh);
  }

  // ほんのり発光オーラ（neon強調・その他は控えめ）
  return group;
}

/* ---------------------------------------------------------------------
 * 8) 単語の追加／削除／配置更新
 * ------------------------------------------------------------------- */
const wordRoot=new THREE.Group(); scene.add(wordRoot);
let pendingCount=0;

function addWordEntry(text, decision){
  const group=buildWordVisual(text, decision);
  return addEntryToSpiral(text, decision, group, 'word');
}

/* AIモデリングで完成したGLBを螺旋に投入するための共通ロジック（単語と同じ entries 管理に乗せる） */
function addEntryToSpiral(text, decision, group, kind){
  const t0 = Math.random()*0.06; // 開始位置を少しばらけさせる
  const entry={
    id: idSeq++, text, group, decision,
    kind: kind||'word',
    t: t0,
    speedMul: 0.75+Math.random()*0.5,
    phase: Math.random()*Math.PI*2,
    createdAt: performance.now()
  };
  wordRoot.add(group);
  words.push(entry);
  if(words.length>MAX_WORDS){
    const oldest=words.shift();
    wordRoot.remove(oldest.group);
    disposeGroup(oldest.group);
  }
  placeEntry(entry, 0);
  burstSparkle(spiralPoint(entry.t));
  renderWordList();
  return entry;
}
function disposeGroup(g){
  g.traverse(o=>{
    if(o.isMesh){
      if(o.geometry) o.geometry.dispose();
      if(o.material){
        (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());
      }
    }
  });
}
function removeWordEntry(id){
  if(centerModel && centerModel.id===id){
    removeCenterModel();
    return;
  }
  const idx=words.findIndex(w=>w.id===id);
  if(idx<0) return;
  const [w]=words.splice(idx,1);
  wordRoot.remove(w.group);
  disposeGroup(w.group);
  renderWordList();
}
/* X1: モードごとの位置更新関数（updateEntrySpiral / updateEntrySea）へ委譲。
 * 既存呼び出し元（animateループ等）はplaceEntryのままでよいよう、薄いラッパーとして残す。
 * Y2: DROP演出中（entry.dropVelあり＝爆散/再集結フェーズ中）は、position/rotationの
 * 見た目はupdateDropVisualsが専有する。ただし内部の進行度(t / sea.pos)は本来の軌道を
 * 保つため止めずに進める必要があるので、position/rotationだけ退避→復元する。 */
function placeEntry(entry, dt){
  if(entry.dropVel){
    const savedPos=entry.group.position.clone();
    const savedQuat=entry.group.quaternion.clone();
    updateEntry(entry, dt);
    entry.group.position.copy(savedPos);
    entry.group.quaternion.copy(savedQuat);
    return;
  }
  updateEntry(entry, dt);
  // Z2: 観客ワードの「飛び込み」演出中（entry.introFromあり）は、本来の軌道位置(=updateEntry後のposition)へ
  // 画面端の開始位置からease-outで寄せていく。スケールも0.15→1.0でズームインさせる。
  if(entry.introFrom){
    entry.introT = Math.min(1, (entry.introT||0) + dt/AUDIENCE_INTRO_DURATION);
    const k = 1 - Math.pow(1-entry.introT, 3); // ease-out cubic
    const target=entry.group.position.clone();
    entry.group.position.lerpVectors(entry.introFrom, target, k);
    const baseScale = entry.introBaseScale || (entry.introBaseScale = entry.group.scale.x||1);
    const s = baseScale * (0.15 + 0.85*k);
    entry.group.scale.setScalar(s);
    if(entry.introT>=1){
      entry.group.scale.setScalar(baseScale);
      entry.introFrom=null;
    }
  }
}

/* ---------------------------------------------------------------------
 * 8.5) センターステージ（AIモデリング生成物の特等席）
 * 螺旋の中心軸上（x=0,z=0）に単語の約2.5〜3倍の存在感で配置し、
 * ゆっくり自転＋わずかな浮遊で「特別な一体」を演出する。
 * 新しいモデルが完成したら、先代は通常サイズへ縮んで螺旋へ移籍（words配列へ合流）。
 *
 * S1対応：センターの高さは「カメラから見て画面のド真ん中」に来る必要がある。
 * OrbitControlsはカメラのforward方向を常にcontrols.targetへ向けるため、
 * x=0,z=0（カメラ視線とY軸の交点）のY座標はちょうどcontrols.target.yに一致する
 * （= NDC原点＝画面中心に投影される）。よって固定値ではなく起動時のtarget.yを基準にする。
 * ウィンドウリサイズはaspectしか変えずtargetの投影位置には影響しないため、リサイズ後も中心を保つ。
 * ------------------------------------------------------------------- */
const CENTER_STAGE={
  y: controls.target.y,                    // 画面中心＝カメラ注視点の高さ（x=0,z=0軸との交点）
  sizeMul: 2.7,                            // 単語サイズの約2.7倍の存在感
  maxRadius: SPIRAL.radius*0.62,           // 螺旋の内径からはみ出しすぎない上限（バウンディング半径基準）
  spinSpeed: 0.3,                          // ターンテーブル自転（rad/s）
  floatAmp: 4.5,                           // 上下浮遊の振幅
  floatSpeed: 0.6,                         // 上下浮遊の速さ
  introDuration: 0.8,                      // 登場スケールアニメの時間(s)
};
let centerModel=null; // { id, text, group, decision, kind:'model-center', baseScale, spinAngle, floatPhase, introT, introDone, jobId }

function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }

/* 単語同様のバウンディングボックス基準で、センター向けにスケールし直す
 * （loadGlbAsGroupで一度 MODEL_TARGET_SIZE=42 相当に正規化済み・group.scaleにその倍率が入った状態で受け取り、
 *   その「現在のscale」を基準にさらにsizeMul倍する。ただしmaxRadiusを超える場合は縮めて内径に収める。
 *   ※ group.scaleを絶対値で上書きすると、GLB原寸→単語サイズへの正規化倍率が失われてしまうため、
 *     必ず現在のscaleに対する相対倍率(mul)として算出し、最終的に「現在scale × mul」を目標スケールにする） */
function fitGroupToCenterStage(group){
  group.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(group);
  const size=new THREE.Vector3(); box.getSize(size);
  const horizRadius=Math.max(size.x, size.z)/2 * CENTER_STAGE.sizeMul;
  let mul=CENTER_STAGE.sizeMul;
  if(horizRadius>CENTER_STAGE.maxRadius && horizRadius>1e-4){
    mul *= CENTER_STAGE.maxRadius/horizRadius;
  }
  // group.scaleは等方（setScalarで設定済み）前提。現在の倍率にmulを掛けた絶対スケールを返す。
  const currentScale=group.scale.x || 1;
  return currentScale*mul;
}

/* AIモデリング完成時：センターに新モデルを迎える（既存センターがあれば先に螺旋へ移籍）
 * opts.jobId: このモデルを生成したジョブID（修正チャットの系譜追跡に使用）
 * opts.replaceInPlace: true の場合、W1の「修正チャット」完成時の差し替え。
 *   先代を螺旋へ送らず、centerModelのGLBだけを新しいものに差し替える（自転・浮遊の位相は引き継ぐ）。 */
function promoteToCenterStage(text, decision, group, opts){
  opts=opts||{};
  const prevSpinAngle = (opts.replaceInPlace && centerModel) ? centerModel.spinAngle : null;
  const prevFloatPhase = (opts.replaceInPlace && centerModel) ? centerModel.floatPhase : null;
  if(centerModel){
    if(opts.replaceInPlace){
      // 先代の土台グループだけ場から下げる（螺旋へは送らない）
      wordRoot.remove(centerModel.group);
      disposeGroup(centerModel.group);
      centerModel=null;
    } else {
      retireCenterModelToSpiral();
    }
  }
  const baseScale=fitGroupToCenterStage(group);
  group.position.set(0, CENTER_STAGE.y, 0);
  group.scale.setScalar(0.0001); // スケール0から登場アニメを開始
  wordRoot.add(group);
  const entry={
    id: idSeq++, text, group, decision,
    kind:'model-center',
    baseScale,
    spinAngle: prevSpinAngle!=null ? prevSpinAngle : Math.random()*Math.PI*2,
    floatPhase: prevFloatPhase!=null ? prevFloatPhase : Math.random()*Math.PI*2,
    introT: 0,
    introDone: false,
    createdAt: performance.now(),
    jobId: opts.jobId || null
  };
  centerModel=entry;
  group.rotation.y=entry.spinAngle;
  // 登場演出：センター位置で大きめのスパークルバースト＋一瞬の強い発光リング
  burstSparkle(new THREE.Vector3(0, CENTER_STAGE.y, 0));
  burstSparkle(new THREE.Vector3(0, CENTER_STAGE.y, 0));
  spawnCenterDebutRing();
  renderWordList();
  focusCameraOnCenter();
  return entry;
}

/* 先代センターモデルを通常サイズに縮めて螺旋の軌道（words配列）へ合流させる */
function retireCenterModelToSpiral(){
  if(!centerModel) return;
  const c=centerModel;
  centerModel=null;
  // センターの土台グループをそのまま螺旋entriesへ移籍。以後は通常の🔧モデル同様に扱う。
  // baseScaleはloadGlbAsGroup由来の単語相当スケール×centerStageSizeMul相当なので、
  // sizeMulで割り戻して元の単語サイズ（≒MODEL_TARGET_SIZE）に戻す。
  const normalScale = c.baseScale / CENTER_STAGE.sizeMul;
  c.group.scale.setScalar(normalScale);
  c.group.rotation.set(0,0,0);
  const t0=Math.random()*0.06;
  const entry={
    id: c.id, text:c.text, group:c.group, decision:c.decision,
    kind:'model',
    t: t0,
    speedMul: 0.75+Math.random()*0.5,
    phase: Math.random()*Math.PI*2,
    createdAt: performance.now()
  };
  words.push(entry);
  if(words.length>MAX_WORDS){
    const oldest=words.shift();
    wordRoot.remove(oldest.group);
    disposeGroup(oldest.group);
  }
  placeEntry(entry, 0);
}

/* センターモデルの✕削除：空席のままでよい */
function removeCenterModel(){
  if(!centerModel) return;
  wordRoot.remove(centerModel.group);
  disposeGroup(centerModel.group);
  centerModel=null;
  renderWordList();
}

/* 登場演出：センター位置に一瞬だけ広がる発光リング（既存のPoints/Lineの仕組みを流用し、専用の簡易リングメッシュを追加してフェードアウト） */
const centerRingPool=[];
function spawnCenterDebutRing(){
  const geo=new THREE.RingGeometry(1, 1.4, 48);
  const mat=new THREE.MeshBasicMaterial({ color:0x9fe0ff, transparent:true, opacity:0.9, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });
  const ring=new THREE.Mesh(geo, mat);
  ring.position.set(0, CENTER_STAGE.y, 0);
  ring.rotation.x=-Math.PI/2;
  scene.add(ring);
  centerRingPool.push({ mesh:ring, born:performance.now() });
}
function updateCenterRings(){
  const now=performance.now();
  for(let i=centerRingPool.length-1;i>=0;i--){
    const r=centerRingPool[i];
    const t=(now-r.born)/900; // 0.9sで消える
    if(t>=1){
      scene.remove(r.mesh);
      r.mesh.geometry.dispose(); r.mesh.material.dispose();
      centerRingPool.splice(i,1);
      continue;
    }
    const scale=1 + t*38;
    r.mesh.scale.setScalar(scale);
    r.mesh.material.opacity=0.9*(1-t);
  }
}

/* センターモデルの毎フレーム更新：登場イージング＋自転＋浮遊 */
function placeCenterModel(dt){
  if(!centerModel) return;
  const c=centerModel;
  if(!c.introDone){
    c.introT=Math.min(1, c.introT + dt/CENTER_STAGE.introDuration);
    const eased=easeOutCubic(c.introT);
    c.group.scale.setScalar(Math.max(0.0001, c.baseScale*eased));
    if(c.introT>=1) c.introDone=true;
  } else {
    c.group.scale.setScalar(c.baseScale);
  }
  c.spinAngle += dt*CENTER_STAGE.spinSpeed;
  c.group.rotation.y=c.spinAngle;
  const now=performance.now()*0.001;
  const floatY=Math.sin(now*CENTER_STAGE.floatSpeed+c.floatPhase)*CENTER_STAGE.floatAmp;
  c.group.position.set(0, CENTER_STAGE.y+floatY, 0);
}

/* V2: モデル完成の瞬間、カメラを少しだけセンターへ寄せる控えめなイージング（ドラッグ中はスキップ） */
let camFocusAnim=null; // { fromPos, toPos, fromTarget, toTarget, t0, duration }
function focusCameraOnCenter(){
  if(controls._tsDragging) return; // ユーザー操作中は演出をスキップ
  const targetPos=new THREE.Vector3(0, CENTER_STAGE.y, 0);
  const dir=camera.position.clone().sub(controls.target);
  const newTarget=controls.target.clone().lerp(targetPos, 0.35);
  const shrunkDir=dir.clone().multiplyScalar(0.87); // 半径を約13%縮める（控えめ）
  const newCamPos=newTarget.clone().add(shrunkDir);
  camFocusAnim={
    fromPos:camera.position.clone(), toPos:newCamPos,
    fromTarget:controls.target.clone(), toTarget:newTarget,
    t0:performance.now(), duration:1200
  };
}
function updateCameraFocusAnim(){
  if(!camFocusAnim) return;
  if(controls._tsDragging){ camFocusAnim=null; return; } // 演出中にドラッグ開始されたら即中断
  const elapsed=performance.now()-camFocusAnim.t0;
  const t=Math.min(1, elapsed/camFocusAnim.duration);
  const eased=easeOutCubic(t);
  camera.position.lerpVectors(camFocusAnim.fromPos, camFocusAnim.toPos, eased);
  controls.target.lerpVectors(camFocusAnim.fromTarget, camFocusAnim.toTarget, eased);
  if(t>=1) camFocusAnim=null;
}
controls.addEventListener('start', ()=>{ controls._tsDragging=true; camFocusAnim=null; });
controls.addEventListener('end', ()=>{ controls._tsDragging=false; });

/* ---------------------------------------------------------------------
 * 8.6) W2: Matrixコードレイン（センターCAD空間のライブ演出）
 * ジョブ実行中、センター空間に縦長の半透明ホログラムパネルを出し、
 * /model/log を700ms間隔でポーリングして増分テキストを上から下へ流す。
 * さらに周囲に控えめな文字雨（カタカナ/数字/記号のCanvasTextureストリップ）を追加する。
 * 完成/エラー時は0.6sで溶けるようにフェードアウトしてからcenter登場演出へバトンタッチする。
 * ------------------------------------------------------------------- */
const CODE_RAIN={
  panelW: 96, panelH: 150,           // パネルの実寸（ワールド単位・単語sizeと同系統のスケール感）
  y: CENTER_STAGE.y,                  // センターステージと同じ高さを中心に配置
  spinSpeed: 0.12,                    // ゆるやかな自転（rad/s）
  pollIntervalMs: 700,
  canvasW: 1024, canvasH: 1024,
  fadeMs: 600,
  streamerCount: 5,                   // 周囲の文字雨ストリップ本数
};
const CODE_RAIN_GLYPHS='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ForgeCAD{}();=><.';

function randGlyph(){ return CODE_RAIN_GLYPHS[(Math.random()*CODE_RAIN_GLYPHS.length)|0]; }

/* --- パネル本体：CanvasTexture(1024x1024)に「ステージ名（上部）＋流れるテキスト」を描画 --- */
function createCodeRainPanel(){
  const cv=document.createElement('canvas');
  cv.width=CODE_RAIN.canvasW; cv.height=CODE_RAIN.canvasH;
  const ctx=cv.getContext('2d');
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;

  const geo=new THREE.PlaneGeometry(CODE_RAIN.panelW, CODE_RAIN.panelH);
  const mat=new THREE.MeshBasicMaterial({
    map:tex, transparent:true, opacity:0, side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const mesh=new THREE.Mesh(geo, mat);
  mesh.position.set(0, CODE_RAIN.y, 0);
  mesh.renderOrder=5;

  // 背面にもう1枚重ねてX字にクロスさせ、どの角度から見ても文字が読めるホログラム感を出す
  const mesh2=new THREE.Mesh(geo, mat.clone());
  mesh2.rotation.y=Math.PI/2;
  mesh2.renderOrder=5;

  const group=new THREE.Group();
  group.add(mesh); group.add(mesh2);
  group.visible=false;
  scene.add(group);

  return {
    group, mesh, mesh2, cv, ctx, tex,
    lines:[],            // 表示中の行（下が最新）
    curLine:'',           // 現在組み立て中の行
    stageLabel:'AI設計中…',
    cursorOn:true,
    cursorPhase:0,
    spinAngle:0,
    opacity:0,
    state:'idle',         // idle | in | active | out
    tStart:0,
    errorFlash:false,
  };
}
const codeRainPanel=createCodeRainPanel();

const CODE_RAIN_MAX_LINES=26;
const CODE_RAIN_CHARS_PER_LINE=34;

function codeRainPushText(text){
  if(!text) return;
  for(const ch of text){
    if(ch==='\n'){
      codeRainPanel.lines.push(codeRainPanel.curLine);
      codeRainPanel.curLine='';
    } else {
      codeRainPanel.curLine += ch;
      if(codeRainPanel.curLine.length>=CODE_RAIN_CHARS_PER_LINE){
        codeRainPanel.lines.push(codeRainPanel.curLine);
        codeRainPanel.curLine='';
      }
    }
  }
  while(codeRainPanel.lines.length>CODE_RAIN_MAX_LINES){
    codeRainPanel.lines.shift();
  }
}

function drawCodeRainCanvas(){
  const p=codeRainPanel;
  const ctx=p.ctx, W=CODE_RAIN.canvasW, H=CODE_RAIN.canvasH;
  ctx.clearRect(0,0,W,H);

  // 背景のうっすらグラデーションパネル（ホログラムの土台感）
  const errTint = p.errorFlash;
  const baseGrad=ctx.createLinearGradient(0,0,0,H);
  if(errTint){
    baseGrad.addColorStop(0,'rgba(60,4,4,0.55)');
    baseGrad.addColorStop(1,'rgba(30,0,0,0.15)');
  } else {
    baseGrad.addColorStop(0,'rgba(10,30,26,0.5)');
    baseGrad.addColorStop(1,'rgba(4,10,14,0.12)');
  }
  ctx.fillStyle=baseGrad;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = errTint ? 'rgba(255,110,110,0.55)' : 'rgba(140,255,210,0.35)';
  ctx.lineWidth=6;
  ctx.strokeRect(3,3,W-6,H-6);

  // 上部：ステージ名（大きめ・W3）
  ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  ctx.font='700 46px "Courier New",monospace';
  ctx.fillStyle = errTint ? 'rgba(255,150,150,0.95)' : 'rgba(180,255,230,0.95)';
  ctx.shadowColor = errTint ? 'rgba(255,80,80,0.9)' : 'rgba(120,255,210,0.85)';
  ctx.shadowBlur=18;
  ctx.fillText(p.stageLabel||'', W/2, 74);
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(140,255,210,0.25)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(60,96); ctx.lineTo(W-60,96); ctx.stroke();

  // 本体：等幅フォントでログを上→下へ（最新行が下）流す。行が新しいほど明るい。
  ctx.textAlign='left';
  const fontSize=25;
  ctx.font=fontSize+'px "Courier New",monospace';
  const lineH=32;
  const bodyTop=130;
  const bodyBottom=H-40;
  const maxLines=Math.floor((bodyBottom-bodyTop)/lineH);
  const shown=p.lines.slice(-maxLines);
  const n=shown.length;
  for(let i=0;i<n;i++){
    const y=bodyBottom-(n-1-i)*lineH;
    if(y<bodyTop-lineH) continue;
    const ageRatio = (n-1-i)/Math.max(1,maxLines-1); // 0=最新(下), 1=最古(上)
    const alpha=Math.max(0.12, 1-ageRatio*0.85);
    ctx.fillStyle = errTint
      ? 'rgba(255,'+Math.round(120+90*(1-ageRatio))+',120,'+alpha.toFixed(2)+')'
      : 'rgba('+Math.round(120+90*(1-ageRatio))+',255,'+Math.round(190+50*(1-ageRatio))+','+alpha.toFixed(2)+')';
    let line=shown[i];
    if(line.length>CODE_RAIN_CHARS_PER_LINE) line=line.slice(0,CODE_RAIN_CHARS_PER_LINE);
    ctx.fillText(line, 44, y);
  }
  // 現在行（うっすら明滅カーソル付き）
  const curY=bodyBottom+lineH*0.02;
  if(curY>=bodyTop-lineH){
    ctx.fillStyle = errTint ? 'rgba(255,190,190,0.95)' : 'rgba(220,255,240,0.95)';
    let curLine=p.curLine;
    if(curLine.length>CODE_RAIN_CHARS_PER_LINE) curLine=curLine.slice(-CODE_RAIN_CHARS_PER_LINE);
    ctx.fillText(curLine, 44, Math.min(curY, bodyBottom));
    if(p.cursorOn){
      const cw=ctx.measureText(curLine).width;
      ctx.fillRect(44+cw+4, Math.min(curY, bodyBottom)-fontSize+4, 14, fontSize*0.85);
    }
  }
  p.tex.needsUpdate=true;
}

/* --- 周囲の文字雨（数本の縦ストリップPlane。各ストリップは独自CanvasTextureで数字/カタカナが流れる） --- */
function createCodeRainStreamers(){
  const streamers=[];
  const n=CODE_RAIN.streamerCount;
  for(let i=0;i<n;i++){
    const cv=document.createElement('canvas');
    cv.width=64; cv.height=512;
    const ctx=cv.getContext('2d');
    const tex=new THREE.CanvasTexture(cv);
    tex.colorSpace=THREE.SRGBColorSpace;
    const geo=new THREE.PlaneGeometry(7, 130);
    const mat=new THREE.MeshBasicMaterial({
      map:tex, transparent:true, opacity:0, side:THREE.DoubleSide,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    const mesh=new THREE.Mesh(geo, mat);
    const ang=(i/n)*Math.PI*2 + Math.random()*0.3;
    const radius=CENTER_STAGE.maxRadius*0.92 + Math.random()*10;
    mesh.userData.angle=ang;
    mesh.userData.radius=radius;
    mesh.userData.speed=0.35+Math.random()*0.4; // 縦スクロール速度
    mesh.userData.colOffset=Math.random()*100;
    mesh.userData.cols=[]; // 各列の文字配列（縦に流れる）
    const colCount=3;
    for(let c=0;c<colCount;c++){
      const chars=[];
      const rows=16;
      for(let r=0;r<rows;r++) chars.push(randGlyph());
      mesh.userData.cols.push({ x:c, chars, headY:Math.random()*rows });
    }
    mesh.visible=false;
    scene.add(mesh);
    streamers.push({ mesh, ctx, cv, tex });
  }
  return streamers;
}
const codeRainStreamers=createCodeRainStreamers();

function drawStreamerCanvas(s, dt){
  const ctx=s.ctx, W=s.cv.width, H=s.cv.height;
  ctx.clearRect(0,0,W,H);
  const cols=s.mesh.userData.cols;
  const rowH=H/16;
  cols.forEach(col=>{
    col.headY += s.mesh.userData.speed*dt*10;
    if(col.headY>20){
      col.headY=0;
      col.chars=col.chars.map(()=>randGlyph());
    }
    // たまに文字を差し替えてチラつかせる
    if(Math.random()<0.06){
      const idx=(Math.random()*col.chars.length)|0;
      col.chars[idx]=randGlyph();
    }
    const colX=(col.x+0.5)*(W/cols.length);
    ctx.textAlign='center';
    ctx.font='700 22px "Courier New",monospace';
    col.chars.forEach((ch,ri)=>{
      const y=((ri - col.headY)%18+18)%18 * rowH;
      const distFromHead=Math.abs((ri - col.headY + 18)%18);
      const bright=Math.max(0, 1-distFromHead/12);
      if(bright<=0.02) return;
      ctx.fillStyle='rgba('+Math.round(140+60*bright)+',255,'+Math.round(160+70*bright)+','+(0.15+bright*0.8).toFixed(2)+')';
      ctx.fillText(ch, colX, y+rowH*0.8);
    });
  });
  s.tex.needsUpdate=true;
}

/* --- ジョブ管理：どのジョブが現在パネルを占有しているか --- */
let codeRainActiveJobId=null;
let codeRainLogOffset=0;
let codeRainPollTimer=null;

function startCodeRain(jobId, promptText, isRefine){
  codeRainActiveJobId=jobId;
  codeRainLogOffset=0;
  const p=codeRainPanel;
  p.lines=[]; p.curLine=''; p.errorFlash=false;
  p.stageLabel = (isRefine?'修正チャット設計中…':'AI設計中…');
  p.state='in'; p.tStart=performance.now(); p.opacity=0;
  p.group.visible=true;
  codeRainStreamers.forEach(s=>{ s.mesh.visible=true; s.mesh.material.opacity=0; });
  clearTimeout(codeRainPollTimer);
  pollCodeRainLog();
}
async function pollCodeRainLog(){
  const jobId=codeRainActiveJobId;
  if(!jobId) return;
  try{
    const res=await fetch(BRIDGE_ORIGIN+'/model/log?id='+encodeURIComponent(jobId)+'&from='+codeRainLogOffset);
    if(res.ok){
      const json=await res.json();
      if(json && typeof json.text==='string' && json.text){
        codeRainPushText(json.text);
      }
      if(json && typeof json.next==='number') codeRainLogOffset=json.next;
    }
  }catch(e){ /* ポーリング失敗は静かに次回へ */ }
  if(codeRainActiveJobId===jobId){
    codeRainPollTimer=setTimeout(pollCodeRainLog, CODE_RAIN.pollIntervalMs);
  }
}
function updateCodeRainStage(jobId, status){
  if(codeRainActiveJobId!==jobId) return;
  const stage=status.stage||'queued';
  const label = MODEL_STAGE_JA[stage] || status.stageLabel || stage;
  codeRainPanel.stageLabel = status.detail || label;
}
function failCodeRain(jobId){
  if(codeRainActiveJobId!==jobId) return;
  codeRainPanel.errorFlash=true;
  codeRainPanel.stageLabel='エラー';
  // 赤く明滅させてから少し待ってフェードアウト
  setTimeout(()=>{ finishCodeRain(jobId); }, 550);
}
function finishCodeRain(jobId){
  return new Promise((resolve)=>{
    if(codeRainActiveJobId!==jobId){ resolve(); return; }
    codeRainActiveJobId=null;
    clearTimeout(codeRainPollTimer);
    const p=codeRainPanel;
    p.state='out'; p.tStart=performance.now();
    setTimeout(()=>{
      p.group.visible=false;
      codeRainStreamers.forEach(s=>{ s.mesh.visible=false; });
      resolve();
    }, CODE_RAIN.fadeMs + 30);
  });
}

function updateCodeRain(dt){
  const p=codeRainPanel;
  if(p.group.visible){
    // フェードイン/アウト
    if(p.state==='in'){
      const t=Math.min(1,(performance.now()-p.tStart)/280);
      p.opacity=t;
      if(t>=1) p.state='active';
    } else if(p.state==='out'){
      const t=Math.min(1,(performance.now()-p.tStart)/CODE_RAIN.fadeMs);
      p.opacity=1-t;
    } else {
      p.opacity=1;
    }
    p.mesh.material.opacity=Math.max(0,p.opacity)*0.92;
    p.mesh2.material.opacity=Math.max(0,p.opacity)*0.92;

    // 自転＋わずかな浮遊
    p.spinAngle += dt*CODE_RAIN.spinSpeed;
    p.group.rotation.y=p.spinAngle;
    const floatY=Math.sin(performance.now()*0.0006)*3.2;
    p.group.position.set(0, CODE_RAIN.y+floatY, 0);

    // カーソル明滅
    p.cursorPhase += dt*3.2;
    p.cursorOn = Math.sin(p.cursorPhase)>0;

    // エラー明滅（赤フラッシュ）
    if(p.errorFlash){
      const flick=0.5+0.5*Math.sin(performance.now()*0.02);
      p.mesh.material.opacity=Math.max(0,p.opacity)*(0.6+flick*0.4);
      p.mesh2.material.opacity=p.mesh.material.opacity;
    }
    drawCodeRainCanvas();
  }
  // 文字雨ストリップ：パネル表示中のみ描画更新（パフォーマンス優先で控えめに）
  const streamersOn = p.group.visible && p.opacity>0.02;
  codeRainStreamers.forEach(s=>{
    if(!s.mesh.visible) return;
    const targetOp = streamersOn ? Math.min(0.55, p.opacity*0.55) : 0;
    s.mesh.material.opacity += (targetOp - s.mesh.material.opacity)*0.12;
    if(streamersOn){
      const ang=s.mesh.userData.angle + performance.now()*0.00004;
      const r=s.mesh.userData.radius;
      s.mesh.position.set(Math.cos(ang)*r, CODE_RAIN.y - 8, Math.sin(ang)*r);
      s.mesh.lookAt(0, CODE_RAIN.y-8, 0);
      drawStreamerCanvas(s, dt);
    }
  });
}

async function pollModelJob(jobId){
  const info=modelJobsUi.get(jobId);
  if(!info) return; // カードが閉じられていたら追跡終了
  try{
    const res=await fetch(BRIDGE_ORIGIN+'/model/status?id='+encodeURIComponent(jobId));
    if(!res.ok) throw new Error('http '+res.status);
    const status=await res.json();
    updateJobCard(jobId, status);
    updateCodeRainStage(jobId, status);
    if(status.done){
      if(status.stage==='done' && status.glbUrl){
        await handleModelDone(jobId, status);
        // 完成カードは少し見せてから自動で消す
        info.timer=setTimeout(()=>destroyJobCard(jobId), 1800);
      } else if(status.stage==='error'){
        failCodeRain(jobId);
      }
      // error時はユーザーが✕で閉じるまで残す
      return;
    }
    info.timer=setTimeout(()=>pollModelJob(jobId), 1500);
  }catch(e){
    updateJobCard(jobId, { stage:'error', error:'ブリッジへの接続に失敗しました', elapsed:0 });
    failCodeRain(jobId);
  }
}

/* GLBをロードしてバウンディングボックスを単語と同程度のサイズに正規化 → 螺旋へ投入 */
const gltfLoader=new GLTFLoader();
const MODEL_TARGET_SIZE=42; // 単語の size:38 相当に揃える目安
function loadGlbAsGroup(url){
  return new Promise((resolve, reject)=>{
    gltfLoader.load(url, (gltf)=>{
      const root=new THREE.Group();
      const inner=gltf.scene || (gltf.scenes && gltf.scenes[0]);
      if(!inner){ reject(new Error('empty gltf scene')); return; }
      // ForgeCAD産はZ-up。Three.jsのY-upへ変換。
      inner.rotation.x=-Math.PI/2;
      root.add(inner);
      inner.traverse(o=>{
        if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; }
      });
      // バウンディングボックスで正規化スケール（回転適用後の実寸で測る）
      root.updateMatrixWorld(true);
      const box=new THREE.Box3().setFromObject(root);
      const size=new THREE.Vector3(); box.getSize(size);
      const maxDim=Math.max(size.x, size.y, size.z, 1e-4);
      const scale=MODEL_TARGET_SIZE/maxDim;
      root.scale.setScalar(scale);
      // 底面をy=0に接地、中心をx=0/z=0に
      root.updateMatrixWorld(true);
      const box2=new THREE.Box3().setFromObject(root);
      const center=new THREE.Vector3(); box2.getCenter(center);
      root.position.x -= center.x;
      root.position.z -= center.z;
      root.position.y -= box2.min.y;
      resolve(root);
    }, undefined, (err)=> reject(err));
  });
}

async function handleModelDone(jobId, status){
  try{
    const group=await loadGlbAsGroup(status.glbUrl);
    const decision=heuristicDecide(status.name||'モデル');
    // モデル系は質感をヒューリスティックの色そのまま使い、材質ラベルだけ明示
    decision.material = decision.material || 'silver';
    decision.style='normal';
    decision.reason = status.refined ? 'AIモデリング修正完了' : 'AIモデリング完成';
    // コードレインパネル：溶けるようにフェードアウト→センター登場演出へバトンタッチ
    await finishCodeRain(jobId);
    // 完成したAIモデルは螺旋に直接乗せず、まず螺旋中心のセンターステージへ迎える
    // （修正チャット完成時は先代を螺旋へ送らずセンターのGLBだけ差し替える。
    //   通常の新規モデリング完成時は、先代がいれば自動的に通常サイズへ縮んで螺旋へ移籍する）
    promoteToCenterStage(status.name||'モデル', decision, group, { jobId, replaceInPlace: !!status.refined });
    showAiState(status.refined ? '「'+(status.name||'モデル')+'」を修正しました！' : '「'+(status.name||'モデル')+'」が完成しました！', false);
    // Y4: モデリング完成の実況テロップ
    tickerShow(status.refined ? 'AIが『'+(status.name||'モデル')+'』を修正しました' : 'AIが『'+(status.name||'モデル')+'』を実体化しました');
    if(refineMode) setRefineMode(false);
  }catch(e){
    console.error('GLB読み込みに失敗', e);
    showAiState('モデルの読み込みに失敗しました', true);
  }
}

function describeCameraError(e){
  let msg='カメラを起動できませんでした。';
  if(e && e.name==='NotAllowedError') msg='カメラへのアクセスが許可されていません。\n①ブラウザのアドレスバー左のアイコン→カメラを「許可」\n②macの システム設定→プライバシーとセキュリティ→カメラ で、お使いのブラウザをONにして、ブラウザを再起動してください。';
  else if(e && e.name==='NotFoundError' || (e && e.name==='OverconstrainedError')) msg='カメラが見つかりませんでした。（'+(e.name||'')+'）\n外付け/内蔵カメラの接続を確認してください。';
  else if(e && e.name==='NotReadableError') msg='カメラが他のアプリ（Zoom/FaceTime等）で使用中の可能性があります。他のアプリを閉じて再度お試しください。';
  else msg+='（'+((e&&e.name)||'不明なエラー')+'）';

/* X4: 🎥ムービー背景と📷撮影オーバーレイで同一のgetUserMediaストリームを共有する。
 * どちらか一方が既にストリームを保持していれば、それをそのまま使い回して二重要求を避ける。 */
async function acquireSharedCamStream(){
  if(camStream) return camStream;
  if(liveBgStream) return liveBgStream;
  return navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
}

async function openCamera(){
  camOverlay.classList.add('show');
  hideCamMsg();
  if(!window.isSecureContext){
    showCamMsg('このURL（'+location.origin+'）ではカメラを使えません。\n「スパイラル起動.command」から http://localhost:8787/… で開いてください。');
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showCamMsg('このブラウザではカメラ機能を利用できません。SafariかChromeでお試しください。');
    return;
  }
  try{
    camStream=await acquireSharedCamStream();
    camVideo.srcObject=camStream;
  }catch(e){
    showCamMsg(describeCameraError(e));
    console.warn('camera error', e);
  }
}
function closeCamera(){
  camOverlay.classList.remove('show');
  // 🎥ムービー背景が同じストリームを使用中なら、トラックは止めずに参照だけ外す
  if(camStream && camStream!==liveBgStream){
    camStream.getTracks().forEach(tr=>tr.stop());
  }
  camStream=null;
  camVideo.srcObject=null;
}
camCloseBtn.addEventListener('click', closeCamera);

/* ---------------------------------------------------------------------

 * ON: getUserMedia映像を、カメラに追従するフルスクリーンの背面クワッド（ShaderMaterial）へ

 *     間延び/切り抜き板のように見えてしまうため、以下の方式に変更：
 *       - クワッドはカメラ直前・視錐台にジャストフィットするサイズで毎フレーム追従
