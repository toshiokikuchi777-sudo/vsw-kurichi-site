<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KURICHI LAND ｜ 体験できるWebGL空間（石家庄 Neverland 構想）</title>
<style>
  :root{ --red:#E3261D; --yellow:#FFC20E; --cream:#FFF3D6; --ink:#241f1a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#bfe3f2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* HUD */
  #hud{ position:fixed; left:14px; top:14px; z-index:10; max-width:min(92vw,420px);
        background:rgba(36,31,26,.78); color:#fff; padding:14px 16px; border-radius:16px;
        border:2px solid var(--yellow); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #hud h1{ margin:0 0 2px; font-size:18px; letter-spacing:.5px; }
  #hud h1 b{ color:var(--yellow); }
  #hud .sub{ font-size:11.5px; opacity:.85; margin-bottom:10px; }
  #hud .keys{ font-size:11.5px; line-height:1.7; opacity:.92; }
  #hud .keys kbd{ background:#fff; color:var(--ink); border-radius:5px; padding:1px 6px; font-weight:700; font-size:11px; }
  #views{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10;
          display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:0 8px; }
  #views button{ cursor:pointer; border:none; border-radius:999px; padding:10px 16px; font-weight:800; font-size:13px;
          background:var(--red); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.25); transition:transform .12s, background .12s; }
  #views button:hover{ transform:translateY(-2px); }
  #views button.alt{ background:var(--yellow); color:var(--ink); }
  #views button.ghost{ background:rgba(255,255,255,.92); color:var(--ink); }
  #loader{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
           flex-direction:column; gap:14px; background:var(--yellow); color:var(--ink); transition:opacity .6s; }
  #loader .logo{ font-size:30px; font-weight:900; letter-spacing:1px; }
  #loader .logo b{ color:var(--red); }
  #loader .bar{ width:180px; height:8px; background:rgba(0,0,0,.12); border-radius:999px; overflow:hidden; }
  #loader .bar i{ display:block; height:100%; width:40%; background:var(--red); border-radius:999px; animation:slide 1.1s infinite ease-in-out; }
  @keyframes slide{ 0%{margin-left:-40%} 100%{margin-left:100%} }
  .hide{ opacity:0; pointer-events:none; }
  @media (max-width:560px){ #hud .keys .desktoponly{ display:none; } }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <h1>KURICHI <b>LAND</b> <span style="font-size:12px;opacity:.8">体験デモ</span></h1>
    <div class="sub">石家庄 Neverland 滹沱河集 ／ 島の中心 約650㎡（FACTORY 200㎡＋GARDEN 450㎡）</div>
    <div class="keys">
      <span class="desktoponly">🖱 ドラッグ＝見回す ／ ホイール＝ズーム<br>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動 ／ <kbd>Q</kbd><kbd>E</kbd> 上下 ／ <kbd>Shift</kbd> 加速<br></span>
      📱 1本指＝見回す ／ 2本指＝ズーム・移動<br>
      下のボタンで主要スポットへ
    </div>
  </div>

  <div id="views">
    <button data-view="overview" class="alt">🛰 全体</button>
    <button data-view="entrance">🚪 入口</button>
    <button data-view="factory">🏭 FACTORY</button>
    <button data-view="garden">🌿 GARDEN</button>
    <button data-view="photo">📸 フォトスポット</button>
    <button id="fsbtn" class="ghost">⛶ 全画面</button>
  </div>

  <div id="loader">
    <div class="logo">KURICHI <b>LAND</b></div>
    <div class="bar"><i></i></div>
    <div style="font-size:12px;opacity:.75">3D空間を組み立てています…</div>
  </div>

<script type="importmap">
{ "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const COL = {
  red:0xE3261D, yellow:0xFFC20E, cream:0xFFF3D6, white:0xffffff,
  wood:0x9C6B3A, darkwood:0x5f3f22, grass:0x77b54b, grass2:0x5d9b3a,
  pink:0xEBA7C4, stone:0xD9CAA6, sand:0xE8D8Ae, ink:0x241f1a,
  glass:0xBFE3EA, sky:0xBFE3F2, green:0x4E8A2E, water:0x4f9fd6, choco:0x7a4a22
};

// ---------- renderer / scene / camera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.sky);
scene.fog = new THREE.Fog(COL.sky, 70, 190);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1200);
camera.position.set(2, 7, 28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(-2, 2.4, -1);
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 2;
controls.maxDistance = 110;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x88a868, 0.85));
scene.add(new THREE.AmbientLight(0xffffff, 0.22));
const sun = new THREE.DirectionalLight(0xfff3df, 1.55);
sun.position.set(34, 52, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 180;
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.bias = -0.00045;
scene.add(sun);

// ---------- helpers ----------
function mat(color, o={}){ return new THREE.MeshStandardMaterial({ color, roughness:o.rough ?? 0.85, metalness:o.metal ?? 0.0, transparent:o.transparent||false, opacity:o.opacity ?? 1, side:o.side||THREE.FrontSide }); }
function box(w,h,d,color,o={}){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,color,seg=24,o={}){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function sph(r,color,o={}){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function cone(r,h,color,seg=8,o={}){ const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function add(parent, mesh, x,y,z){ mesh.position.set(x,y,z); parent.add(mesh); return mesh; }

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function canvasTex(draw, w=1024, h=512){ const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); draw(ctx,w,h); const t=new THREE.CanvasTexture(c); t.anisotropy=8; t.colorSpace=THREE.SRGBColorSpace; return t; }
function signPlane(w,h,tex){ return new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide })); }

function makeLabel(text, sub){
  const tex = canvasTex((ctx,w,h)=>{
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='rgba(36,31,26,.86)'; rr(ctx,20,20,w-40,h-40,60); ctx.fill();
    ctx.strokeStyle='#FFC20E'; ctx.lineWidth=10; rr(ctx,20,20,w-40,h-40,60); ctx.stroke();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.font='bold 96px "Hiragino Sans",sans-serif';
    ctx.fillText(text, w/2, h/2-26);
    ctx.fillStyle='#FFC20E'; ctx.font='bold 56px "Hiragino Sans",sans-serif';
    ctx.fillText(sub, w/2, h/2+62);
  }, 1024, 320);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:true }));
  s.scale.set(6.6, 2.06, 1);
  return s;
}

// ---------- world: water + island ----------
const water = new THREE.Mesh(new THREE.CircleGeometry(320,72), new THREE.MeshStandardMaterial({ color:COL.water, roughness:0.25, metalness:0.15 }));
water.rotation.x = -Math.PI/2; water.position.y = -0.35; scene.add(water);

const island = new THREE.Mesh(new THREE.CircleGeometry(42,72), mat(COL.grass,{rough:1}));
island.rotation.x = -Math.PI/2; island.receiveShadow = true; scene.add(island);

const beach = new THREE.Mesh(new THREE.RingGeometry(40,44,72), mat(COL.sand,{rough:1}));
beach.rotation.x = -Math.PI/2; beach.position.y = -0.08; beach.receiveShadow = true; scene.add(beach);

// venue ground pad (warm stone)
const pad = new THREE.Mesh(new THREE.PlaneGeometry(40,34), mat(COL.stone,{rough:1}));
pad.rotation.x = -Math.PI/2; pad.position.set(-1,0.02,2); pad.receiveShadow = true; scene.add(pad);

// pink "muhly" grass patches
function muhly(x,z,r){ const m=new THREE.Mesh(new THREE.CircleGeometry(r,20), mat(COL.pink,{rough:1})); m.rotation.x=-Math.PI/2; m.position.set(x,0.03,z); m.receiveShadow=true; scene.add(m); }
muhly(-30,18,6); muhly(28,20,7); muhly(-26,-22,5); muhly(30,-16,6); muhly(0,32,7);

// trees ring
function tree(x,z,pink=false,s=1){
  const g=new THREE.Group();
  add(g, cyl(0.22*s,0.3*s,2.2*s,COL.darkwood,8), 0,1.1*s,0);
  const c = pink?COL.pink:COL.grass2;
  add(g, sph(1.5*s,c,{rough:1}), 0,3.0*s,0);
  add(g, sph(1.1*s,c,{rough:1}), 0.8*s,3.6*s,0.3*s);
  add(g, sph(1.1*s,c,{rough:1}), -0.7*s,3.5*s,-0.2*s);
  g.position.set(x,0,z); scene.add(g); return g;
}
const treeSpots=[[-34,6],[-36,-6],[-30,-18],[-20,-30],[-6,-36],[10,-34],[24,-28],[34,-14],[37,4],[34,16],[26,28],[12,34],[-8,36],[-22,30],[-33,20],[18,30],[-16,-34],[31,-22],[38,-4],[6,37]];
treeSpots.forEach((p,i)=> tree(p[0],p[1], i%4===0, 0.9+(i%3)*0.25));

// small flower dots on lawn
function flowers(cx,cz,n){ for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; const r=2+ (i%3); const f=sph(0.18, i%2?COL.red:COL.yellow,{rough:1}); f.castShadow=false; add(scene,f, cx+Math.cos(a)*r, 0.2, cz+Math.sin(a)*r); } }
flowers(14,18,10); flowers(-14,16,9);

// ================= KURICHI FACTORY (building) =================
const FAC = new THREE.Group();
const HX=7, HZ=7, H=5, T=0.3;          // 14 x 14 footprint, 200㎡前提
// floor
add(FAC, (()=>{ const f=box(14,0.2,14,COL.cream); return f; })(), 0,0.1,0);
// walls (back + sides) red, with yellow band
function wall(w,h,d,x,y,z){ add(FAC, box(w,h,d,COL.red), x,y,z); }
wall(14,H,T, 0, H/2, -HZ);             // back
wall(T,H,14, -HX, H/2, 0);             // left
wall(T,H,14,  HX, H/2, 0);             // right
// yellow accent band near top (back + sides)
add(FAC, box(14.1,0.7,T+0.04, COL.yellow), 0, H-0.7, -HZ);
add(FAC, box(T+0.04,0.7,14.1, COL.yellow), -HX, H-0.7, 0);
add(FAC, box(T+0.04,0.7,14.1, COL.yellow),  HX, H-0.7, 0);
// front storefront: pillars + header + glass + door gap
add(FAC, box(0.6,H,0.6,COL.yellow), -HX+0.3, H/2, HZ);   // left pillar
add(FAC, box(0.6,H,0.6,COL.yellow),  HX-0.3, H/2, HZ);   // right pillar
add(FAC, box(14,0.9,0.5,COL.red),    0, H-0.45, HZ);      // header beam
const glassFront = box(12.6,3.4,0.12, COL.glass,{transparent:true, opacity:0.30, metal:0.1, rough:0.05});
add(FAC, glassFront, 0, 1.95, HZ);
// roof slab + checker fascia
add(FAC, box(15.4,0.4,15.4,COL.red), 0, H+0.2, 0);
const checkerTex = canvasTex((ctx,w,h)=>{ const n=16, sw=w/n, sh=h/2; for(let i=0;i<n;i++){ for(let j=0;j<2;j++){ ctx.fillStyle=((i+j)%2)?'#E3261D':'#ffffff'; ctx.fillRect(i*sw,j*sh,sw,sh);} } },512,64);
const fascia = new THREE.Mesh(new THREE.BoxGeometry(15.4,0.6,0.16), new THREE.MeshStandardMaterial({ map:checkerTex }));
add(FAC, fascia, 0, H-0.1, HZ+0.18);
// marquee sign on front top
const marqueeTex = canvasTex((ctx,w,h)=>{
  ctx.fillStyle='#E3261D'; rr(ctx,12,12,w-24,h-24,40); ctx.fill();
  ctx.strokeStyle='#FFC20E'; ctx.lineWidth=14; rr(ctx,12,12,w-24,h-24,40); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='900 150px Arial'; ctx.fillText('KURICHI LAND', w/2, h/2-22);
  ctx.fillStyle='#FFC20E'; ctx.font='bold 70px "Hiragino Sans",sans-serif'; ctx.fillText('クリチランド', w/2, h/2+92);
},1280,360);
add(FAC, signPlane(11,3.1, marqueeTex), 0, H+1.7, HZ+0.25);

// --- interior: main counter + canopy ---
const counter = box(8,1.1,1.6,COL.red); add(FAC, counter, 0,0.65,3.4);
add(FAC, box(8.3,0.16,1.9,COL.cream), 0,1.25,3.4);       // counter top
add(FAC, box(8.3,0.5,0.2,COL.yellow), 0,0.5,4.25);        // front kick band
// canopy over counter
add(FAC, box(8.6,0.25,2.2,COL.red), 0,3.3,3.4);
add(FAC, box(8.0,0.9,0.08, canvasFromText('Got KURICHI?','#FFC20E','#E3261D')), 0,2.7,4.45);
// menu board behind counter
add(FAC, box(6,1.8,0.12, canvasFromText('KURICHI MENU','#fff','#241f1a',true)), 0,2.6,-1.2);

// --- goods shelves (back-right) ---
const shelf = box(5,2.6,0.6,COL.yellow); add(FAC, shelf, 4.0,1.3,-6.2);
for(let r=0;r<3;r++) for(let c=0;c<5;c++){ const g=box(0.55,0.55,0.5, [COL.red,COL.cream,COL.choco,COL.yellow][(r+c)%4]); add(FAC,g, 2.2+c*0.85, 0.8+r*0.8, -6.0); }

// --- KURICHI FACTORY glass section (back-left) ---
const facBox = box(5,3,4,COL.glass,{transparent:true,opacity:0.22,rough:0.05}); add(FAC, facBox, -4.2,1.5,-4.5);
add(FAC, box(2.2,1.4,1.2,0xcfd3d6,{metal:0.6,rough:0.4}), -4.8,0.8,-4.5);  // machine
add(FAC, cyl(0.5,0.5,1.6,0xb9bdc0,12,{metal:0.6,rough:0.4}), -3.0,0.9,-4.0);
add(FAC, box(4.2,0.7,0.06, canvasFromText('KURICHI FACTORY','#241f1a','#FFC20E')), -4.2,3.0,-2.55);

// --- voxel mascot (inside-right, near entrance) ---
function mascot(){
  const g=new THREE.Group();
  add(g, cyl(0.95,0.95,0.3,COL.yellow,24), 0,0.15,0);     // base
  add(g, box(1.25,1.35,1.05,COL.cream), 0,1.0,0);          // body
  add(g, box(0.55,0.16,0.06,COL.red), 0,0.95,0.55);        // belly stripe
  add(g, box(1.45,1.15,1.15,COL.cream), 0,2.1,0);          // head
  add(g, box(0.2,0.24,0.06,COL.ink), -0.32,2.2,0.6);       // eye L
  add(g, box(0.2,0.24,0.06,COL.ink),  0.32,2.2,0.6);       // eye R
  add(g, box(0.5,0.12,0.06,COL.red), 0,1.85,0.6);          // mouth
  add(g, box(0.34,0.34,0.06,0xF4A6B8), -0.55,1.95,0.58);   // cheek L
  add(g, box(0.34,0.34,0.06,0xF4A6B8), 0.55,1.95,0.58);    // cheek R
  add(g, box(1.55,0.32,1.25,COL.red), 0,2.75,0);           // cap
  return g;
}
const mas = mascot(); mas.position.set(5.0,0,3.6); mas.rotation.y=-0.5; FAC.add(mas);

FAC.position.set(-4,0,-6);
scene.add(FAC);

// helper: text-on-panel texture
function canvasFromText(text, fg, bg, multi=false){
  return canvasTex((ctx,w,h)=>{
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    ctx.fillStyle=fg; ctx.textAlign='center'; ctx.textBaseline='middle';
    if(multi){
      const items=['PLAIN','STRAWBERRY','MATCHA','CHOCOLATE','LEMON'];
      ctx.font='bold 70px Arial'; ctx.fillText(text, w/2, 80);
      ctx.font='bold 52px Arial';
      items.forEach((t,i)=> ctx.fillText(t+'   ¥--', w/2, 180+i*70));
    } else {
      ctx.font='900 '+(text.length>12?110:150)+'px Arial';
      ctx.fillText(text, w/2, h/2);
    }
  }, 1024, multi?512:256);
}

// ================= car-face refrigerated showcase (icon) =================
function carShowcase(){
  const g=new THREE.Group();
  add(g, box(3.4,2.0,2.2,COL.red), 0,1.4,0);                 // body
  add(g, box(3.0,0.9,2.0,COL.yellow), 0,2.55,0);            // top showcase frame
  add(g, box(2.8,0.8,1.8,COL.glass,{transparent:true,opacity:0.3}), 0,2.55,0); // glass case
  for(let i=0;i<3;i++) add(g, sph(0.28,[COL.cream,COL.red,COL.choco][i]), -0.8+i*0.8,2.6,0); // products
  // face: windshield
  add(g, box(2.6,0.9,0.1,0x2b2f33,{metal:0.4,rough:0.3}), 0,1.95,1.12);
  // headlights
  add(g, cyl(0.32,0.32,0.12,COL.yellow,20), -0.95,1.25,1.16).rotation.x=Math.PI/2;
  add(g, cyl(0.32,0.32,0.12,COL.yellow,20),  0.95,1.25,1.16).rotation.x=Math.PI/2;
  // smile (torus arc)
  const smile=new THREE.Mesh(new THREE.TorusGeometry(0.7,0.09,10,24,Math.PI), mat(COL.ink));
  smile.position.set(0,1.05,1.13); smile.rotation.z=Math.PI; g.add(smile);
  // little sign
  add(g, box(2.2,0.5,0.06, canvasFromText('KURICHI','#fff','#E3261D')), 0,3.2,0);
  // wheels hint
  add(g, cyl(0.45,0.45,0.3,COL.ink,18), -1.2,0.45,0.9).rotation.z=Math.PI/2;
  add(g, cyl(0.45,0.45,0.3,COL.ink,18),  1.2,0.45,0.9).rotation.z=Math.PI/2;
  return g;
}
const car = carShowcase(); car.position.set(4.5,0,3.0); car.rotation.y=-0.35; scene.add(car);

// ================= KURICHI GARDEN (terrace) =================
const deck = box(26,0.18,11,COL.wood); deck.position.set(0,0.09,7.5); scene.add(deck);
// plank lines
for(let i=-12;i<=12;i+=2){ const l=box(0.05,0.2,11,COL.darkwood); l.position.set(i,0.1,7.5); l.castShadow=false; scene.add(l); }

function parasol(){ const g=new THREE.Group();
  add(g, cyl(0.07,0.07,3.0,COL.darkwood,8), 0,1.5,0);
  for(let i=0;i<8;i++){ const seg=cone(0.0,0.1,COL.cream); }
  const can=cone(2.0,0.9,COL.red,12); add(g, can, 0,3.2,0);
  add(g, cyl(0.0001,2.0,0.05,COL.yellow,12), 0,2.78,0);   // rim accent
  add(g, sph(0.12,COL.yellow), 0,3.7,0);
  return g;
}
function tableSet(x,z){
  const g=new THREE.Group();
  add(g, cyl(0.12,0.16,0.9,COL.cream,16), 0,0.45,0);       // pedestal
  add(g, cyl(0.95,0.95,0.12,COL.white,20), 0,0.95,0);      // top
  const seats=[[1.4,0],[-1.4,0],[0,1.4],[0,-1.4]];
  seats.forEach(s=>{ add(g, cyl(0.34,0.34,0.1,COL.red,16), s[0],0.5,s[1]); add(g, box(0.4,0.5,0.08,COL.red), s[0],0.85, s[1]+(s[1]>0?0.32:(s[1]<0?-0.32:0))); });
  add(g, parasol(), 0,0,0);
  g.position.set(x,0.18,z); scene.add(g); return g;
}
tableSet(-8,6); tableSet(-3.5,9); tableSet(6,6); tableSet(9.5,10.5); tableSet(1.5,11);

// planters along deck front
function planter(x,z){ const g=new THREE.Group(); add(g, box(1.6,0.5,0.7,COL.darkwood),0,0.25,0); add(g, box(1.5,0.2,0.6,COL.green),0,0.55,0); for(let i=0;i<4;i++) add(g, sph(0.13,i%2?COL.red:COL.yellow),-0.5+i*0.33,0.7,0); g.position.set(x,0.18,z); scene.add(g);}
planter(-11,12.6); planter(-6,12.6); planter(0,12.6); planter(6,12.6); planter(11,12.6);

// garden stone path -> photo spot
const path = new THREE.Mesh(new THREE.PlaneGeometry(3.4,9), mat(COL.stone,{rough:1}));
path.rotation.x=-Math.PI/2; path.position.set(0,0.05,17); scene.add(path);

// ---- photo spot ----
const PHOTO = new THREE.Group();
add(PHOTO, cyl(0.25,0.25,3.4,COL.yellow,12), -3,1.7,0);
add(PHOTO, cyl(0.25,0.25,3.4,COL.yellow,12),  3,1.7,0);
const emblemTex = canvasTex((ctx,w,h)=>{ ctx.clearRect(0,0,w,h); ctx.fillStyle='#E3261D'; ctx.beginPath(); ctx.arc(w/2,h/2,w/2-14,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=22; ctx.beginPath(); ctx.arc(w/2,h/2,w/2-30,0,7); ctx.stroke(); ctx.fillStyle='#fff'; ctx.font='900 150px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Got',w/2,h/2-70); ctx.fillStyle='#FFC20E'; ctx.font='900 130px Arial'; ctx.fillText('KURICHI?',w/2,h/2+70); },512,512);
const emblem = signPlane(3.2,3.2, emblemTex); emblem.position.set(0,2.4,0); PHOTO.add(emblem);
add(PHOTO, box(8,1.8,0.2, marqueeTex2()), 0,4.6,0);
add(PHOTO, box(3.2,0.4,1.0,COL.wood), 0,0.4,2.0);      // bench
PHOTO.position.set(0,0,22); PHOTO.rotation.y=Math.PI; scene.add(PHOTO);
function marqueeTex2(){ return canvasTex((ctx,w,h)=>{ ctx.fillStyle='#FFC20E'; rr(ctx,8,8,w-16,h-16,36); ctx.fill(); ctx.fillStyle='#E3261D'; ctx.font='900 150px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('KURICHI LAND',w/2,h/2); },1280,300); }

// entrance pylon sign
const pylon = new THREE.Group();
add(pylon, box(1.4,6,1.4,COL.red), 0,3,0);
add(pylon, box(1.6,1.4,0.1, canvasFromText('クリチ','#FFC20E','#E3261D')), 0,5,0.81);
add(pylon, box(1.6,1.4,0.1, canvasFromText('LAND','#fff','#E3261D')), 0,3.4,0.81);
pylon.position.set(-13,0,14); scene.add(pylon);

// ---------- zone labels ----------
const facLabel = makeLabel('KURICHI FACTORY','屋内 200㎡'); facLabel.position.set(-4,8.6,-6); scene.add(facLabel);
const gardenLabel = makeLabel('KURICHI GARDEN','屋外 450㎡'); gardenLabel.position.set(11,3.0,13.5); scene.add(gardenLabel);

// ---------- navigation: keys + presets ----------
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });

const VIEWS = {
  overview:{ pos:[30,24,36], tgt:[-2,2,0] },
  entrance:{ pos:[5,3.2,20], tgt:[-4,3,-2] },
  factory:{  pos:[-4,3,7],   tgt:[-4,2.6,-6] },
  garden:{   pos:[12,5,19],  tgt:[0,1.2,8] },
  photo:{    pos:[0,3.2,16],  tgt:[0,2.6,22] }
};
let fly=null;
function flyTo(v){ fly={ pos:new THREE.Vector3(...v.pos), tgt:new THREE.Vector3(...v.tgt) }; }
document.querySelectorAll('#views button[data-view]').forEach(b=> b.addEventListener('click',()=> flyTo(VIEWS[b.dataset.view])));
document.getElementById('fsbtn').addEventListener('click',()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); });

// ---------- resize ----------
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// ---------- loop ----------
const clock=new THREE.Clock();
const up=new THREE.Vector3(0,1,0);
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const speed=(keys['ShiftLeft']||keys['ShiftRight']?20:10)*dt;
  const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
  const right=new THREE.Vector3().crossVectors(fwd,up).normalize();
  const mv=new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp']) mv.add(fwd);
  if(keys['KeyS']||keys['ArrowDown']) mv.sub(fwd);
  if(keys['KeyD']||keys['ArrowRight']) mv.add(right);
  if(keys['KeyA']||keys['ArrowLeft']) mv.sub(right);
  if(keys['KeyE']) mv.y+=1; if(keys['KeyQ']) mv.y-=1;
  if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(speed); camera.position.add(mv); controls.target.add(mv); fly=null; }
  camera.position.y=Math.max(1.2,camera.position.y);
  if(fly){ camera.position.lerp(fly.pos,0.05); controls.target.lerp(fly.tgt,0.05); if(camera.position.distanceTo(fly.pos)<0.4) fly=null; }
  // keep labels facing camera scale stable handled by sprite
  controls.update();
  renderer.render(scene,camera);
}
animate();

// hide loader
setTimeout(()=>{ const l=document.getElementById('loader'); l.classList.add('hide'); setTimeout(()=>l.remove(),700); }, 500);
window.__KURICHI_READY=true;
</script>
