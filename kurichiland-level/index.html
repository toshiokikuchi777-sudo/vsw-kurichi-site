<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="KURICHI LAND ｜ レベルデザイン（3D平面・GLB）">
<meta property="og:description" content="各フロアを人間工学スケールで配置したブロックアウト。方位・窓・導線まで設計。">
<title>クリチランド ｜ レベルデザイン（GLBブロックアウト・人間工学スケール）</title>
<style>
  :root{ --red:#E3261D; --yellow:#FFC20E; --ink:#241f1a; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#dfe7ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}
  #app{position:fixed;inset:0}
  #hud{position:fixed;left:12px;top:12px;z-index:10;max-width:min(92vw,400px);background:rgba(36,31,26,.8);color:#fff;padding:12px 14px;border-radius:14px;border:2px solid var(--yellow)}
  #hud h1{margin:0 0 2px;font-size:16px} #hud h1 b{color:var(--yellow)}
  #hud .sub{font-size:11px;opacity:.85;line-height:1.6}
  #hud .legend{font-size:10.5px;margin-top:8px;line-height:1.8;opacity:.92}
  #hud .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px}
  #views{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:0 8px}
  #views button{cursor:pointer;border:none;border-radius:999px;padding:9px 14px;font-weight:800;font-size:12.5px;background:var(--red);color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.25)}
  #views button.on{background:var(--yellow);color:var(--ink)}
  #views button.ghost{background:rgba(255,255,255,.92);color:var(--ink)}
  #compass{position:fixed;right:16px;top:16px;z-index:10;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(0,0,0,.2)}
  #compass .dial{position:absolute;inset:0}
  #compass span{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800}
  #compass .n{top:4px;color:#2F6FD6}#compass .s{bottom:4px;color:#E3261D}
  #compass .e{top:50%;right:6px;left:auto;transform:translateY(-50%);color:#37A05A}
  #compass .w{top:50%;left:6px;transform:translateY(-50%);color:#caa400}
  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--yellow);color:var(--ink);transition:opacity .5s}
  #loader b{color:var(--red)} .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>KURICHI <b>LAND</b> ｜ レベルデザイン</h1>
  <div class="sub">人間工学スケールのブロックアウト（GLB）。<br>方位：上(青)=北／右(緑)=東／下(赤)=南(正面・川)／左(黄)=西<br>椅子0.45・卓0.74・カウンター1.0・主通路1.5m</div>
  <div class="legend">
    <i style="background:#E3261D"></i>椅子/カウンター &nbsp; <i style="background:#FFF3D6;border:1px solid #ccc"></i>卓上 &nbsp; <i style="background:#FFC20E"></i>棚/展示<br>
    <i style="background:#BFE3EA"></i>窓(開口) &nbsp; <i style="background:#CFE0EC"></i>冷凍 &nbsp; <i style="background:#C9CCD0"></i>厨房 &nbsp; <i style="background:#66B6D9"></i>導線
  </div>
</div>
<div id="compass"><div class="dial" id="dial"><span class="n">N</span><span class="s">S</span><span class="e">E</span><span class="w">W</span></div></div>
<div id="views">
  <button data-f="1F" class="on">1F FACTORY</button>
  <button data-f="2F">2F DINER</button>
  <button data-f="roof">屋上 SKY</button>
  <button data-f="all">全体</button>
  <button id="topbtn" class="ghost">真上(平面)</button>
  <button id="fsbtn" class="ghost">⛶ 全画面</button>
</div>
<div id="loader"><div style="font-size:24px;font-weight:900">KURICHI <b>LAND</b></div><div style="font-size:12px;opacity:.8">レベルデータを読み込み中…</div></div>

<script>
(function(){ function fail(m){var l=document.getElementById('loader');if(!l)return;l.innerHTML='<div style="text-align:center;padding:24px;max-width:320px"><b style="font-size:20px;color:#241f1a">表示できませんでした</b><div style="font-size:12px;margin-top:8px;color:#241f1a">'+(m||'')+'<br>Chrome/Safari最新版で開いてください。</div></div>';l.classList.remove('hide');}
  window.__fail=fail; window.addEventListener('error',e=>{if(!window.__READY)fail(e.message)}); setTimeout(()=>{if(!window.__READY)fail('読み込みに失敗しました。')},8000);})();
</script>
<script type="module">
import * as THREE from './lib/three.module.js';
import { OrbitControls } from './lib/jsm/controls/OrbitControls.js';
import { GLTFLoader } from './lib/jsm/loaders/GLTFLoader.js';
try{
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; app.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdfe7ee);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.05,500); camera.position.set(14,14,18);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=Math.PI*0.49;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a9aa8,0.9)); scene.add(new THREE.AmbientLight(0xffffff,0.35));
const sun=new THREE.DirectionalLight(0xfff4e2,1.4); sun.position.set(16,26,10); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=90; sun.shadow.camera.left=-20; sun.shadow.camera.right=20; sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20; sun.shadow.bias=-0.0005; scene.add(sun);
const grid=new THREE.GridHelper(40,40,0xb9c4cf,0xcdd6de); grid.position.y=-0.02; scene.add(grid);
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,48),new THREE.MeshStandardMaterial({color:0xe8eef2,roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.y=-0.06; ground.receiveShadow=true; scene.add(ground);

const loader=new GLTFLoader();
let current=null;
function frame(obj){
  const box=new THREE.Box3().setFromObject(obj); const c=box.getCenter(new THREE.Vector3()); const s=box.getSize(new THREE.Vector3());
  const r=Math.max(s.x,s.z)*0.9+s.y*0.5; controls.target.copy(c);
  camera.position.set(c.x+r*0.9,c.y+r*0.95,c.z+r*1.15);
}
function load(name){
  document.querySelectorAll('#views button[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===name));
  loader.load(name+'.glb?v=2',(g)=>{
    if(current){ scene.remove(current); }
    current=g.scene; current.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    scene.add(current); frame(current); window.__READY=true;
    const l=document.getElementById('loader'); if(l){ l.classList.add('hide'); setTimeout(()=>l.remove(),600); }
  }, undefined, (e)=>{ window.__fail('GLB読込エラー: '+name); });
}
document.querySelectorAll('#views button[data-f]').forEach(b=>b.addEventListener('click',()=>load(b.dataset.f)));
document.getElementById('topbtn').addEventListener('click',()=>{ if(!current)return; const box=new THREE.Box3().setFromObject(current); const c=box.getCenter(new THREE.Vector3()); const s=box.getSize(new THREE.Vector3()); controls.target.copy(c); camera.position.set(c.x+0.01,c.y+Math.max(s.x,s.z)*1.4,c.z); });
document.getElementById('fsbtn').addEventListener('click',()=>{ if(!document.fullscreenElement)document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); });
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

const dial=document.getElementById('dial');
function animate(){ requestAnimationFrame(animate);
  // compass: rotate so world North(-Z) maps correctly relative to view azimuth
  const dir=new THREE.Vector3(); camera.getWorldDirection(dir); const az=Math.atan2(dir.x,dir.z);
  dial.style.transform='rotate('+(az)+'rad)';
  controls.update(); renderer.render(scene,camera);
}
load('1F'); animate();
}catch(err){ if(window.__fail)window.__fail(err&&err.message); throw err; }
</script>
</body>
</html>
