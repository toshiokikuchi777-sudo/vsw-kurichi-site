<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KURICHI LAND ｜ 体験できるWebGL空間（2階建て／石家庄 Neverland）</title>
<style>
  :root{ --red:#E3261D; --yellow:#FFC20E; --cream:#FFF3D6; --ink:#241f1a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#bfe3f2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }
  #hud{ position:fixed; left:14px; top:14px; z-index:10; max-width:min(92vw,430px);
        background:rgba(36,31,26,.78); color:#fff; padding:14px 16px; border-radius:16px;
        border:2px solid var(--yellow); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #hud h1{ margin:0 0 2px; font-size:18px; letter-spacing:.5px; }
  #hud h1 b{ color:var(--yellow); }
  #hud .sub{ font-size:11.5px; opacity:.85; margin-bottom:10px; }
  #hud .keys{ font-size:11.5px; line-height:1.7; opacity:.92; }
  #hud .keys kbd{ background:#fff; color:var(--ink); border-radius:5px; padding:1px 6px; font-weight:700; font-size:11px; }
  #views{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10;
          display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:0 8px; }
  #views button{ cursor:pointer; border:none; border-radius:999px; padding:10px 15px; font-weight:800; font-size:13px;
          background:var(--red); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.25); transition:transform .12s; }
  #views button:hover{ transform:translateY(-2px); }
  #views button.alt{ background:var(--yellow); color:var(--ink); }
  #views button.ghost{ background:rgba(255,255,255,.92); color:var(--ink); }
  #loader{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
           flex-direction:column; gap:14px; background:var(--yellow); color:var(--ink); transition:opacity .6s; }
  #loader .logo{ font-size:30px; font-weight:900; letter-spacing:1px; }
  #loader .logo b{ color:var(--red); }
  #loader .bar{ width:180px; height:8px; background:rgba(0,0,0,.12); border-radius:999px; overflow:hidden; }
  #loader .bar i{ display:block; height:100%; width:40%; background:var(--red); border-radius:999px; animation:slide 1.1s infinite ease-in-out; }
  @keyframes slide{ 0%{margin-left:-40%} 100%{margin-left:100%} }
  .hide{ opacity:0; pointer-events:none; }
  @media (max-width:560px){ #hud .keys .desktoponly{ display:none; } }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <h1>KURICHI <b>LAND</b> <span style="font-size:12px;opacity:.8">体験デモ・2階建て</span></h1>
    <div class="sub">石家庄 Neverland ／ 1F FACTORY ・ 2F DINER ＋ GARDEN 450㎡</div>
    <div class="keys">
      <span class="desktoponly">🖱 ドラッグ＝見回す ／ ホイール＝ズーム<br>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動 ／ <kbd>Q</kbd><kbd>E</kbd> 上下 ／ <kbd>Shift</kbd> 加速<br></span>
      📱 1本指＝見回す ／ 2本指＝ズーム・移動<br>
      下のボタンで各フロアへ
    </div>
  </div>
  <div id="views">
    <button data-view="overview" class="alt">🛰 全体</button>
    <button data-view="entrance">🚪 入口</button>
    <button data-view="factory">🏭 1F FACTORY</button>
    <button data-view="diner">🍰 2F DINER</button>
    <button data-view="garden">🌿 GARDEN</button>
    <button id="dnbtn" class="ghost">🌙 夜にする</button>
    <button id="fsbtn" class="ghost">⛶ 全画面</button>
  </div>
  <div id="loader">
    <div class="logo">KURICHI <b>LAND</b></div>
    <div class="bar"><i></i></div>
    <div style="font-size:12px;opacity:.75">2階建てを組み立てています…</div>
  </div>

<script>
(function(){
  function fail(msg){
    var l=document.getElementById('loader'); if(!l) return;
    l.innerHTML='<div style="text-align:center;padding:26px;max-width:340px;color:#241f1a"><div style="font-size:22px;font-weight:900">3Dを表示できませんでした</div><div style="font-size:13px;margin-top:12px;line-height:1.75;opacity:.85">'+(msg||'お使いの環境が対応していない可能性があります。')+'<br><br>Safari / Chrome の最新版で開いてください。LINE・微信などのアプリ内ブラウザの場合は、メニューから「ブラウザで開く」をお試しください。</div></div>';
    l.classList.remove('hide');
  }
  window.__kurichiFail=fail;
  window.addEventListener('error',function(e){ if(!window.__KURICHI_READY) fail(e.message); });
  setTimeout(function(){ if(!window.__KURICHI_READY) fail('この環境では 3D（WebGL／JavaScript モジュール）が動作しないようです。'); },7000);
})();
</script>

<script type="module">
import * as THREE from './lib/three.module.js';
import { OrbitControls } from './lib/jsm/controls/OrbitControls.js';
try {

const COL = {
  red:0xE3261D, redD:0xb81d13, yellow:0xFFC20E, cream:0xFFF3D6, white:0xffffff,
  wood:0x9C6B3A, darkwood:0x5f3f22, grass:0x77b54b, grass2:0x5d9b3a,
  pink:0xEBA7C4, stone:0xD9CAA6, sand:0xE8D8AE, ink:0x241f1a,
  glass:0xBFE3EA, sky:0xBFE3F2, green:0x4E8A2E, water:0x4f9fd6, choco:0x7a4a22, deck:0xb98a52
};

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.sky);
scene.fog = new THREE.Fog(COL.sky, 80, 210);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1400);
camera.position.set(6, 10, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(-4, 5, -7);
controls.maxPolarAngle = Math.PI * 0.497;
controls.minDistance = 2; controls.maxDistance = 130;

const hemi=new THREE.HemisphereLight(0xffffff, 0x88a868, 0.85); scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff, 0.22); scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff3df, 1.55);
sun.position.set(38, 60, 30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
sun.shadow.bias = -0.00045;
scene.add(sun);

// helpers
function mat(color, o={}){ return new THREE.MeshStandardMaterial({ color, roughness:o.rough ?? 0.85, metalness:o.metal ?? 0.0, transparent:o.transparent||false, opacity:o.opacity ?? 1, emissive:o.emissive??0x000000, emissiveIntensity:o.ei??1, side:o.side||THREE.FrontSide }); }
function box(w,h,d,color,o={}){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,color,seg=24,o={}){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function sph(r,color,o={}){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function cone(r,h,color,seg=8,o={}){ const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg), mat(color,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function add(p,m,x,y,z){ m.position.set(x,y,z); p.add(m); return m; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function canvasTex(draw,w=1024,h=512){ const c=document.createElement('canvas'); c.width=w;c.height=h; const x=c.getContext('2d'); draw(x,w,h); const t=new THREE.CanvasTexture(c); t.anisotropy=8; t.colorSpace=THREE.SRGBColorSpace; return t; }
function signPlane(w,h,tex){ return new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide})); }
function panelTex(text,fg,bg){ return canvasTex((x,w,h)=>{ x.fillStyle=bg;x.fillRect(0,0,w,h); x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.font='900 '+(text.length>11?96:140)+'px Arial';x.fillText(text,w/2,h/2); },1024,256); }
function makeLabel(text,sub,col){
  const tex=canvasTex((x,w,h)=>{ x.clearRect(0,0,w,h); x.fillStyle='rgba(36,31,26,.86)'; rr(x,18,18,w-36,h-36,56); x.fill(); x.strokeStyle=col||'#FFC20E'; x.lineWidth=9; rr(x,18,18,w-36,h-36,56); x.stroke(); x.textAlign='center';x.textBaseline='middle'; x.fillStyle='#fff';x.font='bold 92px "Hiragino Sans",sans-serif';x.fillText(text,w/2,h/2-24); x.fillStyle=col||'#FFC20E';x.font='bold 54px "Hiragino Sans",sans-serif';x.fillText(sub,w/2,h/2+60); },1024,300);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:true})); s.scale.set(6.2,1.82,1); return s;
}

// ---- day/night + animation registries ----
const emissives=[], bulbs=[], steam=[], nightLights=[];
function reg(m,day,night){ if(m.material){ m.material.emissiveIntensity=day; } emissives.push({m,day,night}); return m; }
const tmesh=(w,h,d,t,o={})=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({map:t,roughness:o.rough??0.8,metalness:o.metal??0})); m.castShadow=true; m.receiveShadow=true; return m; };
const stripeTex=canvasTex((x,w,h)=>{const n=10,sw=w/n;for(let i=0;i<n;i++){x.fillStyle=(i%2)?'#E3261D':'#fff6ec';x.fillRect(i*sw,0,sw,h);}},512,128);
const checkerTex=canvasTex((x,w,h)=>{const n=16,sw=w/n,sh=h/2;for(let i=0;i<n;i++)for(let j=0;j<2;j++){x.fillStyle=((i+j)%2)?'#E3261D':'#fff';x.fillRect(i*sw,j*sh,sw,sh);}},512,64);

// ---- water + island ----
const water=new THREE.Mesh(new THREE.CircleGeometry(330,72), new THREE.MeshStandardMaterial({color:COL.water,roughness:0.25,metalness:0.15}));
water.rotation.x=-Math.PI/2; water.position.y=-0.35; scene.add(water);
const island=new THREE.Mesh(new THREE.CircleGeometry(40,72), mat(COL.grass,{rough:1}));
island.rotation.x=-Math.PI/2; island.receiveShadow=true; scene.add(island);
const beach=new THREE.Mesh(new THREE.RingGeometry(38,43,72), mat(COL.sand,{rough:1}));
beach.rotation.x=-Math.PI/2; beach.position.y=-0.06; beach.receiveShadow=true; scene.add(beach);
const pad=new THREE.Mesh(new THREE.PlaneGeometry(40,40), mat(COL.stone,{rough:1}));
pad.rotation.x=-Math.PI/2; pad.position.set(-2,0.02,-1); pad.receiveShadow=true; scene.add(pad);

function muhly(x,z,r){ const m=new THREE.Mesh(new THREE.CircleGeometry(r,20),mat(COL.pink,{rough:1})); m.rotation.x=-Math.PI/2; m.position.set(x,0.03,z); m.receiveShadow=true; scene.add(m); }
muhly(-30,18,6); muhly(28,20,7); muhly(-26,-22,5); muhly(30,-16,6); muhly(2,32,7);
function tree(x,z,pink,s){ const g=new THREE.Group(); add(g,cyl(0.22*s,0.3*s,2.2*s,COL.darkwood,8),0,1.1*s,0); const c=pink?COL.pink:COL.grass2; add(g,sph(1.5*s,c,{rough:1}),0,3*s,0); add(g,sph(1.1*s,c,{rough:1}),0.8*s,3.6*s,0.3*s); add(g,sph(1.1*s,c,{rough:1}),-0.7*s,3.5*s,-0.2*s); g.position.set(x,0,z); scene.add(g); }
[[-34,6],[-36,-6],[-30,-18],[-20,-30],[-6,-36],[12,-34],[24,-28],[34,-14],[37,4],[34,16],[26,28],[12,34],[-10,36],[-24,30],[-33,22],[20,32]].forEach((p,i)=>tree(p[0],p[1],i%4===0,0.9+(i%3)*0.25));

// ===================== BUILDING (2F + rooftop) =====================
const BLD = new THREE.Group();
const HX=7, HZ=7, F1=4.2, F2=4.0, T=0.3;            // 14 x 14 footprint
const lvl2 = F1;             // 2F floor
const roofY = F1+F2;         // 8.2 roof slab top
// --- 1F ---
add(BLD, box(14,0.2,14,COL.cream), 0,0.1,0);                 // 1F floor
add(BLD, box(14,F1,T,COL.red), 0,F1/2,-HZ);                  // back wall
add(BLD, box(T,F1,14,COL.red), -HX,F1/2,0);                  // left
add(BLD, box(T,F1,14,COL.red), HX,F1/2,0);                   // right
add(BLD, box(14.1,0.6,T+0.04,COL.yellow), 0,F1-0.6,-HZ);     // band
// glossy checker wainscot (base band, sides+back)
add(BLD, tmesh(14.06,0.9,0.06,checkerTex,{rough:0.3,metal:0.1}), 0,0.5,-HZ-0.03);
add(BLD, tmesh(0.06,0.9,14.06,checkerTex,{rough:0.3,metal:0.1}), -HX-0.03,0.5,0);
add(BLD, tmesh(0.06,0.9,14.06,checkerTex,{rough:0.3,metal:0.1}), HX+0.03,0.5,0);
// wood batten screen on left wall (Neverland harmony)
for(let i=0;i<12;i++) add(BLD, box(0.1,F1-0.6,0.1,COL.wood,{rough:0.9}), -HX-0.1,(F1-0.6)/2+0.3,-6+i*1.05);
// window boxes w/ flowers under 2F (added later with 2F)
// 1F storefront (front +z)
add(BLD, box(0.6,F1,0.6,COL.yellow), -HX+0.3,F1/2,HZ);
add(BLD, box(0.6,F1,0.6,COL.yellow), HX-0.3,F1/2,HZ);
add(BLD, box(14,0.8,0.5,COL.red), 0,F1-0.4,HZ);              // header beam
add(BLD, box(12.6,3.2,0.10,COL.glass,{transparent:true,opacity:0.24,metal:0.1,rough:0.05}), 0,1.9,HZ);
// vertical mullions + sill rail
for(let i=-2;i<=2;i++) add(BLD, box(0.1,3.2,0.16,COL.cream), i*2.5,1.9,HZ+0.03);
add(BLD, box(12.6,0.12,0.16,COL.cream), 0,2.7,HZ+0.03);
add(BLD, box(12.6,0.12,0.16,COL.cream), 0,0.45,HZ+0.03);
// pendant lights inside (warm glow at night)
for(let i=-1;i<=1;i++){ add(BLD, cyl(0.02,0.02,0.5,COL.ink,6), i*3,F1-0.55,HZ-1.3); const bb=sph(0.16,0xfff1c0,{emissive:0xFFC23C,ei:0.25}); add(BLD,bb,i*3,F1-0.92,HZ-1.3); reg(bb,0.25,1.7); }
// striped awning over storefront (slanted) + valance
(function(){ const a=tmesh(13.4,0.1,1.9,stripeTex,{rough:0.85}); a.rotation.x=-0.34; a.position.set(0,F1+0.02,HZ+1.05); BLD.add(a);
  const v=tmesh(13.4,0.5,0.06,stripeTex); v.position.set(0,F1-0.42,HZ+1.95); BLD.add(v); })();
// checker fascia
add(BLD, tmesh(14.2,0.5,0.16,checkerTex), 0,F1-0.95,HZ+0.18);
// --- 2F floor slab (overhang ledge) ---
add(BLD, box(14.8,0.4,14.8,COL.red), 0,F1+0.0,0);
// --- 1F interior ---
add(BLD, box(8,1.1,1.5,COL.red), 0,0.65,3.4);               // counter
add(BLD, box(8.2,0.15,1.8,COL.cream), 0,1.25,3.4);
add(BLD, box(8,0.7,0.07,panelTex('Got KURICHI?','#FFC20E','#E3261D')), 0,2.0,4.4);   // counter sign
add(BLD, box(5.6,1.7,0.12,COL.glass,{transparent:true,opacity:0.22,rough:0.05}), -4.0,1.6,-4.4); // factory glass
add(BLD, box(2.0,1.2,1.0,0xcfd3d6,{metal:0.6,rough:0.4}), -4.6,0.7,-4.6);            // machine
add(BLD, box(4.2,0.6,0.06,panelTex('KURICHI FACTORY','#241f1a','#FFC20E')), -4.0,2.7,-3.7);
const shelf=box(4.4,2.2,0.5,COL.yellow); add(BLD,shelf,4.2,1.1,-6.0);                // goods
for(let r=0;r<3;r++)for(let c=0;c<5;c++) add(BLD, box(0.5,0.5,0.45,[COL.red,COL.cream,COL.choco,COL.yellow][(r+c)%4]), 2.4+c*0.8,0.8+r*0.7,-5.9);
// mascot (1F right-front)
(function(){const g=new THREE.Group();
  add(g,cyl(0.9,0.9,0.3,COL.yellow,24),0,0.15,0); add(g,box(1.2,1.3,1.0,COL.cream),0,1.0,0);
  add(g,box(1.4,1.1,1.1,COL.cream),0,2.1,0); add(g,box(0.2,0.24,0.06,COL.ink),-0.3,2.2,0.58); add(g,box(0.2,0.24,0.06,COL.ink),0.3,2.2,0.58);
  add(g,box(0.5,0.12,0.06,COL.red),0,1.85,0.58); add(g,box(1.5,0.3,1.2,COL.red),0,2.75,0);
  g.position.set(5.0,0,3.4); g.rotation.y=-0.5; BLD.add(g);})();
// 1F 展示：エントランスの大ぬいぐるみ＆マスコット
add(BLD, box(1.3,2.0,1.3,COL.cream), -2.2,1.0,5.4);                       // 大きなクリチのぬいぐるみ
add(BLD, box(0.6,0.9,0.6,COL.cream), -3.6,0.45,5.6); add(BLD, box(0.28,0.45,0.12,COL.red), -3.6,1.1,5.85); // ハリチくん
add(BLD, box(0.6,0.8,0.6,COL.cream), 1.2,0.4,5.8);                        // クリチちゃん
// big marquee on 1F/2F band front
add(BLD, signPlane(11,2.9, canvasTex((x,w,h)=>{x.fillStyle='#E3261D';rr(x,12,12,w-24,h-24,40);x.fill();x.strokeStyle='#FFC20E';x.lineWidth=14;rr(x,12,12,w-24,h-24,40);x.stroke();x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.font='900 150px Arial';x.fillText('KURICHI LAND',w/2,h/2-20);x.fillStyle='#FFC20E';x.font='bold 66px "Hiragino Sans",sans-serif';x.fillText('クリチランド',w/2,h/2+90);},1280,360)), 0,F1+1.0,HZ+0.3);

// --- entrance portal arch + marquee bulbs (front-left) ---
(function(){ const p=new THREE.Group(); const fw=4.4, fh=3.4;
  add(p, box(0.32,fh,0.32,COL.yellow), -fw/2,fh/2,0);
  add(p, box(0.32,fh,0.32,COL.yellow), fw/2,fh/2,0);
  const arch=new THREE.Mesh(new THREE.TorusGeometry(fw/2,0.16,10,28,Math.PI), mat(COL.yellow)); arch.position.set(0,fh,0); arch.castShadow=true; p.add(arch);
  const pts=[];
  for(let t=0;t<=12;t++){ const a=Math.PI*(t/12); pts.push([Math.cos(a)*fw/2, fh+Math.sin(a)*fw/2]); }
  for(let i=1;i<=6;i++){ pts.push([-fw/2, i/6*fh]); pts.push([fw/2, i/6*fh]); }
  pts.forEach(q=>{ const b=sph(0.1,0xfff4c0,{emissive:0xFFC20E,ei:0.25}); b.castShadow=false; add(p,b,q[0],q[1],0.22); bulbs.push(b); });
  add(p, box(2.0,0.5,0.06, panelTex('OPEN','#fff','#E3261D')), 0,fh-0.55,0.12);
  p.position.set(-3.2,0.1,HZ+0.7); BLD.add(p);
})();
// neon frame around the big marquee
(function(){ const fy=F1+1.0, fz=HZ+0.34, w=11.2, h=3.1, t=0.12, mk=()=>mat(0xFFC20E,{emissive:0xFFC20E,ei:0.3});
  [[0,h/2,w,t],[0,-h/2,w,t],[-w/2,0,t,h],[w/2,0,t,h]].forEach(s=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(s[2],s[3],0.08),mk()); add(BLD,m,s[0],fy+s[1],fz); reg(m,0.3,1.9); });
})();
// --- 2F (DINER) ---
const y2=lvl2+F2/2+0.2;
add(BLD, box(14,F2,T,COL.red), 0,y2,-HZ);                    // back
add(BLD, box(T,F2,14,COL.red), -HX,y2,0);                    // left

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// ---- day / night ----
const skyDay=new THREE.Color(COL.sky), skyNight=new THREE.Color(0x141d33);
let night=false;
const np1=new THREE.PointLight(0xffd9a0,0,32); np1.position.set(-11,7,4); scene.add(np1); nightLights.push(np1);
const np2=new THREE.PointLight(0xfff0c0,0,28); np2.position.set(-7,13,-3); scene.add(np2); nightLights.push(np2);
function setNight(on){ night=on;
  scene.background.copy(on?skyNight:skyDay); scene.fog.color.copy(on?skyNight:skyDay);
  sun.intensity=on?0.32:1.55; hemi.intensity=on?0.45:0.85; amb.intensity=on?0.55:0.22; renderer.toneMappingExposure=on?1.18:1.05;
  emissives.forEach(e=>{ if(e.m.material) e.m.material.emissiveIntensity=on?e.night:e.day; });
  nightLights.forEach(l=>l.intensity=on?1.1:0);
  const b=document.getElementById('dnbtn'); if(b) b.textContent=on?'☀ 昼にする':'🌙 夜にする';
}
document.getElementById('dnbtn').addEventListener('click',()=>setNight(!night));

const clock=new THREE.Clock(); const up=new THREE.Vector3(0,1,0); let loaderShown=true;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const sp=(keys['ShiftLeft']||keys['ShiftRight']?22:11)*dt;
  const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
  const right=new THREE.Vector3().crossVectors(fwd,up).normalize();
  const mv=new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp'])mv.add(fwd); if(keys['KeyS']||keys['ArrowDown'])mv.sub(fwd);
  if(keys['KeyD']||keys['ArrowRight'])mv.add(right); if(keys['KeyA']||keys['ArrowLeft'])mv.sub(right);
  if(keys['KeyE'])mv.y+=1; if(keys['KeyQ'])mv.y-=1;
  if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(sp); camera.position.add(mv); controls.target.add(mv); fly=null; }
  camera.position.y=Math.max(1.2,camera.position.y);
  if(fly){ camera.position.lerp(fly.pos,0.05); controls.target.lerp(fly.tgt,0.05); if(camera.position.distanceTo(fly.pos)<0.4) fly=null; }
  // animated details
  const tt=clock.elapsedTime;
  for(let i=0;i<bulbs.length;i++){ const on=(Math.floor(tt*4)+i)%3===0; if(bulbs[i].material) bulbs[i].material.emissiveIntensity = night ? (on?2.0:0.5) : (on?0.45:0.16); }
  for(const s of steam){ const p=((tt*0.45+s.ph)%1); s.m.position.y=s.base+p*2.4; s.m.scale.setScalar(0.6+p*1.5); if(s.m.material) s.m.material.opacity=(night?0.55:0.72)*(1-p); }
  controls.update(); renderer.render(scene,camera);
  if(loaderShown){ loaderShown=false; const l=document.getElementById('loader'); if(l){ l.classList.add('hide'); setTimeout(()=>l.remove(),700); } }
}
window.__KURICHI_READY=true;
animate();
} catch(err){ if(window.__kurichiFail) window.__kurichiFail(err && err.message); throw err; }
